  async function sendCmd(op, extra) {
    var sk = cmdKeyGet();
    if (!sk && (op === 'setprompt' || (op === 'regen' && extra && extra.prompt))) {
      toast(L('свой промпт с поста на этом устройстве не принимается: фрагмент не видит хранилище плагина — нажми ↻ без своего промпта'));
      return false;
    }
    try {
      var arQ = (curV && curV.ar) || cfgAr;
      if (op === 'regen' || op === 'more' || op === 'restyle') {
        holdAt = (curV && curV.at) || 0;
        holdUntil = Date.now() + 20000;

        showBusy(arQ, L('рисую картинку…'), 'stop');
      } else if (op === 'edit') {
        holdAt = (curV && curV.at) || 0;
        holdUntil = Date.now() + 20000;
        showBusy(arQ, L('дорабатываю…'), 'stop');
      } else if (op === 'upscale') {
        holdAt = (curV && curV.at) || 0;
        holdUntil = Date.now() + 20000;
        showBusy(arQ, L('улучшаю качество…'), 'stop');
      } else if (op === 'stopall' && busyEl) {
        holdAt = (curV && curV.at) || 0;
        holdUntil = Date.now() + 2500;
        showBusy(arQ, L('останавливаю…'), 'none');
      }
      if (op === 'regen' || op === 'more' || op === 'restyle' || op === 'edit' || op === 'upscale') fastStart();
    } catch (e) {}
    var cmd = { op: op, id: msgId, at: Date.now(), cid: String(Date.now()) + '_' + Math.random().toString(36).slice(2, 6) };
    if (extra) for (var k in extra) cmd[k] = extra[k];
    cmd.at = Date.now();
    if (sk) cmd.sig = hmacHex(sk, cmdCanon(cmd, true));

    var sent = false;
    try {
      var q = null;
      try {
        q = await tavo.get('iigp_cmdq', 'global');
      } catch (e0) {}
      if (!Array.isArray(q)) q = [];
      q.push(cmd);
      if (q.length > 8) q = q.slice(q.length - 8);
      await tavo.set('iigp_cmdq', q, 'global');

      for (var vr = 0; vr < 2; vr++) {
        var chk = null;
        try {
          chk = await tavo.get('iigp_cmdq', 'global');
        } catch (e1) {}

        if (!Array.isArray(chk) || !chk.length) break;
        var mine = false;
        for (var ci = 0; ci < chk.length; ci++) {
          if (chk[ci] && chk[ci].cid === cmd.cid) { mine = true; break; }
        }
        if (mine) break;
        var q2 = Array.isArray(chk) ? chk.slice() : [];
        q2.push(cmd);
        if (q2.length > 8) q2 = q2.slice(q2.length - 8);
        try {
          await tavo.set('iigp_cmdq', q2, 'global');
        } catch (e2) {}
      }
      sent = true;
    } catch (e) {}
    if (!sent) {
      try {
        await tavo.set('iigp_cmd', cmd, 'global');
      } catch (e) {}
    }

    try {
      localStorage.setItem('iig_ping', String(Date.now()));
    } catch (e) {}
    setTimeout(function () { poll(0); }, 500);
  }

  function tkOf(c) {
    c = String(c || '');

    var re = /<!--\s*iig:([a-z0-9_]{4,40})\s*-->/gi;
    var mk = null;
    var mm = re.exec(c);
    while (mm) {
      mk = mm;
      mm = re.exec(c);
    }
    if (mk) return mk[1].toLowerCase();
    c = c
      .replace(/<[^>]{0,}>/g, ' ')
      .replace(/[^0-9A-Za-z\u0400-\u04FF]+/g, ' ')
      .trim().toLowerCase().slice(0, 600);
    var n = 2166136261;
    for (var i = 0; i < c.length; i++) n = Math.imul(n ^ c.charCodeAt(i), 16777619) >>> 0;
    return n.toString(36);
  }

    var own = null;
    try {
      own = await tavo.get('iig_m' + msgId, 'chat');
    } catch (e) {
      return undefined;
    }
    if (own && own.state && staleFor(own)) {
      var before = String((msg && msg.content) || '');
      try {
        var m2 = await tavo.message.current();
        if (m2 && m2.id === msgId && m2.content) msg = m2;
      } catch (e2) {}
      var after = String((msg && msg.content) || '');
      if (own.state === 'ok' && staleFor(own) && after === before && !/<!--\s*iig:[a-z0-9_]{4,40}\s*-->/i.test(after)) {
        staleMiss = null;
        return own;
      }
    }
    if (own && own.state && !staleFor(own)) {
      staleMiss = null;
      return own;
    }
    if (own && own.state) {
      var rv = await rolledView();
      if (rv || own.state !== 'ok') {
        staleMiss = null;
        return rv;
      }
      var tkN = tkOf((msg && msg.content) || '');
      var tNow = Date.now();
      if (staleMiss && staleMiss.tk === tkN && tNow - staleMiss.at >= 2000) {
        staleMiss = null;
        return null;
      }
      if (!staleMiss || staleMiss.tk !== tkN) staleMiss = { tk: tkN, at: tNow };
      return undefined;
    }
    staleMiss = null;
    try {
      var old = await tavo.get('iig_img', { scope: 'message', id: msgId });
      if (old && old.state && !staleFor(old)) {
        if (await tavo.get('iig_m' + msgId + '_x', 'chat')) return readLegacy();
        return old;
      }
    } catch (e) {
      return undefined;
    }
    return readLegacy();
  }

  function render(v) {
    if (v === undefined) return false;
    if (!v || !v.state) {
      if (busyEl && Date.now() < holdUntil) return true;

      if (curV && curV.ph && Date.now() < phUntil) return false;

      if (!skipNote) clearAll();
      return false;
    }
    skipNote = false;
    if (v.state === 'prompt' || v.state === 'image') {
      var ar = v.ar || (curV && curV.ar) || cfgAr;
      showBusy(ar, v.state === 'prompt' ? L('пишу промпт…') : L('рисую картинку…'), 'stop');
      return true;
    }
    if (v.state === 'error') {

      showStrip((v.stopped ? '' : L('картинка не вышла: ')) + errMask(v.error), 'regen');
      return false;
    }
    if (v.state === 'ok' && !v.path && v.url) {
      urlPic(v);
      return false;
    }
    if (v.state === 'ok' && v.path) {
      if (holdUntil > Date.now() && (v.at || 0) === holdAt) return true;
      holdUntil = 0;
      var sig = sigOf(v);
      if (sig !== lastState) {
        lastState = sig;
        setPic(v);
      } else if (busyEl) {
        setPic(v);
      }
      return false;
    }
    return false;
  }

  var chainT = null;
  var probeT = null;
  var slowT = null;
  function later(step, ms) {
    clearTimeout(chainT);
    chainT = setTimeout(function () {
      if (iigGone()) return iigTeardown();
      poll(step);
    }, ms);
  }

  iigTimersOff = function () {
    try { clearTimeout(chainT); } catch (e0) {}
    try { clearInterval(idleT); } catch (e0) {}
    idleT = null;
    try { clearInterval(probeT); } catch (e0) {}
    try { clearInterval(slowT); } catch (e0) {}
    try { clearTimeout(fitT); } catch (e0) {}
    try { clearTimeout(guardT); } catch (e0) {}
    try { if (fitRo) fitRo.disconnect(); } catch (e0) {}
    fitRo = null;
  };

  var idleT = null;
  var isLastMsg = false;
  var idleN = 0;
  var watchTk = '';
  var watchSt = '';
  function idle() {
    if (iigDead) return;
    if (idleT) return;
    if (isLastMsg || Date.now() < fastUntil) {

      idleT = setInterval(async function () {
        if (iigGone()) return iigTeardown();
        if (!isLastMsg && Date.now() >= fastUntil) {
          try { clearInterval(idleT); } catch (e2) {}
          idleT = null;
          return idle();
        }
        if (document.hidden) return;
        idleN++;
        if (idleN % 8 === 0) return later(90, 0);
        try {
          var mP = tavo.message.current();
          var sP = null;
          try { sP = Promise.resolve(tavo.get('iig_m' + msgId, 'chat')); } catch (e0) {}
          var m2 = await mP;
          var s2 = null;
          if (sP) { try { s2 = await sP; } catch (e1) {} }
          if (s2 && s2.state) {
            var sg = s2.state + '|' + (s2.path || '') + '|' + (s2.at || '') + '|' + (s2.ar || '');
            if (sg !== watchSt) {
              watchSt = sg;
              return later(0, 0);
            }
          }
          if (m2 && m2.id === msgId && m2.content) {
            var t2 = tkOf(m2.content);
            if ((curV && curV.tk === t2) || watchTk === t2) return;
            watchTk = t2;
            msg = m2;
            later(0, 0);
          }
        } catch (e) {}

      }, 5000);
      return;
    }

    idleT = setInterval(function () {
      if (iigGone()) return iigTeardown();
      if (document.hidden) return;
      later(90, 0);
    }, 120000 + Math.floor(Math.random() * 45000));
  }

  async function poll(step) {
    var v = await read();
    if (v === undefined && staleMiss) {
      render(v);
      return later(step + 1, 2100);
    }
    if (v !== undefined && (!v || !v.state) && step === 8 && Date.now() < fastUntil && Date.now() < holdUntil) {
      render(v);
      return later(8, 1500);
    }
    if (v !== undefined && (!v || !v.state) && step === 8 && autoOn !== false) {

      var last = null;
      try {
        last = await tavo.get('iigp_auto_last', 'global');
      } catch (e) {}

      if (last && last.id === msgId && last.skipped) {
        skipNote = true;
        showStrip(isLastMsg ? last.skipped : '', 'gen');
        return idle();
      }
      if (!last || last.id !== msgId) {
        skipNote = true;
        showStrip(isLastMsg ? L('движок не увидел этот пост') : '', 'gen');
        return idle();
      }
    }
    var busy = render(v);
    if (busy && step < 200) return later(step + 1, step < 40 ? 1500 : 4000);

    if (!busy && !isLastMsg && v && v.state === 'ok') return idle();
    if (step < 8) return later(step + 1, 1500);
    idle();
  }

  var bootDelay = 50;
  try {
    var btm = parseInt(localStorage.getItem('iig_btm') || '0', 10) || 0;
    var bnow = Date.now();

    if (bnow - btm < 400) bootDelay = 250;
    localStorage.setItem('iig_btm', String(bnow));
  } catch (e) {}
  setTimeout(function () {
  (async function () {

    var vmP = null;
    try {
      vmP = Promise.resolve(tavo.get('iig_vm', 'chat'));
    } catch (e) {
      vmP = null;
    }
    try {
      msg = await tavo.message.current();
    } catch (e) {}
    if (!msg || !msg.id) {
      fit('boot');
      return;
    }
    msgId = msg.id;
    fastLoad();
    var tk0 = '';
    var isChar = msg.role === 'assistant' && !msg.hidden;

    try {
      if (isChar) {
        tk0 = tkOf(msg.content || '');
        var c0 = tk0 ? vcGet(tk0) : null;
        if (c0) {
          var ar0 = c0.ar || '';
          setPic({ state: 'ok', key: 'iig_m' + msgId, tk: tk0, path: c0.p, ar: ar0, at: 1, syn: 1 });
          lastState = c0.p + '|1|' + ar0;
        }
      }
    } catch (e) {}
    if (isChar && vmP) {
      vmP.then(function (vm0) {
        try {
          if (hasPic) return;
          var e0 = vm0 && vm0[msgId];
          if (!e0 || !e0.p) return;
          if (e0.tk && e0.tk === tk0) {
            var arV = e0.ar || '';
            setPic({ state: 'ok', key: 'iig_m' + msgId, tk: tk0, path: e0.p, ar: arV, at: 1, syn: 1 });
            lastState = e0.p + '|1|' + arV;
          } else {
            phUntil = Date.now() + 15000;
            setPic({ state: 'ok', key: 'iig_m' + msgId, tk: '', path: e0.p, ar: e0.ar || '', at: 1, syn: 1, ph: 1 });
          }
        } catch (e) {}
      }, function () {});
    }

    var preSt = null;
    await Promise.all([
      applyFrameCss(),
      (async function () {

        try {
          var cntL = await tavo.message.count();

          if (typeof msg.index === 'number') {
            isLastMsg = (msg.index === cntL - 1);
          } else {
            var lastL = await tavo.message.find(cntL - 1);
            isLastMsg = !!(lastL && lastL[0] && lastL[0].id === msgId);
          }
        } catch (e) {}
      })(),
      (async function () {
        try {
          preSt = await tavo.get('iig_m' + msgId, 'chat');
          if (!preSt || !preSt.state) {
            try {
              preSt = await tavo.get('iig_img', { scope: 'message', id: msgId });
            } catch (e0) {}
          }

          if (isChar && preSt && preSt.state === 'ok' && preSt.path && !staleFor(preSt) && (!hasPic || (curV && curV.ph))) {
            phUntil = 0;
            lastState = sigOf(preSt);
            setPic(preSt);
          }
        } catch (e) {}
      })()
    ]);

    try {
      if (autoOn !== false && !hasPic && (!preSt || !preSt.state) && msg.role === 'assistant' && !msg.hidden && String(msg.content || '').length > 40 && isLastMsg) {
        showBusy(cfgAr, L('жду картинку…'), 'none');
      } else if (!hasPic && (!preSt || !preSt.state) && msg.role === 'assistant' && !msg.hidden && isLastMsg) {
        skipNote = true;
        showStrip('', 'gen');
      }
    } catch (e) {}

    try {
      iigListen(window, 'storage', function (ev) {
        if (iigGone()) return iigTeardown();
        if (!ev) return;

        if (ev.key === 'iig_rev') return later(0, 0);
        if (ev.key !== 'iig_frame_css' && ev.key !== 'iig_frame_rev') return;
        applyFrameCss(true);
      });
    } catch (e) {}
    try {
      iigListen(document, 'visibilitychange', function () {
        if (iigGone()) return iigTeardown();
        if (!document.hidden) applyFrameCss(true);
      });
    } catch (e) {}

    if (isChar && !isLastMsg && !hasPic && (!preSt || !preSt.state)) {
      if (msg.role === 'assistant' && !msg.hidden) {
        skipNote = true;
        showStrip('', 'gen');
      }
      later(90, 12000);
      if (Date.now() < fastUntil) poll(0);
      idle();
      return;
    }
    var probeN = 0;
    probeT = setInterval(function () {
      if (iigGone()) return iigTeardown();
      probeN++;
      var seen = null;
      try {
        seen = localStorage.getItem('iig_frame_css');
      } catch (e) {}
      if (seen) {
        clearInterval(probeT);
        applyFrameCss(true);
        return;
      }
      applyFrameCss(true);
      if (!isLastMsg && probeN >= 2) {
        clearInterval(probeT);
        return;
      }
      if (probeN >= 10) {
        clearInterval(probeT);
        if (!isLastMsg) return;
        var slowN = 0;
        slowT = setInterval(function () {
          if (iigGone()) return iigTeardown();
          if (document.hidden) return;
          slowN++;
          applyFrameCss(slowN % 8 !== 0);
        }, 8000);
      }
    }, 3000);
    poll(0);
  })();
  }, bootDelay);
})();

  } catch (e) {
    iigFail(e, L('загрузка'));
  }
})();
</script>
