  function taArOf(w, h) {
    w = Number(w) || 0;
    h = Number(h) || 0;
    if (!(w > 0) || !(h > 0)) return '';
    var r = Math.log(w / h);
    var best = '';
    var bd = Infinity;
    for (var i = 0; i < AR.length; i++) {
      var m = String(AR[i]).match(/^(\d+):(\d+)$/);
      if (!m) continue;
      var d = Math.abs(r - Math.log(parseInt(m[1], 10) / parseInt(m[2], 10)));
      if (d < bd) {
        bd = d;
        best = AR[i];
      }
    }
    return best;
  }

  function taKsName(s) {
    return String(s == null ? '' : s).trim().toLowerCase().replace(/_gpu$/, '');
  }

  function taSamplerCanon(sampler, sched) {
    var s = String(sampler == null ? '' : sampler).trim();
    var sc = String(sched == null ? '' : sched).trim().toLowerCase();
    var keep = (sc === 'simple' || sc === 'beta') ? sc : '';
    if (!s) return { sampler: '', sched: keep };
    if (TA_SAMPLERS.indexOf(s) >= 0) return { sampler: s, sched: keep };
    var k = taKsName(s);
    var want = (TA_SCHEDS.indexOf(sc) > 0 && !keep) ? sc : 'normal';
    var hit = null,
      near = null,
      any = null;
    for (var i = 0; i < TA_KSAMPLERS.length; i++) {
      var p = TA_KSAMPLERS[i];
      if (taKsName(p[1]) !== k) continue;
      if (!any) any = p;
      if (!near && p[2] === 'normal') near = p;
      if (!hit && p[2] === want) hit = p;
    }
    var got = hit || near || any;
    if (got) return { sampler: got[0], sched: keep };
    var low = s.toLowerCase();
    for (var j = 0; j < TA_SAMPLERS.length; j++) {
      if (TA_SAMPLERS[j].toLowerCase() === low) return { sampler: TA_SAMPLERS[j], sched: keep };
    }
    return { sampler: '', sched: keep };
  }

  function txSamplerOf(s, sched) {
    var base = String(s == null ? '' : s).trim();
    var sc = String(sched == null ? '' : sched).trim().toLowerCase();
    var suf = { karras: ' Karras', exponential: ' Exponential', 'sgm uniform': ' SGM Uniform', sgm_uniform: ' SGM Uniform' }[sc];
    if (base && suf && TA_SAMPLERS.indexOf(base + suf) >= 0) return { sampler: base + suf, sched: '' };
    return taSamplerCanon(base, sc);
  }

  function txRound(n) {
    n = Number(n) || 0;
    if (!(n > 0)) return 0;
    return Math.min(1536, Math.max(512, Math.round(n / 64) * 64));
  }

  function txDimsOf(ar, base) {
    var d = TA_DIMS[ar] || TA_DIMS['1:1'];
    var k = TA_BASE_K[base] || 1;
    return { w: txRound(d[0] * k), h: txRound(d[1] * k) };
  }

  function txNum(id, lo, hi, def) {
    var e = txEl(id);
    var n = parseFloat(e ? e.value : '');
    if (isNaN(n)) return def;
    return Math.min(hi, Math.max(lo, n));
  }

  function txSide(id) {
    return txRound(txNum(id, 0, 100000, 0));
  }

  function txText(id, max) {
    var e = txEl(id);
    return String((e && e.value) || '').trim().slice(0, max);
  }

  function txEmbRows() {
    var out = [];
    for (var i = 1; i <= TA_EMB_N; i++) {
      var id = taIdOf(txEl('emb' + i) ? txEl('emb' + i).value : '');
      if (!id) continue;
      out.push({ id: id, w: txNum('ew' + i, 0.05, 2, 1), key: '' });
    }
    return out;
  }

  function txRead() {
    return {
      mode: TX_MODES.indexOf(txMode) >= 0 ? txMode : 'txt2img',
      n: Math.round(txNum('n', 1, 4, 1)),
      ckpt: taIdOf(txEl('ckpt') ? txEl('ckpt').value : ''),
      ckptName: String(txCkptName || '').slice(0, 80),
      ckptKey: txText('ckptkey', 128),
      loras: txLoras.slice(0, TA_LORA_N).map(function(l) {
        return { id: l.id, w: l.w, key: '' };
      }),
      embeds: txEmbRows(),
      vae: (txEl('vae') && txEl('vae').value) || TA_DEF.vae,
      sampler: (txEl('sampler') && txEl('sampler').value) || '',
      sched: (txEl('sched') && txEl('sched').value) || '',
      base: (txEl('base') && txEl('base').value) || TA_DEF.base,
      steps: Math.round(txNum('steps', 1, 60, TA_DEF.steps)),
      cfg: txNum('cfg', 0, 30, TA_DEF.cfg),
      clip: Math.round(txNum('clip', 1, 12, TA_DEF.clip)),
      seed: Math.round(txNum('seed', 0, 4294967295, 0)),
      guidance: txNum('guidance', 0, 20, 0),
      ensd: Math.round(txNum('ensd', 0, 4294967295, 0)),
      w: txSide('w'),
      h: txSide('h'),
      neg: txText('neg', 1500),
      prompt: txText('prompt', 4000),
      hires: !!(txEl('hires') && txEl('hires').checked),
      upscaler: (txEl('hr_model') && txEl('hr_model').value) || TA_DEF.upscaler,
      hrScale: parseFloat(txEl('hr_scale') ? txEl('hr_scale').value : '') || 1.5,
      hrSteps: Math.round(txNum('hr_steps', 1, 60, TA_DEF.hrSteps)),
      hrDenoise: txNum('hr_denoise', 0, 1, TA_DEF.hrDenoise),
      ad: !!(txEl('ad') && txEl('ad').checked),
      adModel: (txEl('ad_model') && txEl('ad_model').value) || TA_DEF.adModel,
      adDenoise: txNum('ad_denoise', 0, 1, TA_DEF.adDenoise),
      adConf: txNum('ad_conf', 0.05, 1, TA_DEF.adConf),
      adPrompt: txText('ad_prompt', 500),
      adNeg: txText('ad_neg', 500),
      edit: txNum('denoise', 0.05, 1, TA_DEF.edit),
      tags: !!(txEl('tags') && txEl('tags').checked),
      bymodel: !!(txEl('bymodel') && txEl('bymodel').checked)
    };
  }

  function txTa(tx) {
    tx = tx || txRead();
    return {
      ckpt: tx.ckpt,
      ckptKey: tx.ckptKey,
      loras: tx.loras,
      embeds: tx.embeds,
      vae: tx.vae,
      sampler: tx.sampler,
      sched: tx.sched,
      base: tx.base,
      steps: tx.steps,
      cfg: tx.cfg,
      clip: tx.clip,
      seed: tx.seed,
      guidance: tx.guidance,
      ensd: tx.ensd,
      w: tx.w,
      h: tx.h,
      neg: tx.neg,
      hires: tx.hires,
      upscaler: tx.upscaler,
      hrScale: tx.hrScale,
      hrSteps: tx.hrSteps,
      hrDenoise: tx.hrDenoise,
      ad: tx.ad,
      adModel: tx.adModel,
      adDenoise: tx.adDenoise,
      adConf: tx.adConf,
      adPrompt: tx.adPrompt,
      adNeg: tx.adNeg,
      edit: tx.edit,
      tags: false,
      prompt: tx.prompt
    };
  }

  function txFill(o) {
    o = (o && typeof o === 'object') ? o : {};
    if (!txEl('root')) return;
    var set = function(id, v) {
      var e = txEl(id);
      if (e) e.value = v == null ? '' : String(v);
    };
    var num = function(k, id, def) {
      var n = parseFloat(o[k]);
      set(id, isNaN(n) ? def : n);
    };
    set('ckpt', o.ckptRaw || o.ckpt || '');
    txCkptName = typeof o.ckptName === 'string' ? o.ckptName.slice(0, 80) : '';
    set('ckptkey', typeof o.ckptKey === 'string' ? o.ckptKey.slice(0, 128) : '');
    txLoras = [];
    var ls = Array.isArray(o.loras) ? o.loras : [];
    for (var i = 0; i < ls.length && txLoras.length < TA_LORA_N; i++) {
      var l = ls[i];
      var lid = taIdOf(l && typeof l === 'object' ? l.id : l);
      if (!lid) continue;
      var lw = parseFloat(l && typeof l === 'object' ? l.w : 1);
      txLoras.push({ id: lid, w: isNaN(lw) ? 1 : Math.min(2, Math.max(0.05, lw)) });
    }
    var es = Array.isArray(o.embeds) ? o.embeds : [];
    for (var j = 1; j <= TA_EMB_N; j++) {
      var e = es[j - 1];
      var eid = e && typeof e === 'object' ? e.id : e;
      set('emb' + j, eid ? eid : '');
      set('ew' + j, e && typeof e === 'object' && e.w != null ? e.w : 1);
    }
    var sc = taSamplerCanon(o.sampler == null ? TA_DEF.sampler : o.sampler, o.sched);
    set('vae', TA_VAES.indexOf(o.vae) >= 0 ? o.vae : TA_DEF.vae);
    set('sampler', sc.sampler);
    set('sched', sc.sched);
    set('base', o.base === 'sd' || o.base === 'hd' ? o.base : TA_DEF.base);
    num('steps', 'steps', TA_DEF.steps);
    num('cfg', 'cfg', TA_DEF.cfg);
    num('clip', 'clip', TA_DEF.clip);
    num('seed', 'seed', 0);
    num('guidance', 'guidance', 0);
    num('ensd', 'ensd', 0);
    num('w', 'w', 0);
    num('h', 'h', 0);
    set('neg', typeof o.neg === 'string' ? o.neg.slice(0, 1500) : '');
    set('prompt', typeof o.prompt === 'string' ? o.prompt.slice(0, 4000) : '');
    if (txEl('hires')) txEl('hires').checked = o.hires === true || o.hires === 'true';
    var up = TA_UPSCALERS.indexOf(o.upscaler) >= 0 ? o.upscaler : TA_DEF.upscaler;
    set('hr_model', up);
    set('up_model', up);
    var hs = String(o.hrScale);
    hs = ['1.25', '1.5', '1.75', '2'].indexOf(hs) >= 0 ? hs : '1.5';
    set('hr_scale', hs);
    set('up_scale', hs);
    num('hrSteps', 'hr_steps', TA_DEF.hrSteps);
    num('hrDenoise', 'hr_denoise', TA_DEF.hrDenoise);
    if (txEl('ad')) txEl('ad').checked = o.ad === true || o.ad === 'true';
    set('ad_model', TA_AD_MODELS.indexOf(o.adModel) >= 0 ? o.adModel : TA_DEF.adModel);
    num('adDenoise', 'ad_denoise', TA_DEF.adDenoise);
    num('adConf', 'ad_conf', TA_DEF.adConf);
    set('ad_prompt', typeof o.adPrompt === 'string' ? o.adPrompt.slice(0, 500) : '');
    set('ad_neg', typeof o.adNeg === 'string' ? o.adNeg.slice(0, 500) : '');
    num('edit', 'denoise', TA_DEF.edit);
    if (txEl('tags')) txEl('tags').checked = !(o.tags === false || o.tags === 'false');
    if (txEl('bymodel')) txEl('bymodel').checked = o.bymodel === true;
    var nn = parseInt(o.n, 10);
    set('n', nn >= 1 && nn <= 4 ? nn : 1);
    txModeSet(TX_MODES.indexOf(o.mode) >= 0 ? o.mode : 'txt2img', true);
    txLorasPaint();
    txCkptPaint();
    txArPaint();
    txVis();
  }

  function taRead() {
    var tx = txRead();
    return Object.assign(txTa(tx), { prompt: '', tags: tx.tags });
  }

  function taFill(o) {
    txFill(o);
  }

  function taVis() {
    txVis();
  }

  function taRemix(tam, note) {
    if (!tam || typeof tam !== 'object' || !txEl('root')) return false;
    var cur = txRead();
    var pick = function(v, def) {
      return v == null ? def : v;
    };
    txFill({
      mode: 'txt2img',
      n: cur.n,
      ckpt: tam.ckpt || '',
      ckptName: txNames[tam.ckpt] ? txNames[tam.ckpt].name : '',
      ckptKey: cur.ckptKey,
      loras: Array.isArray(tam.loras) ? tam.loras : [],
      embeds: Array.isArray(tam.embeds) ? tam.embeds : [],
      vae: tam.vae,
      sampler: tam.sampler == null ? '' : tam.sampler,
      sched: tam.sched || '',
      base: tam.base,
      steps: tam.steps,
      cfg: tam.cfg,
      clip: tam.clip,
      seed: Number(tam.seed) > 0 ? Math.round(Number(tam.seed)) : 0,
      guidance: pick(tam.guidance, 0),
      neg: (typeof tam.negTa === 'string' ? tam.negTa : (typeof tam.neg === 'string' ? tam.neg : '')).slice(0, 1500),
      w: Number(tam.w) > 0 ? tam.w : 0,
      h: Number(tam.h) > 0 ? tam.h : 0,
      ensd: Number(tam.ensd) > 0 ? Math.round(Number(tam.ensd)) : 0,
      adPrompt: typeof tam.adPrompt === 'string' ? tam.adPrompt : '',
      adNeg: typeof tam.adNeg === 'string' ? tam.adNeg : '',
      hires: tam.hires === true,
      upscaler: tam.upscaler,
      hrScale: tam.hrScale,
      hrSteps: tam.hrSteps,
      hrDenoise: tam.hrDenoise,
      ad: tam.ad === true,
      adModel: tam.adModel,
      adDenoise: tam.adDenoise,
      adConf: tam.adConf,
      edit: cur.edit,
      tags: cur.tags,
      bymodel: false,
      prompt: typeof tam.prompt === 'string' ? tam.prompt.slice(0, 4000) : ''
    });
    stModeSet('tensor');
    taSave();
    txCostSoon();
    try {
      txEl('tabs').scrollIntoView({ block: 'start', behavior: 'smooth' });
    } catch (e) {}
    txStat(L('ремикс поднят в форму — правь, что хочешь, и жми «Generate»') + (note ? ' · ' + String(note).slice(0, 60) : ''));
    return true;
  }

  function taLibIdOk(id) {
    return typeof id === 'string' && /^[a-z0-9]{6,40}$/.test(id);
  }

  function taLibFile(id) {
    return 'iig_tr_' + id + '.jpg';
  }

  function taLibName(s) {
    return String(s == null ? '' : s).replace(/\s+/g, ' ').trim().slice(0, 60);
  }

  function taLibClean(v) {
    var out = [];
    var seen = {};
    var src = Array.isArray(v) ? v : [];
    for (var i = 0; i < src.length; i++) {
      var r = src[i];
      if (!r || typeof r !== 'object' || !taLibIdOk(r.id) || seen[r.id]) continue;
      if (r.path !== '' && r.path !== 'files/global/' + taLibFile(r.id)) continue;
      if (!r.tam || typeof r.tam !== 'object') continue;
      seen[r.id] = 1;
      out.push(r);
    }
    return out;
  }

  async function taLibRead() {
    var r = await kvRace(function() {
      return tv().get(TA_LIB_KEY, 'global');
    }, 6000);
    if (r.st !== 'ok') throw new Error(L('библиотека ремиксов не прочиталась'));
    return taLibClean(r.v);
  }

  async function taLibLoad() {
    try {
      taLib = await taLibRead();
    } catch (e) {
      taLib = [];
    }
    return taLib;
  }

  function taLibNewId() {
    var id = Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    id = id.replace(/[^a-z0-9]/g, '');
    while (id.length < 8) id += Math.floor(Math.random() * 36).toString(36);
    return id;
  }

  async function taLibThumb(path) {
    var f = galParts(path);
    if (!f) throw new Error(L('картинка не нашлась'));
    if (!/^iig_[a-z0-9_]{1,80}\.(?:png|jpe?g|webp)$/i.test(f.name)) throw new Error(L('картинка не нашлась'));
    var du = await tmo(tv().file.load(f.name, { encoding: 'dataUrl', scope: f.scope }), 15000);
    du = String(du || '');
    if (!du) throw new Error(L('картинка не прочиталась'));
    if (du.indexOf('data:') !== 0) du = 'data:image/png;base64,' + du;
    var small = '';
    try {
      small = await tmo(fileToDataUrl(dataUrlToBlob(du), TA_LIB_PX, 0.82), 8000);
    } catch (e) {
      small = '';
    }
    if (!small || String(small).indexOf('data:image/jpeg') !== 0) throw new Error(L('миниатюра не сжалась'));
    return String(small);
  }

  function taLibTam(t) {
    var out = {};
    for (var k in t) {
      if (Object.prototype.hasOwnProperty.call(t, k) && k !== 'ckptKey') out[k] = t[k];
    }
    var strip = function(arr) {
      return (Array.isArray(arr) ? arr : []).map(function(l) {
        return { id: l && l.id, w: l && l.w, key: '' };
      });
    };
    out.loras = strip(t.loras);
    out.embeds = strip(t.embeds);
    return out;
  }

  async function taLibAdd(o) {
    o = o || {};
    if (!o.tam || typeof o.tam !== 'object') throw new Error(L('у картинки нет параметров Tensor Art'));
    var noThumb = !o.path || o.thumb === '';
    var id = taLibNewId();
    if (!noThumb) {
      var thumb = await taLibThumb(o.path);
      var saved = await tmo(tv().file.save(taLibFile(id), thumb, { scope: 'global' }), 15000);
      if (!saved) throw new Error(L('миниатюра не записалась'));
    }
    var rec = {
      id: id,
      name: taLibName(o.name) || L('ремикс'),
      at: Date.now(),
      from: o.from === 'chat' ? 'chat' : 'studio',
      path: noThumb ? '' : 'files/global/' + taLibFile(id),
      tam: taLibTam(o.tam)
    };
    var list;
    try {
      list = await taLibRead();
    } catch (e) {
      try {
        await tv().file.delete(taLibFile(id), { scope: 'global' });
      } catch (e2) {}
      throw e;
    }
    list.unshift(rec);
    while (list.length > TA_LIB_MAX) {
      var old = list.pop();
      try {
        await tv().file.delete(taLibFile(old.id), { scope: 'global' });
      } catch (e3) {}
    }
    await tv().set(TA_LIB_KEY, list, 'global');
    taLib = list;
    taLibPaint();
    return rec;
  }

  async function taLibDel(id) {
    if (!taLibIdOk(id)) return false;
    var list = await taLibRead();
    var next = list.filter(function(x) {
      return x.id !== id;
    });
    await tv().set(TA_LIB_KEY, next, 'global');
    try {
      await tv().file.delete(taLibFile(id), { scope: 'global' });
    } catch (e) {}
    taLib = next;
    taLibPaint();
    return true;
  }

  async function taLibRename(id, name) {
    var nm = taLibName(name);
    if (!taLibIdOk(id) || !nm) return false;
    var list = await taLibRead();
    var hit = false;
    for (var i = 0; i < list.length; i++) {
      if (list[i].id === id) {
        list[i].name = nm;
        hit = true;
      }
    }
    if (!hit) return false;
    await tv().set(TA_LIB_KEY, list, 'global');
    taLib = list;
    taLibPaint();
    return true;
  }

  function taLibRec(id) {
    for (var i = 0; i < taLib.length; i++) if (taLib[i].id === id) return taLib[i];
    return null;
  }

  function taLibView(rec) {
    if (!rec) return null;
    var t = (rec.tam && typeof rec.tam === 'object') ? rec.tam : {};
    return galWin({
      title: String(rec.name || '') || 'Tensor',
      src: rec.path ? stFileUrl(rec.path) : '',
      text: String(t.prompt || '') || L('промпт не сохранён'),
      rows: [
        [
          { label: L('ремикс'), main: true, onClick: function(ctx) {
            ctx.close();
            taLibDoRemix(rec);
          } },
          { label: L('скопировать промпт'), keepOpen: true, onClick: galCopyPrompt },
          { label: L('закрыть'), onClick: function(ctx) {
            ctx.close();
          } }
        ],
        [
          { label: L('переименовать'), onClick: function(ctx) {
            ctx.close();
            taLibDoName(rec);
          } },
          { label: L('удалить'), onClick: function(ctx) {
            ctx.close();
            taLibDoDel(rec);
          } }
        ]
      ]
    });
  }

  function taLibCard(rec) {
    var card = D.createElement('div');
    card.className = 'iig-gcard';
    card.setAttribute('data-tr', rec.id);
    card.title = String(rec.name || '');
    var open = function() {
      taLibView(rec);
    };
    if (rec.path) {
      var im = D.createElement('img');
      im.alt = '';
      clSetAv(im, stFileUrl(rec.path));
      im.addEventListener('click', open);
      card.appendChild(im);
    } else {
      var ph = D.createElement('span');
      ph.className = 'iig-note';
      ph.textContent = String(rec.name || 'Tensor');
      ph.addEventListener('click', open);
      card.appendChild(ph);
    }
    var bX = D.createElement('button');
    bX.type = 'button';
    bX.className = 'iig-gbtn iig-gx';
    bX.appendChild(galXSvg());
    bX.title = L('удалить картинку');
    bX.addEventListener('click', function(e) {
      e.stopPropagation();
      taLibDoDel(rec);
    });
    card.appendChild(bX);
    return card;

  function taLibPaint() {
    var title = taEl('libtitle');
    if (title) title.textContent = L('Мои ремиксы') + ' (' + taLib.length + ')';
    var box = D.getElementById('iig_gal_box');
    if (!box || galMode !== 'remix') return;
    box.innerHTML = '';
    var note = D.createElement('div');
    note.id = 'iig_ta_libnote';
    note.className = 'iig-note';
    note.textContent = taLib.length ? L('хранятся последние 60 картинок') : L('пока пусто: у картинки Tensor Art нажми «в ремиксы»');
    box.appendChild(note);
    for (var i = 0; i < taLib.length; i++) box.appendChild(taLibCard(taLib[i]));
  }

  function taLibDoRemix(rec) {
    if (!rec) return;
    setTab('studio');
    taRemix(rec.tam, rec.name);
  }

  async function taLibDoName(rec) {
    if (!rec) return;
    var nm = await askText(L('Новое имя ремикса'), rec.name || '', L('сохранить'));
    if (!nm) return;
    try {
      await taLibRename(rec.id, nm);
    } catch (e) {
      msg(L('не переименовалось: ') + ((e && e.message) || e));
    }
  }

  async function taLibDoDel(rec) {
    if (!rec) return;
    if (!(await askSure(L('Удалить этот ремикс из библиотеки?'), L('удалить')))) return;
    try {
      await taLibDel(rec.id);
      msg(L('ремикс удалён'));
    } catch (e) {
      msg(L('не удалилось: ') + ((e && e.message) || e));
    }
  }

  function galRemixPaint() {
    var box = D.getElementById('iig_gal_box');
    if (!box) return Promise.resolve();
    box.innerHTML = '';
    var mb = D.getElementById('iig_gal_more');
    if (mb) mb.style.display = 'none';
    taLibPaint();
    return taLibLoad().then(function() {
      if (galMode === 'remix') taLibPaint();
      msg('');
    });
  }

  function taReq(req) {
    if (taOn()) req.ta = taRead();
    return req;
  }

  async function taLoad() {
    if (!txEl('root')) return;
    var v = null;
    try {
      v = await tmo(tv().get(TA_KEY, 'global'), 5000);
    } catch (e) {
      v = null;
    }
    txFill(v || {});
    taLoaded = true;
    await txSavedLoad();
    await txPresetsLoad();
    await taLibLoad();
    taLibPaint();
    txCostSoon();
  }

  function taSave() {
    if (!taLoaded) return;
    if (taSaveT) clearTimeout(taSaveT);
    taSaveT = regT(setTimeout(function() {
      taSaveT = null;
      Promise.resolve(tv().set(TA_KEY, txRead(), 'global')).catch(function() {

  async function taModelInfo(key, id) {
    var url = TA_HOST + '/v1/models/' + id;
    var got = await tmo(fetch(url, {
      method: 'GET',
      headers: { 'Authorization': 'Bearer ' + key, 'Accept': 'application/json' }
    }).then(function(x) {
      return { resp: x };
    }, function(x) {
      return { err: x };
    }), 15000);
    if (!got) return { st: 0, msg: L('нет ответа за 15 с') };
    if (got.err) return { st: 0, msg: L('сеть не пустила: ') + ((got.err && got.err.message) || got.err) };
    var resp = got.resp;
    var txt = '';
    try {
      txt = await resp.text();
    } catch (e0) {}
    var j = {};
    try {
      j = JSON.parse(txt);
    } catch (e1) {}
    if (resp.status === 200 && j && j.model) return { st: 200, model: j.model };
    var m = String((j && (j.message || '')) || '').slice(0, 120);
    if (resp.status === 401 || (resp.status === 404 && /unauthorized|app not found/i.test(txt))) return { st: 401, msg: L('ключ не принят') + (m ? ' · ' + m : '') };
    if (resp.status === 404) return { st: 404, msg: L('модель не найдена') };
    return { st: resp.status, msg: 'HTTP ' + resp.status + (m ? ' · ' + m : '') };
  }

  function taModelLine(m) {

    if (m.baseModel) bits.push(String(m.baseModel));

    if (m.triggerWords) bits.push(L('триггеры: ') + String(m.triggerWords).slice(0, 80));
    return bits.join(' · ');
  }

  async function txChatList() {
    var out = [];
    var total = 0;
    try {
      total = await tmo(tv().message.count(), 6000);
    } catch (e) {}
    var from = (total && total > 120) ? (total - 120) : 0;
    var all = null;
    try {
      all = await tmo(tv().message.find([from]), 15000);
    } catch (e) {
      all = null;
    }
    if (!Array.isArray(all)) return out;
    var vis = all.filter(function(m) {
      return m && !m.hidden;
    }).reverse();
    for (var b = 0; b < vis.length && out.length < 24; b += 24) {
      var part = vis.slice(b, b + 24);
      var got = await Promise.all(part.map(function(m) {
        return stateOf(m.id).catch(function() {
          return null;
        });
      }));
      for (var k = 0; k < got.length && out.length < 24; k++) {
        var st = got[k];
        if (!st || st.state !== 'ok' || !st.path) continue;
        var f = galParts(st.path);
        if (!f || !/^iig_[a-z0-9_]{1,80}\.(?:png|jpe?g|webp)$/i.test(f.name)) continue;
        out.push({ path: 'files/' + f.scope + '/' + f.name, prompt: st.prompt || '' });
      }
    }
    return out;
  }

  function txLoraAdd(id, w, name) {
    id = taIdOf(id);
    if (!id) {
      txStat(L('впиши ID или ссылку LoRA'));
      return false;
    }
    for (var i = 0; i < txLoras.length; i++) {
      if (txLoras[i].id === id) {
        txStat(L('эта LoRA уже в форме'));
        return false;
      }
    }
    if (txLoras.length >= TA_LORA_N) {
      txStat(L('LoRA не больше шести'));
      return false;
    }
    var n = parseFloat(w);
    txLoras.push({ id: id, w: isNaN(n) ? 1 : Math.min(2, Math.max(0.05, n)) });
    if (name) txNames[id] = Object.assign({}, txNames[id] || {}, { name: String(name).slice(0, 80), type: 'LORA' });
    txLorasPaint();
    taSave();
    txCostSoon();
    return true;
  }

  function txTrigList(v) {
    var arr = Array.isArray(v) ? v : String(v == null ? '' : v).split(',');
    var out = [];
    for (var i = 0; i < arr.length && out.length < 20; i++) {
      var t = String(arr[i] == null ? '' : arr[i]).replace(/\s+/g, ' ').trim().slice(0, 60);
      if (t && out.indexOf(t) < 0) out.push(t);
    }
    return out;
  }

  function txSavedClean(v) {
    var out = [];
    var seen = {};
    var src = Array.isArray(v) ? v : [];
    for (var i = 0; i < src.length; i++) {
      var r = src[i];
      if (!r || typeof r !== 'object') continue;
      var id = taIdOf(r.id);
      if (!id || seen[id]) continue;
      seen[id] = 1;
      var w = parseFloat(r.w);
      out.push({ id: id, name: String(r.name || '').slice(0, 80), base: String(r.base || '').slice(0, 40), w: isNaN(w) ? 1 : Math.min(2, Math.max(0.05, w)), trig: txTrigList(r.trig), at: Number(r.at) || 0 });
    }
    return out;
  }

    txNames[id] = { name: String(m.name || '').slice(0, 80), base: String(m.baseModel || '').slice(0, 40), type: t };
    var tr = txTrigList(m.triggerWords);

  async function txLoraSave(id) {
    id = taIdOf(id);
    if (!id) return null;
    var key = await txKey(id);
    if (!key) return null;
    txStat(L('проверяю LoRA…'));
    var r = await taModelInfo(key, id);
    if (r.st !== 200) {
      txStat('LoRA: ' + r.msg);
      return null;
    }
    var m = r.model || {};
    txModelNote(id, m);
    var cur = null;
    for (var i = 0; i < txLoras.length; i++) if (txLoras[i].id === id) cur = txLoras[i];
    var rec = { id: id, name: String(m.name || '').slice(0, 80), base: String(m.baseModel || '').slice(0, 40), w: cur ? cur.w : 1, trig: txTrigList(m.triggerWords), at: Date.now() };
    var rd = await kvRace(function() {
      return tv().get(TX_LORAS_KEY, 'global');
    }, 6000);
    if (rd.st !== 'ok') {
      txStat(L('список LoRA не прочитался'));
      return null;
    }
    var list = txSavedClean(rd.v).filter(function(x) {
      return x.id !== id;
    });
    list.unshift(rec);
    while (list.length > TX_LORAS_MAX) list.pop();
    try {
      await tv().set(TX_LORAS_KEY, list, 'global');
    } catch (e) {
      txStat(L('LoRA не сохранилась — хранилище Tavo не ответило'));
      return null;
    }
    txSaved = list;
    txSavedPaint();
    txLorasPaint();
    txStat(L('LoRA сохранена: ') + (rec.name || id));
    return rec;
  }

  async function txLoraDel(id) {
    id = taIdOf(id);
    var rec = null;
    for (var i = 0; i < txSaved.length; i++) if (txSaved[i].id === id) rec = txSaved[i];
    if (!rec) return false;
    if (!(await askSure(L('Убрать LoRA «') + (rec.name || id) + L('» из сохранённых?'), L('удалить')))) return false;
    var rd = await kvRace(function() {
      return tv().get(TX_LORAS_KEY, 'global');
    }, 6000);
    if (rd.st !== 'ok') return false;
    var list = txSavedClean(rd.v).filter(function(x) {
      return x.id !== id;
    });
    try {
      await tv().set(TX_LORAS_KEY, list, 'global');
    } catch (e) {
      txStat(L('не удалилось: ') + ((e && e.message) || e));
      return false;
    }
    txSaved = list;
    txSavedPaint();
    txStat(L('LoRA убрана из сохранённых'));
    return true;
  }

    s.value = sel || '';
  }

  async function txPresetSave(name) {
    var nm = String(name == null ? '' : name).replace(/\s+/g, ' ').trim().slice(0, 40);
    if (!nm) return null;
    var r = await kvRace(function() {
      return tv().get(TX_PRESETS_KEY, 'global');
    }, 6000);
    if (r.st !== 'ok') {
      txStat(L('пресеты не прочитались'));
      return null;
    }
    var list = txPresetClean(r.v);
    var rec = { id: taLibNewId(), name: nm, at: Date.now(), tx: txPresetTx(txRead()) };
    list.unshift(rec);
    while (list.length > TX_PRESETS_MAX) list.pop();
    try {
      await tv().set(TX_PRESETS_KEY, list, 'global');
    } catch (e) {
      txStat(L('пресет не сохранился — хранилище Tavo не ответило'));
      return null;
    }
    txPresets = list;
    txPresetPaint(rec.id);
    txStat(L('пресет сохранён: ') + nm);
    return rec;
  }

  function txNum2(v, lo, hi) {
    var n = parseFloat(v);
    if (isNaN(n)) return null;
    return Math.min(hi, Math.max(lo, n));
  }

  function txSizeFit(w, h) {
    w = Number(w) || 0;
    h = Number(h) || 0;
    if (!(w > 0 && h > 0)) return null;
    var k = Math.min(1, 1536 / Math.max(w, h));
    return { w: txRound(w * k), h: txRound(h * k) };
  }

  function txFromV1(v) {
    var o = {};
    if (typeof v.prompt === 'string') o.prompt = v.prompt;
    if (typeof v.negativePrompt === 'string') o.neg = v.negativePrompt;
    var sz = txSizeFit(v.width, v.height);
    if (sz) {
      o.w = sz.w;
      o.h = sz.h;
    }
    var sm = v.samplerName || v.sampler;
    if (sm) {
      var sc = txSamplerOf(sm, v.schedule || v.scheduleName || '');
      if (sc.sampler) o.sampler = sc.sampler;
      o.sched = sc.sched;
    }
    var st = txNum2(v.steps, 1, 60);
    if (st != null) o.steps = Math.round(st);
    var cf = txNum2(v.cfgScale, 0, 30);
    if (cf != null) o.cfg = cf;
    var sd = parseInt(v.seed, 10);
    if (sd > 0 && sd <= 4294967295) o.seed = sd;
    var cl = txNum2(v.clipSkip, 1, 12);
    if (cl != null) o.clip = Math.round(cl);
    var gd = txNum2(v.guidance, 0, 20);
    if (gd != null) o.guidance = gd;
    var en = parseInt(v.etaNoiseSeedDelta, 10);
    if (en > 0 && en <= 4294967295) o.ensd = en;
    if (typeof v.sdVae === 'string' && TA_VAES.indexOf(v.sdVae) >= 0) o.vae = v.sdVae;
    var bm = v.baseModel && typeof v.baseModel === 'object' ? v.baseModel : null;
    if (bm && /^\d{1,30}$/.test(String(bm.modelId || ''))) {
      o.ckpt = String(bm.modelId);
      if (bm.label) o.ckptName = String(bm.label).slice(0, 80);
    }
    var ls = [];
    var es = [];
    var ms = Array.isArray(v.models) ? v.models : [];
    for (var i = 0; i < ms.length; i++) {
      var m = ms[i];
      if (!m || typeof m !== 'object' || !/^\d{1,30}$/.test(String(m.modelId || ''))) continue;
      var ty = String(m.type || '').toUpperCase();
      var w = txNum2(m.weight, 0.05, 2);
      var it = { id: String(m.modelId), w: w == null ? 1 : w, key: '', name: String(m.label || '').slice(0, 80) };
      if (ty === 'LORA' || ty === 'LYCORIS') ls.push(it);
      else if (ty === 'EMBEDDING' || ty === 'TEXTUAL_INVERSION') es.push(it);
      else if (ty === 'CHECKPOINT' && !o.ckpt) {
        o.ckpt = it.id;
        if (it.name) o.ckptName = it.name;
      }
    }
    var em = Array.isArray(v.embeddingModels) ? v.embeddingModels : [];
    for (var j = 0; j < em.length; j++) {
      var e = em[j];
      if (e && /^\d{1,30}$/.test(String(e.modelId || e.id || ''))) {
        var ew = txNum2(e.weight, 0.05, 2);
        es.push({ id: String(e.modelId || e.id), w: ew == null ? 1 : ew, key: '', name: String(e.label || '').slice(0, 80) });
      }
    }
    if (ls.length) o.loras = ls.slice(0, TA_LORA_N);
    if (es.length) o.embeds = es.slice(0, TA_EMB_N);
    if (v.enableHr === true) {
      o.hires = true;
      var hs = txNum2(v.hrScale, 1, 2);
      if (hs != null) o.hrScale = hs;
      if (typeof v.hrUpscaler === 'string' && TA_UPSCALERS.indexOf(v.hrUpscaler) >= 0) o.upscaler = v.hrUpscaler;
      var hst = txNum2(v.hrSecondPassSteps, 1, 60);
      if (hst != null) o.hrSteps = Math.round(hst);
      var hd = txNum2(v.denoisingStrength, 0, 1);
      if (hd != null) o.hrDenoise = hd;
    } else if (v.enableHr === false) {
      o.hires = false;
    }
    return o;
  }

  function txFromTam(t) {
    var o = {};
    var keys = ['ckpt', 'ckptName', 'loras', 'embeds', 'vae', 'sampler', 'sched', 'base', 'steps', 'cfg', 'clip', 'seed', 'guidance', 'ensd', 'w', 'h', 'prompt', 'hires', 'upscaler', 'hrScale', 'hrSteps', 'hrDenoise', 'ad', 'adModel', 'adDenoise', 'adConf', 'adPrompt', 'adNeg', 'edit', 'n', 'mode'];
    for (var i = 0; i < keys.length; i++) if (t[keys[i]] != null) o[keys[i]] = t[keys[i]];
    if (typeof t.negTa === 'string') o.neg = t.negTa;
    else if (typeof t.neg === 'string') o.neg = t.neg;
    if (typeof o.ckpt !== 'string' || !/^\d{1,30}$/.test(o.ckpt)) delete o.ckpt;
    var clean = function(arr) {
      return (Array.isArray(arr) ? arr : []).filter(function(l) {
        return l && /^\d{1,30}$/.test(String(l.id || ''));
      }).map(function(l) {
        var w = txNum2(l.w, 0.05, 2);
        return { id: String(l.id), w: w == null ? 1 : w, key: '' };
      });
    };
    if (o.loras) o.loras = clean(o.loras).slice(0, TA_LORA_N);
    if (o.embeds) o.embeds = clean(o.embeds).slice(0, TA_EMB_N);
    if (o.sampler != null) {
      var sc = taSamplerCanon(o.sampler, o.sched);
      o.sampler = sc.sampler;
      o.sched = sc.sched;
    }
    return o;
  }

  function txSavedByName(nm) {
    var low = String(nm || '').trim().toLowerCase();
    if (!low) return null;
    for (var i = 0; i < txSaved.length; i++) if (String(txSaved[i].name || '').trim().toLowerCase() === low) return txSaved[i];
    return null;
  }

  function txFromA1111(text, notes) {
    var o = {};
    var lines = String(text).replace(/\r/g, '').split('\n');
    var pi = -1;
    for (var i = lines.length - 1; i >= 0; i--) {
      if (/^\s*Steps\s*:/i.test(lines[i])) {
        pi = i;
        break;
      }
    }
    var head = pi >= 0 ? lines.slice(0, pi).join('\n') : lines.join('\n');
    var params = pi >= 0 ? lines.slice(pi).join(' ') : '';
    var negAt = head.search(/(^|\n)\s*Negative prompt\s*:/i);
    var prompt = negAt >= 0 ? head.slice(0, negAt) : head;
    var neg = negAt >= 0 ? head.slice(negAt).replace(/^\s*\n?\s*Negative prompt\s*:\s*/i, '') : '';
    var ls = [];
    prompt = prompt.replace(/<lora:([^:>]{1,120}):([0-9.]+)>/gi, function(all, nm, wt) {
      var w = txNum2(wt, 0.05, 2);
      var n = String(nm).trim();
      if (/^\d{1,30}$/.test(n)) {
        ls.push({ id: n, w: w == null ? 1 : w, key: '' });
        return '';
      }
      var sv = txSavedByName(n);
      if (sv) ls.push({ id: sv.id, w: w == null ? sv.w : w, key: '' });
      else notes.push(L('LoRA «') + n.slice(0, 60) + L('» не найдена среди сохранённых — вставь ссылку на неё'));
      return '';
    }).replace(/\s*,\s*,+/g, ',').replace(/[\s,]+$/, '').trim();
    o.prompt = prompt.slice(0, 4000);
    o.neg = neg.trim().slice(0, 1500);
    if (ls.length) o.loras = ls.slice(0, TA_LORA_N);
    var kv = {};
    var re = /([A-Za-z][A-Za-z0-9 _\-]{0,40}):\s*("(?:[^"\\]|\\.)*"|[^,]*)/g;
    var m;
    while ((m = re.exec(params))) {
      var k = m[1].trim().toLowerCase();
      var v = m[2].trim().replace(/^"|"$/g, '');
      if (!(k in kv)) kv[k] = v;
    }
    var st = txNum2(kv.steps, 1, 60);
    if (st != null) o.steps = Math.round(st);
    if (kv.sampler) {
      var sc = txSamplerOf(kv.sampler, kv['schedule type'] || '');
      if (sc.sampler) o.sampler = sc.sampler;
      else notes.push(L('сэмплер «') + kv.sampler.slice(0, 40) + L('» Tensor не знает — оставлен прежний'));
      o.sched = sc.sched;
    }
    var cf = txNum2(kv['cfg scale'], 0, 30);
    if (cf != null) o.cfg = cf;
    var sd = parseInt(kv.seed, 10);
    if (sd > 0 && sd <= 4294967295) o.seed = sd;
    var szm = String(kv.size || '').match(/^(\d{2,5})\s*[x×*]\s*(\d{2,5})$/i);
    if (szm) {
      var sz = txSizeFit(parseInt(szm[1], 10), parseInt(szm[2], 10));
      if (sz) {
        o.w = sz.w;
        o.h = sz.h;
      }
    }
    var cl = txNum2(kv['clip skip'], 1, 12);
    if (cl != null) o.clip = Math.round(cl);
    var en = parseInt(kv.ensd, 10);
    if (en > 0 && en <= 4294967295) o.ensd = en;
    if (kv['hires upscale'] || kv['hires upscaler'] || kv['hires steps']) {
      o.hires = true;
      var hs = txNum2(kv['hires upscale'], 1, 2);
      if (hs != null) o.hrScale = hs;
      if (TA_UPSCALERS.indexOf(kv['hires upscaler']) >= 0) o.upscaler = kv['hires upscaler'];
      var hst = txNum2(kv['hires steps'], 1, 60);
      if (hst != null) o.hrSteps = Math.round(hst);
      var dn = txNum2(kv['denoising strength'], 0, 1);
      if (dn != null) o.hrDenoise = dn;
    } else {
      var dn2 = txNum2(kv['denoising strength'], 0.05, 1);
      if (dn2 != null) o.edit = dn2;
    }
    if (kv.vae && TA_VAES.indexOf(kv.vae) >= 0) o.vae = kv.vae;
    if (kv.model) {
      var mn = kv.model.trim();
      var cur = txRead();
      if (/^\d{1,30}$/.test(mn)) o.ckpt = mn;
      else if (cur.ckptName && cur.ckptName.toLowerCase() === mn.toLowerCase()) o.ckpt = cur.ckpt;
      else {
        var hit = null;
        for (var p = 0; p < txPresets.length; p++) {
          var pt = txPresets[p].tx || {};
          if (pt.ckpt && pt.ckptName && String(pt.ckptName).toLowerCase() === mn.toLowerCase()) hit = pt;
        }
        if (hit) {
          o.ckpt = hit.ckpt;
          o.ckptName = hit.ckptName;
        } else notes.push(L('чекпоинт «') + mn.slice(0, 60) + L('» не найден — вставь ссылку на модель'));
      }
    }
    return o;
  }

  async function txParse(text) {
    var notes = [];
    var t = String(text == null ? '' : text).trim().slice(0, 20000);
    if (!t) return { tx: {}, notes: [L('вставь ссылку или данные генерации')] };
    var mm = t.match(/tensor\.art\/models\/(\d{1,30})(?:\D|$)/i);
    if (mm) {
      var id = mm[1];
      var key = await txKey(id);
      if (!key) return { tx: {}, notes: [L('нужен ключ Tensor Art — вкладка api')] };
      var r = await taModelInfo(key, id);
      if (r.st !== 200) return { tx: {}, notes: [L('модель не проверилась: ') + r.msg] };
      var info = txModelNote(id, r.model || {});
      var o = {};
      if (info.type === 'LORA' || info.type === 'LYCORIS') {
        var cur = txRead().loras;
        var has = cur.some(function(l) {
          return l.id === id;
        });
        if (!has && cur.length >= TA_LORA_N) return { tx: {}, notes: [L('LoRA не больше шести')] };
        o.loras = has ? cur : cur.concat([{ id: id, w: 1, key: '' }]);
        notes.push(L('LoRA добавлена: ') + (info.name || id));
      } else if (info.type === 'EMBEDDING' || info.type === 'TEXTUAL_INVERSION') {
        var ce = txRead().embeds;
        if (ce.length >= TA_EMB_N) return { tx: {}, notes: [L('эмбеддингов не больше четырёх')] };
        o.embeds = ce.concat([{ id: id, w: 1, key: '' }]);
        notes.push(L('эмбеддинг добавлен: ') + (info.name || id));
      } else {
        o.ckpt = id;
        o.ckptName = info.name || '';
        notes.push(L('чекпоинт: ') + (info.name || id));
      }
      return { tx: o, notes: notes };
    }
    if (/tensor\.art\/(?:[a-z-]+\/)?(?:images|posts)\/\d{1,30}/i.test(t)) {
      return { tx: {}, notes: [L('Tensor не отдаёт параметры картинки приложениям: открой картинку в Tensor, нажми «копировать generation data» и вставь сюда текст')] };
    }
    if (/^[\[{]/.test(t)) {
      var j = null;
      try {
        j = JSON.parse(t);
      } catch (e) {
        j = null;
      }
      if (j && typeof j === 'object') {
        var v1 = (j.generationData && j.generationData.tensorArtV1) || j.tensorArtV1 || null;
        if (v1 && typeof v1 === 'object') return { tx: txFromV1(v1), notes: [L('данные Tensor разобраны')] };
        if (j.tam && typeof j.tam === 'object') return { tx: txFromTam(j.tam), notes: [L('параметры разобраны')] };
        if (j.tx && typeof j.tx === 'object') return { tx: txFromTam(j.tx), notes: [L('параметры разобраны')] };
        if (j.samplerName || j.cfgScale != null || Array.isArray(j.models)) return { tx: txFromV1(j), notes: [L('данные Tensor разобраны')] };
        if (j.ckpt || j.sampler || j.prompt) return { tx: txFromTam(j), notes: [L('параметры разобраны')] };
      }
      return { tx: {}, notes: [L('JSON не похож на данные генерации')] };
    }
    if (/(^|\n)\s*Steps\s*:/i.test(t) || /(^|\n)\s*Negative prompt\s*:/i.test(t)) {
      var a = txFromA1111(t, notes);
      notes.unshift(L('данные генерации разобраны'));
      return { tx: a, notes: notes };
    }
    return { tx: {}, notes: [L('не понял, что это: вставь ссылку tensor.art/models/…, JSON или «generation data»')] };
  }

  async function txPaste() {
    var ta = txEl('paste');
    var note = txEl('paste_note');
    var btn = txEl('paste_go');
    if (btn && btn.disabled) return;
    if (btn) btn.disabled = true;
    note.textContent = L('разбираю…');
    var res = { tx: {}, notes: [] };
    try {
      res = await txParse(ta.value);
    } catch (e) {
      res = { tx: {}, notes: [L('не разобралось: ') + ((e && e.message) || e)] };
    }
    var part = res.tx || {};
    if (Object.keys(part).length) {
      var cur = txRead();
      var next = Object.assign({}, cur, part);
      if (part.ckpt && !part.ckptName) next.ckptName = txNames[part.ckpt] ? txNames[part.ckpt].name : '';
      if (part.loras) {
        for (var i = 0; i < part.loras.length; i++) {
          if (part.loras[i].name) txNames[part.loras[i].id] = { name: part.loras[i].name, type: 'LORA' };
        }
      }
      if (part.ckptName) txNames[next.ckpt] = Object.assign({}, txNames[next.ckpt] || {}, { name: part.ckptName, type: 'CHECKPOINT' });
      next.ckptKey = cur.ckptKey;
      txFill(next);
      taSave();
      txCostSoon();
    }
    note.textContent = res.notes.join('\n');
    if (btn) btn.disabled = false;
    return res;
  }

  function txA1111(tam) {
    var t = (tam && typeof tam === 'object') ? tam : {};
    var loras = (Array.isArray(t.loras) ? t.loras : []).filter(function(l) {
      return l && /^\d{1,30}$/.test(String(l.id || ''));
    }).map(function(l) {
      return '<lora:' + l.id + ':' + (l.w != null ? l.w : 1) + '>';
    });
    var prompt = String(t.prompt || '') + (loras.length ? ', ' + loras.join(', ') : '');
    var neg = typeof t.negTa === 'string' ? t.negTa : String(t.neg || '');
    var bits = [
      'Steps: ' + (t.steps != null ? t.steps : 25),
      'Sampler: ' + (t.sampler || 'Euler a'),
      'CFG scale: ' + (t.cfg != null ? t.cfg : 7),
      'Seed: ' + (Number(t.seed) > 0 ? t.seed : -1),
      'Size: ' + (t.w || 1024) + 'x' + (t.h || 1024),
      'Model: ' + String(t.ckpt || ''),
      'Clip skip: ' + (t.clip != null ? t.clip : 2)
    ];
    if (t.sched) bits.push('Schedule type: ' + t.sched);
    if (Number(t.ensd) > 0) bits.push('ENSD: ' + t.ensd);
    if (t.vae && t.vae !== 'Automatic') bits.push('VAE: ' + t.vae);
    if (t.hires) {
      bits.push('Hires upscale: ' + t.hrScale);
      bits.push('Hires steps: ' + t.hrSteps);
      bits.push('Hires upscaler: ' + t.upscaler);
      bits.push('Denoising strength: ' + t.hrDenoise);
    }
    return prompt + '\nNegative prompt: ' + neg + '\n' + bits.join(', ');
  }

  function txCostPaint() {
    var b = txEl('go');
    if (!b) return;
    b.textContent = 'Generate' + (txCostVal != null ? (' · ≈ ' + txCostVal + ' ' + L('кредитов')) : '');
  }

  function txCostSoon() {
    if (txCostT) clearTimeout(txCostT);
    txCostT = regT(setTimeout(txCostRun, 800));
  }


  function txCostKey(tx) {
    var o = Object.assign({}, tx || {});
    delete o.ckptKey;
    var strip = function(arr) {
      return (Array.isArray(arr) ? arr : []).map(function(l) {
        var c = Object.assign({}, l || {});
        delete c.key;
        return c;
      });
    };
    o.loras = strip(o.loras);
    o.embeds = strip(o.embeds);
    return o;
  }

  async function txCostRun() {
    txCostT = null;
    if (!txEl('root') || !taOn() || stMode() !== 'tensor' || cmdBusy || stJobs.length) return;
    var tx = txRead();
    if (!tx.ckpt) {
      txCostVal = null;
      txCostPaint();
      return;
    }
    var ck = JSON.stringify(txCostKey(tx));
    if (ck === txCostLast) return;
    txCostLast = ck;
    var my = ++txCostSeq;
    var id = 'tc' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    await sendCmd('tacost', { jid: id, mode: tx.mode, ta: txTa(tx) }, true);
    for (var i = 0; i < 20; i++) {
      await new Promise(function(r) {
        regT(setTimeout(r, 500));
      });
      if (my !== txCostSeq) return;
      var v = null;
      try {
        v = await tmo(tv().get('iig_ta_cost', 'global'), 3000);
      } catch (e) {
        v = null;
      }
      if (v && v.id === id) {
        txCostVal = (typeof v.credits === 'number' && isFinite(v.credits)) ? v.credits : null;
        txCostPaint();
        if (v.error) {
          txCostLast = '';
          txStat(L('оценка кредитов: ') + String(v.error).slice(0, 300));
        }
        return;
      }
    }
    if (my === txCostSeq) txCostLast = '';
  }

  function txGo() {
    if (!taOn()) {
      txStat(L('выбери подключение «Tensor Art» на вкладке api'));
      return;
    }
    if (cmdBusy) {
      txStat(L('движок ещё занят прошлой командой — подожди пару секунд'));
      return;
    }
    var tx = txRead();
    if (!tx.ckpt) {
      txStat(L('выбери чекпоинт'));
      return;
    }
    if (tx.mode !== 'txt2img' && !txSrc) {
      txStat(L('выбери исходник'));
      return;
    }
    if (tx.mode === 'inpaint' && !txMark) {
      txStat(L('нарисуй маску'));
      return;
    }
    if (tx.mode === 'txt2img' && !tx.prompt) {
      txStat(tx.bymodel ? L('напиши, что нарисовать') : L('напиши промпт'));
      return;
    }
    var jid = 'tx' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    if (txCostT) clearTimeout(txCostT);
    txCostT = null;
    txCostSeq++;
    stJobs.push(jid);
    txStat(L('отправляю движку…'));
    if (tx.bymodel && tx.mode === 'txt2img') {
      var sreq = stReqForm();
      sreq.text = tx.prompt;
      sreq.n = tx.n;
      sreq.ar = (tx.w > 0 && tx.h > 0) ? (taArOf(tx.w, tx.h) || sreq.ar) : sreq.ar;
      sreq.ta = Object.assign(txTa(tx), { prompt: '', tags: tx.tags });
      sreq.jid = jid;
      return Promise.resolve(sendCmd('studio', sreq)).then(stPoll);
    }
    var req = { jid: jid, mode: tx.mode, n: tx.n, ta: txTa(tx) };
    if (tx.mode !== 'txt2img') req.src = txSrcCmd();
    if (tx.mode === 'inpaint') req.mark = txMark;
    return Promise.resolve(sendCmd('tensor', req)).then(stPoll);
  }

  async function txListLoad(showId) {
    var r = await kvRace(function() {
      return tv().get('iig_studio', 'global');
    }, 6000);
    if (r.st !== 'ok') return;
    var all = Array.isArray(r.v) ? r.v : [];
    txList = all.filter(function(x) {
      return x && x.id && (x.path || x.url) && x.prov === 'tensor';
    });
    var want = showId || (txCur && txCur.id) || '';
    var next = null;
    for (var i = 0; i < txList.length; i++) if (txList[i].id === want) next = txList[i];
    txShow(next);
  }

  function txCreditsOf(rec) {
    var m = String((rec && rec.note) || '').match(/кредитов\s+([0-9.]+)/);
    return m ? m[1] : '';
  }

  function txInfoApply() {
    var box = txEl('resinfo');
    if (box) box.classList.toggle('iig-hidden', !txInfoOpen);
    var b = txEl('restog');
    var ar = b ? b.querySelector('.iig-txarr') : null;
    if (ar) ar.textContent = txInfoOpen ? '▾' : '▸';
  }

  function txShow(rec) {
    txCur = rec || null;
    var box = txEl('res');
    if (!box) return;
    txVis();
    txInfoApply();
    if (!txCur) return;
    var t = (txCur.tam && typeof txCur.tam === 'object') ? txCur.tam : ((txCur.ta && typeof txCur.ta === 'object') ? txCur.ta : {});
    stPicSet(txEl('img'), txCur);
    var when = '';
    try {
      when = new Date(Number(txCur.at) || 0).toLocaleString();
    } catch (e) {}
    var cr = txCreditsOf(txCur);
    txEl('res_cap').textContent = (cr ? (cr + ' ' + L('кредитов') + ' · ') : '') + when + (txCur.mode ? ' · ' + txCur.mode : '') + (!txCur.path && txCur.url ? ' · ' + stUrlNote(txCur) : '');
    var mh = txEl('res_models');
    mh.innerHTML = '';
    if (t.ckpt) mh.appendChild(txCard(txNameOf(String(t.ckpt)), 'CHECKPOINT', ''));
    var ls = Array.isArray(t.loras) ? t.loras : [];
    for (var i = 0; i < ls.length; i++) {
      if (ls[i] && ls[i].id) mh.appendChild(txCard(txNameOf(String(ls[i].id)), 'LORA', '×' + (ls[i].w != null ? ls[i].w : 1)));
    }
    var es = Array.isArray(t.embeds) ? t.embeds : [];
    for (var j = 0; j < es.length; j++) {
      if (es[j] && es[j].id) mh.appendChild(txCard(txNameOf(String(es[j].id)), 'EMBEDDING', '×' + (es[j].w != null ? es[j].w : 1)));
    }
    txEl('res_prompt').textContent = String(t.prompt || txCur.prompt || '');
    txEl('res_neg').textContent = typeof t.negTa === 'string' ? t.negTa : String(t.neg || '');
    var g = txEl('res_grid');
    g.innerHTML = '';
    var cells = [['Sampler', t.sampler || 'auto'], ['Steps', t.steps], ['CFG Scale', t.cfg], ['Seed', t.seed], ['Clip Skip', t.clip], ['Size', (t.w || '?') + 'x' + (t.h || '?')]];
    for (var k = 0; k < cells.length; k++) {
      var c = D.createElement('div');
      c.className = 'iig-txcell';
      var l = D.createElement('div');
      l.className = 'iig-l';
      l.textContent = cells[k][0];
      var v = D.createElement('div');
      v.className = 'iig-txbox';
      v.textContent = cells[k][1] == null ? '—' : String(cells[k][1]);
      c.appendChild(l);
      c.appendChild(v);
      g.appendChild(c);
    }
    var hasTam = !!(txCur.tam && typeof txCur.tam === 'object');
    txEl('remix').classList.toggle('iig-hidden', !hasTam);
    txEl('copy').classList.toggle('iig-hidden', !hasTam);
    txEl('tolib').classList.toggle('iig-hidden', !hasTam);
    var noFile = !txCur.path;
    var acts = D.querySelectorAll('#iig_tx_res_acts button[data-txact]');
    for (var q = 0; q < acts.length; q++) {
      var an = acts[q].getAttribute('data-txact');
      if (an === 'open') acts[q].classList.toggle('iig-hidden', !stUrlOk(txCur));
      else if (an !== 'del') acts[q].classList.toggle('iig-hidden', noFile);
    }
    var nav = txList.length > 1;
    txEl('prev').classList.toggle('iig-hidden', !nav);
    txEl('next').classList.toggle('iig-hidden', !nav);
    txEl('putbox').classList.add('iig-hidden');

  function txStep(dir) {
    if (!txCur || txList.length < 2) return;
    var i = -1;
    for (var k = 0; k < txList.length; k++) if (txList[k].id === txCur.id) i = k;
    if (i < 0) return;
    txShow(txList[(i + dir + txList.length) % txList.length]);
  }

  async function txCopy() {
    if (!txCur || !txCur.tam) return '';
    var text = txA1111(txCur.tam);
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) await navigator.clipboard.writeText(text);
      txStat(L('generation data скопированы'));
    } catch (e) {
      txStat(L('буфер обмена недоступен'));
    }
    return text;
  }

  var txToLibBusy = false;

  async function txToLib() {
    if (txToLibBusy || !txCur || !txCur.tam) return;
    var rec = txCur;
    var btn = txEl('tolib');
    txToLibBusy = true;
    if (btn) btn.disabled = true;
    txStat(L('сохраняю ремикс…'));
    try {
      await taLibAdd({ path: rec.path, tam: rec.tam, name: String(rec.text || rec.tam.prompt || rec.prompt || '').replace(/\s+/g, ' ').trim().slice(0, 40), from: 'studio' });
      txStat(L('ремикс сохранён в библиотеку'));

  async function txAct(act) {
    var rec = txCur;
    if (!rec) return;
    if (act === 'img2img' || act === 'inpaint' || act === 'upscale') {
      txModeSet(act);
      txSrcSet({ kind: 'studio', id: String(rec.id), path: rec.path });
      try {
        txEl('tabs').scrollIntoView({ block: 'start', behavior: 'smooth' });
      } catch (e) {}
      txStat(L('картинка стала исходником'));
      return;
    }
    if (act === 'open') {
      if (!stUrlOk(rec)) {
        txStat(L('картинка Tensor не сохранилась — ссылка истекла'));
        return;
      }
      try {
        window.open(String(rec.url), '_blank', 'noopener');
      } catch (e) {
        txStat(L('ссылка не открылась: ') + ((e && e.message) || e));
      }
      return;
    }
    if (!rec.path && act !== 'del') return;
    if (act === 'board') {
      var box = txEl('putbox');
      var open = box.classList.contains('iig-hidden');
      box.classList.toggle('iig-hidden', !open);
      if (open) boardOptions(txEl('bsel'));
      return;
    }
    if (act === 'dl') {
      var f = galParts(rec.path);
      try {
        var b64 = f ? await tv().file.load(f.name, { encoding: 'base64', scope: f.scope }) : '';
        if (b64) tv().utils.export(f.name, b64);
        else tv().utils.preview(stFileUrl(rec.path));
      } catch (e) {
        txStat(L('скачать не вышло: ') + ((e && e.message) || e));
      }
      return;
    }
    if (act === 'del') {
      if (!(await askSure(L('Удалить эту картинку из студии?'), L('удалить')))) return;
      var r = await kvRace(function() {
        return tv().get('iig_studio', 'global');
      }, 6000);
      if (r.st !== 'ok') {
        txStat(L('список студии не прочитался — удаление отменено'));
        return;
      }
      var next = (Array.isArray(r.v) ? r.v : []).filter(function(x) {
        return x && x.id !== rec.id;
      });
      try {
        await tv().set('iig_studio', next, 'global');
      } catch (e) {
        txStat(L('не удалилось: ') + ((e && e.message) || e));
        return;
      }
      var fp = galParts(rec.path);
      try {
        if (fp) await tv().file.delete(fp.name, { scope: fp.scope });
      } catch (e2) {}
      txCur = null;
      txStat(L('удалено'));
      txListLoad();
    }
  }

      txEl('putbox').classList.add('iig-hidden');
      txStat(L('картинка лежит на доске — открой её на вкладке «доски», чтобы назвать и описать'));
    } catch (e) {
      txStat(L('на доску не легло: ') + ((e && e.message) || e));
    }
  }

  async function txCheck() {
    var btn = txEl('ckpt_chk');
    var info = txEl('info');
    if (!btn || btn.disabled) return;
    var o = txRead();
    var ids = [];
    if (o.ckpt) ids.push([L('чекпоинт'), o.ckpt]);
    for (var i = 0; i < o.loras.length; i++) ids.push(['LoRA ' + (i + 1), o.loras[i].id]);
    for (var j = 0; j < o.embeds.length; j++) ids.push([L('эмбеддинг ') + (j + 1), o.embeds[j].id]);
    if (!ids.length) {
      info.textContent = L('впиши ID или ссылку чекпоинта');
      return;
    }
    var key = await txKey(ids[0][1]);
    if (!key) {
      info.textContent = L('нужен ключ Tensor Art — вкладка api');
      return;
    }
    btn.disabled = true;
    info.textContent = L('проверяю…');
    var lines = [];
    for (var k = 0; k < ids.length; k++) {
      var r = await taModelInfo(key, ids[k][1]);
      if (r.st === 200) {
        txModelNote(ids[k][1], r.model || {});
        if (k === 0 && o.ckpt) txCkptName = String((r.model && r.model.name) || '').slice(0, 80);
      }
      lines.push(ids[k][0] + ': ' + (r.st === 200 ? taModelLine(r.model) : r.msg));
    }
    info.textContent = lines.join('\n');
    btn.disabled = false;
    txCkptPaint();
    txLorasPaint();
    taSave();
  }

  function taCheck() {
    return txCheck();

  function txTrigAdd() {
    var o = txRead();
    var ids = [o.ckpt].concat(o.loras.map(function(l) {
      return l.id;
    }));
    var words = [];
    for (var i = 0; i < ids.length; i++) {
      var tw = txTrigMap[ids[i]] || [];
      for (var j = 0; j < tw.length; j++) if (words.indexOf(tw[j]) < 0) words.push(tw[j]);
    }
    if (!words.length) {
      txStat(L('триггер-слов нет — нажми «проверить» у модели'));
      return;
    }
    var p = txEl('prompt');
    var cur = String(p.value || '');
    var low = cur.toLowerCase();
    var add = words.filter(function(w) {
      return low.indexOf(w.toLowerCase()) < 0;
    });
    if (!add.length) {
      txStat(L('триггер-слова уже в промпте'));
      return;
    }
    p.value = (add.join(', ') + (cur.trim() ? ', ' + cur.trim() : '')).slice(0, 4000);
    taSave();
    txStat(L('триггер-слова добавлены'));
  }

  }

  function stChip(text, on, fn) {
    var b = D.createElement('button');
    b.type = 'button';
    b.className = 'iig-chip iig-wchip' + (on ? ' iig-on' : '');

    return b;

  function stUrlOk(rec) {
    if (!rec || rec.path || !/^https:\/\//i.test(String(rec.url || ''))) return false;
    var exp = Number(rec.urlExp) || 0;
    return !exp || Date.now() <= exp;
  }

  function stUrlHhmm(ms) {
    try {
      var d = new Date(Number(ms) || 0);
      var p = function(n) {
        return (n < 10 ? '0' : '') + n;
      };
      return p(d.getHours()) + ':' + p(d.getMinutes());
    } catch (e) {
      return '';
    }
  }

  function stUrlNote(rec) {
    if (!rec || rec.path || !rec.url) return '';
    if (!stUrlOk(rec)) return L('картинка Tensor не сохранилась — ссылка истекла');
    return L('картинка не скачалась — показана по ссылке до ') + stUrlHhmm(rec.urlExp);
  }

  function stPicSet(im, rec) {
    if (rec && rec.path) {
      im.src = stFileUrl(rec.path);
      return;
    }
    if (stUrlOk(rec)) {
      im.setAttribute('referrerpolicy', 'no-referrer');
      im.src = String(rec.url);
      return;
    }
    im.removeAttribute('src');
  }

  function stFileUrl(path) {
    var f = galParts(path);
    try {
      if (f && tv().file && tv().file.url) {
        var u = tv().file.url(f.name, f.scope);
        if (u) return String(u);
      }
    } catch (e) {}
    return String(path || '');
  }

  });

  function stBoardFill(sel, list, idx, empty) {
    var h = '';
    var keys = [];
    for (var i = 0; i < list.length; i++) {
      var b = list[i];
      if (!b.items.length) continue;
      keys.push(b.key);

  function stEditModal(rec, onMark) {
    var r0 = D.getElementById(ROOT);
    if (!r0 || !rec) return;
    var old = r0.querySelector('.iig-ask');
    if (old) old.remove();
    var ov = D.createElement('div');
    ov.className = 'iig-ask';

    box.className = 'iig-askbox iig-stedbox';
    var q = D.createElement('div');
    q.className = 'iig-askq';
    q.textContent = L('Доработка картинки');
    var pic = D.createElement('div');
    pic.className = 'iig-stedpic';
    var im = D.createElement('img');
    im.alt = '';
    im.src = stFileUrl(rec.path);
    var cv = D.createElement('canvas');
    cv.id = 'iig_st_emark';
    pic.appendChild(im);
    pic.appendChild(cv);
    var hint = D.createElement('div');
    hint.className = 'iig-note iig-stedhint';
    var strokes = [];
    var stroke = null;
    var hintPaint = function() {
      hint.textContent = strokes.length ? L('место отмечено — правка только в нём') : L('обведи пальцем место, которое надо исправить — или не обводи, тогда правка на всю картинку');
    };
    var redraw = function() {
      var g = null;
      try {
        g = cv.getContext('2d');
      } catch (e) {}
      if (!g) return;
      g.clearRect(0, 0, cv.width, cv.height);
      g.strokeStyle = '#ff3b3b';
      g.lineWidth = 3;
      g.lineJoin = 'round';
      g.lineCap = 'round';
      for (var a = 0; a < strokes.length; a++) {
        var st = strokes[a];
        g.beginPath();
        for (var i = 0; i < st.length; i++) {
          if (i) g.lineTo(st[i][0] * cv.width, st[i][1] * cv.height);
          else g.moveTo(st[i][0] * cv.width, st[i][1] * cv.height);
        }
        g.stroke();
      }
    };
    var ptOf = function(e) {
      var r = cv.getBoundingClientRect();
      return [Math.min(1, Math.max(0, (e.clientX - r.left) / (r.width || 1))), Math.min(1, Math.max(0, (e.clientY - r.top) / (r.height || 1)))];
    };
    cv.addEventListener('pointerdown', function(e) {
      e.preventDefault();
      if (cv.clientWidth && (cv.width !== cv.clientWidth || cv.height !== cv.clientHeight)) {
        cv.width = cv.clientWidth;
        cv.height = cv.clientHeight;
      }
      stroke = [ptOf(e)];
      strokes.push(stroke);
      while (strokes.length > 6) strokes.shift();
      try {
        cv.setPointerCapture(e.pointerId);
      } catch (x) {}
    });
    cv.addEventListener('pointermove', function(e) {
      if (!stroke) return;
      stroke.push(ptOf(e));
      redraw();
    });
    var strokeEnd = function() {
      if (stroke && stroke.length < 2) strokes.pop();
      stroke = null;
      hintPaint();
    };
    cv.addEventListener('pointerup', strokeEnd);
    cv.addEventListener('pointercancel', strokeEnd);
    var packMark = function() {
      return strokes.slice(-6).map(function(st) {
        var step = Math.max(1, Math.ceil(st.length / 80));
        var out = [];
        for (var i = 0; i < st.length && out.length < 80; i += step) out.push([Math.round(st[i][0] * 1000) / 1000, Math.round(st[i][1] * 1000) / 1000]);
        return out;
      });
    };
    var clr = D.createElement('button');
    clr.type = 'button';
    clr.id = 'iig_st_eclear';
    clr.className = 'iig-btn2 iig-gapt';
    clr.textContent = L('стереть');
    clr.addEventListener('click', function() {
      strokes.length = 0;
      stroke = null;
      redraw();
      hintPaint();
    });
    hintPaint();
    var ta = D.createElement('textarea');
    ta.id = 'iig_st_etext';
    ta.className = 'iig-in iig-askin';
    ta.rows = 3;
    ta.placeholder = L('что исправить: например, перерисуй левую руку, пальцев должно быть пять');
    var sel = D.createElement('select');
    sel.id = 'iig_st_esz';
    sel.className = 'iig-in iig-gapt';
    sel.innerHTML = pairOptions(ST_SZ, '1K');
    sel.value = stSzOk(rec.sz) || stSzOk((panelCfgRaw && panelCfgRaw.imageSize) || '') || '1K';
    var row = D.createElement('div');
    row.className = 'iig-prow';
    var no = D.createElement('button');
    no.type = 'button';
    no.id = 'iig_st_ecancel';
    no.className = 'iig-btn2 iig-askbtn';
    no.textContent = L('отмена');
    var yes = D.createElement('button');
    yes.type = 'button';
    yes.id = 'iig_st_ego';
    yes.className = 'iig-btn2 iig-askbtn';
    yes.textContent = L('доработать');
    no.addEventListener('click', function() {
      ov.remove();
    });
    if (onMark) {
      ta.classList.add('iig-hidden');
      sel.classList.add('iig-hidden');
      q.textContent = L('Маска для Inpaint');
      yes.textContent = L('готово');
    }
    yes.addEventListener('click', function() {
      if (onMark) {
        var mk = packMark();
        if (!mk.length) {
          stStat(L('обведи место, которое надо перерисовать'));
          return;
        }
        onMark(mk);
        ov.remove();
        return;
      }
      var text = (ta.value || '').trim();
      if (text.length < 3) {
        try {

        stStat(L('опиши, что исправить'));
        return;

    });
    ov.addEventListener('click', function(e) {

    row.appendChild(no);
    row.appendChild(yes);
    box.appendChild(q);
    box.appendChild(pic);
    box.appendChild(hint);
    box.appendChild(clr);
    box.appendChild(ta);
    box.appendChild(sel);
    box.appendChild(row);
    ov.appendChild(box);
    r0.appendChild(ov);

  async function stDeleteMany(ids, q) {
    if (!ids.length) {
      stStat(L('ничего не выбрано'));
      return;
    }
    if (!(await askSure(q, L('удалить')))) return;
    var r = await kvRace(function() {
      return tv().get('iig_studio', 'global');
    }, 6000);
    if (r.st !== 'ok') {
      stStat(L('список студии не прочитался — удаление отменено'));
      return;
    }
    var gone = {};
    for (var i = 0; i < ids.length; i++) gone[ids[i]] = 1;
    var all = Array.isArray(r.v) ? r.v : [];
    var next = all.filter(function(x) {
      return x && !gone[x.id];
    });
    try {
      await tv().set('iig_studio', next, 'global');
    } catch (e) {
      stStat(L('не удалилось: ') + ((e && e.message) || e));
      return;
    }
    for (var j = 0; j < all.length; j++) {
      if (!all[j] || !gone[all[j].id]) continue;
      var f = galParts(all[j].path);
      if (!f) continue;
      try {
        await tv().file.delete(f.name, { scope: f.scope });
      } catch (e2) {}
    }
    if (stCur && gone[stCur.id]) stCur = null;
    stSess = stSess.filter(function(id) {
      return !gone[id];
    });
    stSel = {};
    stSelMode = false;
    stStat(L('удалено: ') + ids.length);
    stHistLoad();
  }

  function stPoll() {

    stPollT = regT(setInterval(async function() {
      var j = null;
      try {
        j = await tmo(tv().get('iig_st_job', 'global'), 3000);
      } catch (e) {}
      var k = j ? stJobs.indexOf(j.id) : -1;
      if (k >= 0) {
        var fin = j.state === 'ok' || j.state === 'error';
        var ids = Array.isArray(j.ids) ? j.ids : [];
        var mark = j.id + ':' + j.state + ':' + (j.k || 0) + ':' + ids.length;
        var gone = stJobs.splice(0, fin ? k + 1 : k).length;
        var left = stJobs.length - (fin ? 0 : 1);
        var tail = left > 0 ? (L(' · в очереди ещё: ') + left) : '';
        if (j.state === 'prompt') stStat(L('пишу промпт…') + tail);
        else if (j.state === 'image') stStat((j.n > 1 ? (L('рисую вариант ') + j.k + L(' из ') + j.n + '…') : L('рисую картинку…')) + ((j.n > 1 && ids.length) ? (L(' · готово: ') + ids.length) : '') + tail);
        else if (j.state === 'ok') stStat(L('готово') + tail);
        else if (j.state === 'error') stStat(L('не вышло: ') + (j.error || L('сбой')) + tail);
        if (mark !== stMark) {
          stMark = mark;
          stPollAt = Date.now();
          var fresh = [];
          for (var si = 0; si < ids.length; si++) {
            if (stSess.indexOf(ids[si]) < 0) {
              stSess.push(ids[si]);
              fresh.push(ids[si]);
            }
          }
          if (j.state === 'error' && stTargets[j.id]) {
            var tgE = stTargets[j.id];
            delete stTargets[j.id];
            msg(L('картинка «') + tgE.name + L('» не вышла: ') + (j.error || L('сбой')));
          }
          if (fresh.length || fin || gone > 1 || (j.state === 'image' && j.k > 1)) stHistLoad(fresh.length ? fresh[fresh.length - 1] : '').then(function() {
            if (j.state === 'ok' && ids.length) stTargetDone(j.id, ids[0]);
          });
        }
      }
      if (!stJobs.length) {
        stPollStop();
        return;
      }
      if (Date.now() - stPollAt > 360000) {
        stJobs = [];
        stPollStop();
        stStat(L('движок не ответил за 6 минут — посмотри «ошибки плагина» на главной'));
      }
    }, 1500));
  }

  function statLine(s) {

    if (s.pwCalls) bits.push(L('промптов написано: ') + statNum(s.pwCalls));
    if (s.pwTokIn || s.pwTokOut) bits.push(L('токены промптов: ') + statNum(s.pwTokIn) + L(' на вход, ') + statNum(s.pwTokOut) + L(' на выход'));
    if (s.imgTok && s.imgs) bits.push(L('токенов на картинку: ~') + statNum(s.imgTok / s.imgs));
    return bits.join(' · ');
  }

  async function statPaint() {
    var box = D.getElementById('iig_stat_box');
    var host = D.getElementById('iig_stat_days');
    if (!box || !host) return;
    var chat = null;
    var all = null;
    try {
      chat = await tmo(tv().get('iig_stats', 'chat'), 4000);
    } catch (e) {}
    try {
      all = await tmo(tv().get('iig_stats_all', 'global'), 4000);
    } catch (e) {}
    chat = (chat && typeof chat === 'object') ? chat : {};
    all = (all && typeof all === 'object') ? all : {};
    var since = all.since ? statDay(all.since).split('-').reverse().join('.') : '';
    box.textContent = L('этот чат — ') + (chat.imgs ? statLine(chat) : L('картинок пока нет')) + '\n' +
      L('все чаты') + (since ? (L(' с ') + since) : '') + ' — ' + (all.imgs ? statLine(all) : L('общий счёт идёт с версии 1.5.0, пока пусто'));
    host.innerHTML = '';
    var days = (all.days && typeof all.days === 'object') ? all.days : {};
    var cells = [];
    var max = 0;
    for (var i = 13; i >= 0; i--) {
      var key = statDay(Date.now() - i * 86400000);
      var n = (days[key] && days[key].imgs) || 0;
      if (n > max) max = n;
      cells.push([key, n]);
    }
    for (var j = 0; j < cells.length; j++) {
      var col = D.createElement('div');
      col.className = 'iig-stcol';
      col.title = cells[j][0].split('-').reverse().join('.') + ': ' + cells[j][1];
      var num = D.createElement('div');
      num.className = 'iig-stday';
      num.textContent = cells[j][1] ? String(cells[j][1]) : '';
      var bar = D.createElement('div');
      bar.className = 'iig-stbar' + (cells[j][1] ? '' : ' iig-stzero');
      bar.style.height = (max ? Math.max(4, Math.round(cells[j][1] / max * 70)) : 4) + '%';
      var lab = D.createElement('div');
      lab.className = 'iig-stday';
      lab.textContent = cells[j][0].slice(8);
      col.appendChild(num);
      col.appendChild(bar);
      col.appendChild(lab);
      host.appendChild(col);
    }
  }

  async function boardPut(path, v, name) {
    v = String(v || '');
    var cut = v.indexOf('|');
    var c = null;
    for (var i = 0; i < CLOSETS.length; i++) if (cut > 0 && CLOSETS[i].conf.kind === v.slice(0, cut)) c = CLOSETS[i];
    if (!c) throw new Error(L('сначала создай доску на вкладке «доски»'));
    var du = await galBytes(path, 'dataUrl');
    if (!du || String(du).indexOf(',') < 0) throw new Error(L('файл картинки не прочитался'));
    var small = await fileToDataUrl(dataUrlToBlob(String(du)), 512, 0.72);
    var item = await c.addTo(v.slice(cut + 1), small, { name: String(name || '').slice(0, 40) });
    return { closet: c, item: item };
  }

  async function npcFind() {
    if (!castOk) {
      msg(L('паспорта NPC ещё читаются — подожди'));
      return;
    }
    if (npcScanT) {
      msg(L('поиск NPC уже идёт'));
      return;
    }
    var sid = 'sc' + Date.now().toString(36);
    await sendCmd('castscan', { sid: sid });
    msg(L('ищу NPC в карточке персонажа, персоне и лорбуках чата…'));
    var started = Date.now();
    npcScanT = regT(setInterval(async function() {
      var st = null;
      try {
        st = await tmo(tv().get('iig_cast_scan', 'chat'), 3000);
      } catch (e) {}
      if (st && st.sid === sid && st.state === 'ok') {
        npcScanStop();
        await castLoad();
        var names = Array.isArray(st.names) ? st.names : [];
        msg(names.length ? (L('найдено NPC: ') + names.join(', ') + L(' — проверь описания и нажми «нарисовать портрет», где нужна аватарка')) : L('новых NPC в карточке не нашлось'));
        return;
      }
      if (st && st.sid === sid && st.state === 'error') {
        npcScanStop();
        castPaint();
        msg(L('поиск NPC не вышел: ') + (st.error || L('сбой')));
        return;
      }
      if (Date.now() - started > 240000) {
        npcScanStop();
        castPaint();
        msg(L('движок не ответил за 4 минуты — посмотри «ошибки плагина» на главной'));
      }
    }, 1500));

  function sgalBuild(host) {
    var groups = [];
    var sig = '';
    for (var g = 0; g < SGAL.length; g++) {
      var have = [];
      for (var q = 0; q < SGAL[g][2].length; q++) {
        var x = SGAL[g][2][q];
        var live = sgalLive(x);
        if (live) have.push([live, x[1], x[2]]);
      }
      if (!have.length) continue;
      groups.push([SGAL[g][1], have]);
      sig += SGAL[g][0] + ':' + have.map(function(x) {
        return x[1] + '=' + x[0];
      }).join(',') + ';';
    }
    if (sig === sgalSig && host.firstChild) return;
    sgalSig = sig;
    host.innerHTML = '';
    for (var k = 0; k < groups.length; k++) {
      var lab = D.createElement('div');
      lab.className = 'iig-sglab';
      lab.textContent = groups[k][0];
      host.appendChild(lab);
      var grid = D.createElement('div');
      grid.className = 'iig-sggrid';
      var list = groups[k][1];
      for (var i = 0; i < list.length; i++) grid.appendChild(sgalTile(list[i][0], list[i][1], list[i][2]));
      host.appendChild(grid);
    }
    if (!groups.length) {
      var note = D.createElement('div');
      note.className = 'iig-note';
      note.textContent = L('встроенные стили ещё не прочитались — переоткрой панель');
      host.appendChild(note);

    sgalPump();

  function sgalCell(box, idx) {
    var slugs = sgalSlugs();
    var rows = Math.ceil(slugs.length / SGAL_COLS);
    var col = idx % SGAL_COLS;
    var row = Math.floor(idx / SGAL_COLS);
    var im = sgalSheet.im;
    try {
      var cv = D.createElement('canvas');
      var dpr = Math.max(1, Math.min(3, T.devicePixelRatio || 1));
      var side = Math.max(96, Math.min(SGAL_CELL, Math.ceil((box.clientWidth || 96) * dpr)));
      cv.width = side;
      cv.height = side;
      var ctx = im && cv.getContext ? cv.getContext('2d') : null;
      if (ctx) {
        ctx.drawImage(im, col * SGAL_CELL, row * SGAL_CELL, SGAL_CELL, SGAL_CELL, 0, 0, side, side);
        if (canvasBlank(cv)) {
          var tries = (parseInt(box.getAttribute('data-try'), 10) || 0) + 1;
          box.setAttribute('data-try', String(tries));
          if (tries < SGAL_CELL_TRIES) return false;
          box.setAttribute('data-skip', '1');
          return;
        }
        box.appendChild(cv);
        box.classList.remove('iig-sgno');
        return;
      }
    } catch (e) {}
    var st = box.style;
    st.setProperty('background-image', 'url(' + sgalSheet.url + ')', 'important');
    st.setProperty('background-repeat', 'no-repeat', 'important');
    st.setProperty('background-size', (SGAL_COLS * 100) + '% ' + (rows * 100) + '%', 'important');
    st.setProperty('background-position', (SGAL_COLS > 1 ? (col / (SGAL_COLS - 1) * 100) : 0) + '% ' + (rows > 1 ? (row / (rows - 1) * 100) : 0) + '%', 'important');
    box.classList.remove('iig-sgno');
  }

  function sgalBases() {
    var out = [];
    var add = function(u) {
      if (u && out.indexOf(u) < 0) out.push(u);
    };
    var U = T.URL || URL;
    try {
      var top = T.top;
      if (top && top.location && /^https?:/.test(top.location.href)) add(new U(SGAL_BASE, top.location.href).href);
    } catch (e) {}
    try {
      if (/^https?:/.test(T.location.href)) add(new U(SGAL_BASE, T.location.href).href);
    } catch (e) {}
    add(SGAL_BASE);
    return out;

  async function sgalFetch() {
    var bases = sgalBases();
    var diag = { at: Date.now(), pver: PVER, ua: String((T.navigator || {}).userAgent || '').slice(0, 160), tries: [] };
    sgalSheet.diag = diag;
    var U = T.URL || URL;
    var first = '';
    for (var i = 0; i < bases.length; i++) {
      var direct = bases[i] + 'styles.jpg?v=' + PVER;
      if (!first) first = direct;
      try {
        var r = await fetch(direct);
        if (r && r.ok === false) {
          diag.tries.push({ url: direct, status: r.status });
          continue;
        }
        if (r && typeof r.blob === 'function' && U && U.createObjectURL) {
          var bl = await r.blob();
          diag.tries.push({ url: direct, status: r.status, bytes: bl.size });
          if (bl.size > 0) return U.createObjectURL(bl);
          continue;
        }
        diag.tries.push({ url: direct, status: r ? r.status : null, img: 1 });
        return direct;
      } catch (e) {
        diag.tries.push({ url: direct, err: String((e && e.message) || e).slice(0, 80) });
      }
    }
    diag.fallback = first;
    return first;
  }

  function sgalDecode(url) {
    return new Promise(function(res) {
      var over = false;
      var im = null;
      var done = function(ok) {
        if (over) return;
        over = true;
        res(ok ? im : null);
      };
      later(function() {
        done(false);
      }, 8000);
      try {
        im = new T.Image();
        im.onload = function() {
          imgSettle(im).then(function() {
            done(true);
          });
        };
        im.onerror = function() {
          done(false);
        };
        im.src = url;
      } catch (e) {
        done(false);
      }
    });
  }

  async function sgalPump() {
    if (activeTab !== 'styles' || !sgalOpen()) return;
    if (sgalSheet.url) {
      sgalApply();
      return;
    }
    if (sgalBusy || sgalSheet.failed) return;
    sgalBusy = true;
    try {
      var url = await sgalFetch();
      if (url) {
        sgalSheet.im = await sgalDecode(url);
        sgalSheet.url = url;
        if (sgalSheet.diag) {
          sgalSheet.diag.decoded = !!sgalSheet.im;
          sgalSheet.diag.w = sgalSheet.im ? sgalSheet.im.naturalWidth : 0;
          sgalSheet.diag.h = sgalSheet.im ? sgalSheet.im.naturalHeight : 0;
        }
        sgalApply();
      } else sgalSheet.failed = true;
      sgalDiagSave();
    } catch (e) {}
    sgalBusy = false;
  }

  function kbRead() {
    try {
      var wv = (T.tav && T.tav.config && T.tav.config.webViewport) || {};
      var l = T.innerHeight;
      var c = Math.max(0, Number(wv.keyboardInset) || 0);
      if (c > 0) c += Math.max(0, Number(wv.nativeShortcutHeight) || 0);
      var d = Math.max(0, (Number(wv.hostViewportHeight) || l) - l);
      var vv = T.visualViewport;
      return Math.round(Math.max(0, c - d, vv ? (l - vv.height) : 0));
    } catch (e) {
      return 0;

  }

  function kbField(t) {

  function kbReveal() {
    try {
      var r0 = D.getElementById(ROOT);
      var a = D.activeElement;
      if (!r0 || !a || !r0.contains(a) || !kbField(a)) return;
      var card = r0.querySelector('.iig-card');

      var ar = a.getBoundingClientRect();
      var pad = 16;
      if (ar.height >= cr.height - pad * 2 || ar.top < cr.top + pad) card.scrollTop += ar.top - (cr.top + pad);
      else if (ar.bottom > cr.bottom - pad) card.scrollTop += ar.bottom - (cr.bottom - pad);

  }

      refs: refState.filter(function(x) {

      })

  async function fetchPwModels() {
    var base = (D.getElementById('iig_pw_ep').value || '').trim().replace(/\/+$/, '');
    var key = await vaultKeyFor('cfg.pw');
    if (!base || !key) {
      msg(L('сначала адрес и ключ подключения промпта'));
      return;
    }
    var isG = false;
    try {
      var hn = new(T.URL || URL)(base).hostname.toLowerCase();
      isG = (hn === 'googleapis.com' || hn.indexOf('.googleapis.com') === hn.length - 15);
    } catch (e) {}
    var url, hd = {};
    if (isG) {
      url = base.replace(/\/v1beta$/i, '') + '/v1beta/models';
      hd['x-goog-api-key'] = key;
    } else {
      hd.Authorization = 'Bearer ' + key;
    }
    if (!isG) url = /\/v1$/i.test(apiBase(base)) ? apiBase(base) + '/models' : apiBase(base) + '/v1/models';
    if (!(await vaultHostOk(url, 'cfg.pw'))) {
      msg(L(VAULT_HOST_MSG));
      return;
    }
    msg(L('загрузка…'));
    try {
      var rr = await fetch(url, {
        headers: hd
      });
      if (!rr.ok) {
        var tb1 = '';
        try {
          tb1 = await rr.text();
        } catch (e1) {}
        msg(L('не вышло: ') + apiHint(rr.status, tb1, url));
        return;
      }
      var d = await rr.json();
      var list;
      if (isG) list = ((d && d.models) || []).map(function(x) {
        return x && x.name ? String(x.name).replace(/^models\//, '') : '';
      }).filter(Boolean).sort();
      else list = ((d && d.data) || []).map(function(x) {
        return x && x.id ? String(x.id) : '';
      }).filter(Boolean).sort();
      var h = L('<option value>— моделей: ') + list.length + ' —</option>';
      for (var i = 0; i < list.length; i++) h += '<option>' + esc(list[i]) + '</option>';
      D.getElementById('iig_pw_models').innerHTML = h;
      msg(list.length ? '' : L('список пуст'));
    } catch (e) {
      msg(L('не вышло: сеть не пустила к ') + url + ' — ' + ((e && e.message) || e));
    }
  }

  function pppOverPaint(slot) {

  async function pppOverWrite() {
    var keep = {};
    if (pppOver.char) keep.char = pppOver.char;
    if (pppOver.user) keep.user = pppOver.user;
    if (keep.char || keep.user) await tmo(tv().set('iig_pp_over', keep, 'chat'), 15000);

  function pppPaint() {

    for (var i = 0; i < slots.length; i++) {

      });

  function pppImgOf(slot) {
    var own = panelPpImgs[slot];
    if (own) return Promise.resolve(String(own));
    var im = D.getElementById(slot === 'user' ? 'iig_pp_uimg' : 'iig_pp_cimg');
    return new Promise(function(res) {
      try {
        if (!im || !im.src || !im.naturalWidth) return res('');
        var sc = Math.min(1, 384 / Math.max(im.naturalWidth, im.naturalHeight));
        var cv = D.createElement('canvas');
        cv.width = Math.max(1, Math.round(im.naturalWidth * sc));
        cv.height = Math.max(1, Math.round(im.naturalHeight * sc));
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        res(cv.toDataURL('image/jpeg', 0.8));
      } catch (e) {
        res('');
      }
    });
  }

  async function pppSave(slot) {
    if (!pppOk) {
      msg(L('список паспортов не прочитался — переоткрой панель'));
