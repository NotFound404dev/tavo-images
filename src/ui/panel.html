  async function pppApply(slot, id) {
    var rec = pppList.find(function(x) {
      return x && x.id === id && x.slot === slot;
    });
    if (!rec) return;
    var was = pppOver[slot];
    pppOver[slot] = { id: rec.id, name: rec.name || '', text: rec.text || '', img: rec.img || '' };
    try {
      await pppOverWrite();
    } catch (e) {
      if (was) pppOver[slot] = was;
      else delete pppOver[slot];
      pppOverPaint(slot);
      msg(L('подстановка не записалась: ') + ((e && e.message) || e));
      return;
    }
    pppOverPaint(slot);
    msg(L('паспорт «') + rec.name + L('» подставлен для рефов в этом чате; ') + (slot === 'user' ? L('юзер чата') : L('персонаж чата')) + L(' и его паспорт не меняются, крестик вернёт паспорт чата'));
  }

  async function pppClear(slot) {
    if (!pppOver[slot]) {
      pppOverPaint(slot);
      return;
    }
    var was = pppOver[slot];
    delete pppOver[slot];
    try {
      await pppOverWrite();
    } catch (e) {
      pppOver[slot] = was;
      pppOverPaint(slot);
      msg(L('не удалось снять подстановку: ') + ((e && e.message) || e));
      return;
    }
    pppOverPaint(slot);
    msg(L('подстановка снята — для рефов снова паспорт чата'));
  }

  function tmo(p, ms) {
    return new Promise(function(res) {
      var t = setTimeout(function() {
        res(null);
      }, ms || 4000);
      Promise.resolve(p).then(function(v) {
        clearTimeout(t);
        res(v);
      }, function() {
        clearTimeout(t);
        res(null);
      });
    });
  }

  function tmoRes(p, ms) {
    return new Promise(function(res) {
      var t = setTimeout(function() {
        res({
          ok: false,
          v: null
        });
      }, ms || 4000);
      Promise.resolve(p).then(function(v) {
        clearTimeout(t);
        res({
          ok: true,
          v: v
        });
      }, function() {
        clearTimeout(t);
        res({
          ok: false,
          v: null
        });
      });
    });
  }

  function warmGet(k) {
    if (WARM[k]) return WARM[k];
    var pr;
    try {
      pr = Promise.resolve(tv().get(k, 'global'));
    } catch (e) {
      pr = Promise.resolve(null);
    }

      frShot: rulesRead().frShot,
      frAngle: rulesRead().frAngle,
      frTod: rulesRead().frTod,
      autoEvery: rulesRead().autoEvery,
      autoMinLen: rulesRead().autoMinLen,
      autoCool: 0,
      imgPrice: 0,
      sideWear: sideRead().sideWear,
      sideWearStrict: sideRead().sideWearStrict,
      sideCast: sideRead().sideCast,
      sidePlace: sideRead().sidePlace,
      translateRu: sideRead().translateRu,
      pwWait: parseInt(D.getElementById('iig_pw_wait').value, 10) || 0,
      useCharRef: D.getElementById('iig_cref').checked,
      useUserRef: D.getElementById('iig_uref').checked
    });
    if (cfg.styleLock == null) cfg.styleLock = '';
    if (cfg.pwDepth == null) cfg.pwDepth = 4;
    if (cfg.refMaxPx == null) cfg.refMaxPx = 768;
    delete cfg.apiKey;
    delete cfg.pwKey;
    if (vSeals.api) cfg.apiKeySeal = vSeals.api;
    else delete cfg.apiKeySeal;
    if (vSeals.pw) cfg.pwKeySeal = vSeals.pw;
    else delete cfg.pwKeySeal;
    krBroken = false;
    var pub = Object.assign({}, cfg);
    delete pub.apiKeySeal;
    delete pub.pwKeySeal;

    try {
      if (autoModeVal() === 'all') await tv().unset('iig_bf_stop', 'global');
    } catch (e) {}
    var vDropOnly = (vaultDrop['cfg.api'] && !vIn.api) || (vaultDrop['cfg.pw'] && !vIn.pw);
    var vNeed = vReset || vDropOnly || !!vIn.api || !!vIn.pw;
    try {
      var vPut = await vaultSealsPut(function(sl) {
        vaultPutOne(sl, 'api', '', cfg.apiKeySeal || '');
        vaultPutOne(sl, 'pw', '', cfg.pwKeySeal || '');
      }, vNeed);
      if (vNeed && !vPut.file) {
        msg(vDropOnly ? L('ключ не удалился — попробуй ещё раз') : L('ключ не сохранился — попробуй ещё раз'));
        return;
      }
      await tv().set('iig_cfg', cfg, 'global');
      warmSet('iig_cfg', cfg);
      panelCfgRaw = cfg;
      try {
        await sendCmd('rebind', {}, true);
      } catch (eRb) {}
      sgalPaint();
      try { T.IIG_CFG = pub; } catch (e) {}
      T.IIG_CFG = pub;
      vaultPend = { api: null, pw: null };
      vaultDrop = { 'cfg.api': false, 'cfg.pw': false };
      var kf1 = D.getElementById('iig_key');
      var kf2 = D.getElementById('iig_pw_key');
      if (kf1) kf1.value = '';
      if (kf2) kf2.value = '';
      vaultPaint().catch(function() {});
    } catch (e) {
      msg(L('не удалось сохранить настройки'));
      return;
    }

    try {
      T.dispatchEvent(new CustomEvent('iig-cfg'));
    } catch (eEv) {}
    var saveNote = saveWarn(Object.assign({}, cfg, { pwKey: cfg.pwKeySeal ? 'x' : '' })) + vSeals.note;
    try {
      var selP = (D.getElementById('iig_pname').value || '').trim() || (D.getElementById('iig_presets').value || '').trim();
      var pp = selP ? findByName(presetState, selP) : null;
      if (pp && (pp.apiStyle || 'gemini_native') !== cfg.apiStyle) {
        D.getElementById('iig_presets').value = '';
        D.getElementById('iig_pname').value = '';
        saveNote += L(' · тип подключения изменился — сохрани как новый профиль');
      } else if (pp) {
        var pf = presetFields(cfg);
        var pch = 'apiKey' in pp && vaultIsSeal(pp.apiKeySeal);
        for (var pfk in pf) {
          if ((pp[pfk] || '') !== pf[pfk]) pch = true;
        }
        var pSeal = '';
        if (vSeals.apiNew && vSeals.keys) {
          var po = vaultIsSeal(pp.apiKeySeal) ? vaultOpen('preset:' + selP, pp.apiKeySeal, vSeals.keys) : null;
          if (!po || po.k !== vSeals.apiNew.k || po.h !== vSeals.apiNew.h) {
            pSeal = vaultSeal('preset:' + selP, { k: vSeals.apiNew.k, h: vSeals.apiNew.h, s: cfg.apiStyle }, vSeals.keys);
            pch = true;
          }
        }
        if (pch) {
          for (var pfk2 in pf) pp[pfk2] = pf[pfk2];
          if (pSeal) pp.apiKeySeal = pSeal;
          if (vaultIsSeal(pp.apiKeySeal)) delete pp.apiKey;
          presetState = vaultStripList(presetState, 'apiKey');
          await tmo(tv().set('iig_presets', presetState, 'global'), 4000);
          warmSet('iig_presets', presetState);
          if (pSeal) await vaultSealsPut(function(sl) {
            vaultPutOne(sl, 'presets', selP, pSeal);
          });
          saveNote += L(' · профиль «') + selP + L('» обновлён новым подключением');
        }
      }
    } catch (eP) {}
    var pwSkipNote = '';
    try {
      var pwp = '';
      var pwn = cfg.promptName;
      var pwe = pwn ? findByName(promptState, pwn) : null;

      if (pwn && !pwe && !promptsOk) {
        pwSkipNote = L(' · стили не прочитались, активная методичка НЕ перезаписана — переоткрой панель');
      } else {
        if (pwe) {
          pwp = pwe.text || '';
          if (promptsOk && (pwe.neg || '') !== cfg.styleNegative) {
            pwe.neg = cfg.styleNegative;
            try {
              await promptsSafeWrite();
            } catch (e3) {}
          }
        } else pwp = D.getElementById('iig_prtext').value || '';
        await tv().set('iig_pw_prompt', pwp, 'global');
        warmSet('iig_pw_prompt', pwp);

        try {
          if (pwe && typeof pwe.own === 'boolean') await tv().set('iig_pw_own', pwe.own, 'global');
          else await tv().unset('iig_pw_own', 'global');
        } catch (e2) {}
        await tv().set('iig_pw_rev', Date.now(), 'global');
      }
    } catch (e) {}
    applyFrame(cfg.frame);
    try {
      await tv().set('iig_frame_css', frameCss(cfg.frame), 'global');
    } catch (e) {}

    var sameChat = true;
    try {
      var chNow = await tmo(tv().chat.current(), 4000);
      var idNow = (chNow && chNow.id != null) ? String(chNow.id) : null;
      if (panelChatId && idNow && idNow !== panelChatId) sameChat = false;
    } catch (e) {}
    if (!sameChat) msg(L('чат сменился — паспорта и аватарки не сохранены, переоткрой панель'));
    try {
      if (!sameChat) throw new Error('chat changed');
      if (!passportsOk) throw new Error('passports not loaded');
      var pps2 = (await tv().get('iig_passports', 'global')) || {};
      var pcv = (D.getElementById('iig_pp_char').value || '').trim();
      if (panelCharName) {
        if (pcv) pps2[panelCharName] = pcv;
        else delete pps2[panelCharName];
      }
      var puv = (D.getElementById('iig_pp_user').value || '').trim();
      if (panelUserName) pps2['__user:' + panelUserName] = puv;
      else if (puv) pps2.__user = puv;
      else delete pps2.__user;
      await tv().set('iig_passports', pps2, 'global');
      warmSet('iig_passports', pps2);
    } catch (e) {}
    try {
      if (sameChat && panelPpImgs && panelPpImgs.changed) {
        var pim2 = (await tv().get('iig_pp_imgs', 'global')) || {};
        if (panelCharName) {
          if (panelPpImgs.char) pim2[panelCharName] = panelPpImgs.char;
          else delete pim2[panelCharName];
        }
        if (panelUserName) pim2['__user:' + panelUserName] = panelPpImgs.user || null;
        else if (panelPpImgs.user) pim2.__user = panelPpImgs.user;
        else delete pim2.__user;
        await tv().set('iig_pp_imgs', pim2, 'global');
        warmSet('iig_pp_imgs', pim2);
        panelPpImgs.changed = false;
      }
    } catch (e) {}
    if (!refsOk) {
      msg(L('сохранено, но рефы не успели загрузиться — их список НЕ перезаписан, переоткрой панель') + pwSkipNote + saveNote);
      return;
    }
    var refsToSave = refState.filter(function(s) {
      if (!s) return false;
      if (s.kind === 'text') return String(s.note || '').trim().length > 0;
      return !!s.dataUrl;
    });
    try {
      await tv().set('iig_refs', refsToSave, 'global');
      warmSet('iig_refs', refsToSave);
      try {
        await tv().set('iig_refs_rev', Date.now(), 'global');
      } catch (er) {}
      var back = await tv().get('iig_refs', 'global');
      var okN = Array.isArray(back) ? back.filter(function(x) {
        return x && (x.dataUrl || (x.kind === 'text' && String(x.note || '').trim()));
      }).length : 0;
      if (okN < refsToSave.length) msg(L('сохранено, НО рефы не влезли в хранилище (') + okN + '/' + refsToSave.length + L(') — удали лишние или используй фото поменьше') + pwSkipNote + saveNote);
      else msg(L('сохранено') + (refsToSave.length ? (L(' · рефов: ') + okN) : '') + pwSkipNote + saveNote);
    } catch (e) {
      msg(L('настройки сохранены, но рефы не записались: ') + ((e && e.message) || e) + pwSkipNote + saveNote);
    }
  }
  async function fetchModels() {
    if (D.getElementById('iig_style').value === 'novelai') {
      msg(L('для NovelAI список моделей встроен'));
      return;
    }
    if (D.getElementById('iig_style').value === 'naistera') {
      msg(L('для Naistera список моделей встроен'));
      return;
    }
    var base = (D.getElementById('iig_ep').value || '').trim().replace(/\/+$/, '');
    var key = await vaultKeyFor('cfg.api');
    if (!base || !key) {
      msg(L('сначала адрес и ключ'));
      return;
    }
    var isGoogle = false;
    try {
      var hn2 = new(T.URL || URL)(base).hostname.toLowerCase();
      isGoogle = (hn2 === 'googleapis.com' || hn2.indexOf('.googleapis.com') === hn2.length - 15);
    } catch (e) {}
    var url, hdrs = {};
    if (isGoogle) {
      url = base.replace(/\/v1beta$/i, '') + '/v1beta/models';
      hdrs['x-goog-api-key'] = key;
    } else {
      hdrs.Authorization = 'Bearer ' + key;
    }
    if (!isGoogle) url = /\/v1$/i.test(apiBase(base)) ? apiBase(base) + '/models' : apiBase(base) + '/v1/models';
    if (!(await vaultHostOk(url, 'cfg.api'))) {
      msg(L(VAULT_HOST_MSG));
      return;
    }
    msg(L('загрузка…'));
    try {
      var rr = await fetch(url, {
        headers: hdrs
      });
      if (!rr.ok) {
        var tb0 = '';
        try {
          tb0 = await rr.text();
        } catch (e0) {}
        msg(L('не вышло: ') + apiHint(rr.status, tb0, url));
        return;
      }
      var d = await rr.json();
      var list;
      if (isGoogle) list = ((d && d.models) || []).map(function(x) {
        return x && x.name ? String(x.name).replace(/^models\//, '') : '';
      }).filter(Boolean).sort();
      else list = ((d && d.data) || []).map(function(x) {
        return x && x.id ? String(x.id) : '';
      }).filter(Boolean).sort();
      var h = L('<option value>— моделей: ') + list.length + ' —</option>';
      for (var i = 0; i < list.length; i++) h += '<option>' + esc(list[i]) + '</option>';
      D.getElementById('iig_models').innerHTML = h;
      msg(list.length ? '' : L('список пуст'));
    } catch (e) {
      msg(L('не вышло: сеть не пустила к ') + url + ' — ' + ((e && e.message) || e));
    }
  }
  injectStyle();
  var fab = D.createElement('button');
  fab.id = FAB;
  fab.setAttribute('data-hideable', '1');
  fab.appendChild(makeIcon(30, '#ffffff'));
  fab.addEventListener('click', open);
  D.body.appendChild(fab);
  var FAB_ON = (function() {
    try {
      if (tavo && tavo.plugin && tavo.plugin.config && typeof tavo.plugin.config.get === 'function') return !!tavo.plugin.config.get('fab');
    } catch (e) {}
    return true;
  })();
  if (!FAB_ON) fab.style.setProperty('display', 'none', 'important');
  try {
    if (T.__iigOpenL) T.removeEventListener('iig-open', T.__iigOpenL);
  } catch (e) {}
  T.__iigOpenL = function(ev) {
    try {
      var det = (ev && ev.detail) || {};
      Promise.resolve(open()).then(function() {
        if (det.tab !== 'ward') return;
        openOnBoards();
      }, function() {});
    } catch (e) {}
  };
  T.addEventListener('iig-open', T.__iigOpenL);
  try {
    if (T.__iigWornL) T.removeEventListener('iig-worn', T.__iigWornL);
  } catch (e) {}
  T.__iigWornL = function(ev) {
    try {
      var w = ev && ev.detail && ev.detail.worn;
      if (!w || typeof w !== 'object') return;
      warmSet('iig_ward_worn', w);
      CLOSETS[0].load();
    } catch (e) {}
  };
  T.addEventListener('iig-worn', T.__iigWornL);
  try {
    if (T.__iigCastL) T.removeEventListener('iig-cast', T.__iigCastL);
  } catch (e) {}
  T.__iigCastL = function() {
    try {
      castLoad();
    } catch (e) {}
  };
  T.addEventListener('iig-cast', T.__iigCastL);

  function pokeMemory() {
    try {
      var mz = D.getElementById('ms404-edge-hotzone');
      if (!mz) return;
      var ev = null;
      try {
        ev = new PointerEvent('pointerdown');
      } catch (e) {
        try {
          ev = new Event('pointerdown');
        } catch (x) {}
      }
      if (ev) mz.dispatchEvent(ev);
    } catch (e) {}
  }

  function wireZones() {
    try {
      if (!FAB_ON) return;
      var f0 = D.getElementById(FAB);
      if (!f0 || f0.isConnected === false) {
        try {
          D.body.appendChild(fab);
          fabShow();
        } catch (efb) {}
      }
      var mz = D.getElementById('ms404-edge-hotzone');
      if (mz && !mz._iigWired) {
        mz._iigWired = 1;
        mz.addEventListener('pointerdown', function() {
          fabShow();
        });
      }
      var hz = D.getElementById(HZ);
      if (!hz) {
        hz = D.createElement('div');
        hz.id = HZ;
        D.body.appendChild(hz);
        hz.onpointerdown = function() {
          fabShow();
          pokeMemory();
        };
        hz.onclick = function() {
          fabShow();
          pokeMemory();
        };
      }
      hz.style.cssText = mz ? 'position:fixed;right:0;bottom:202px;width:26px;height:70px;z-index:2147483646;background:transparent;pointer-events:auto;touch-action:manipulation;' : 'position:fixed;right:0;bottom:72px;width:26px;height:130px;z-index:2147483646;background:transparent;pointer-events:auto;touch-action:manipulation;';
    } catch (e) {}
  }
  wireZones();
  T.__IIG_PANEL_TIMER = regT(setInterval(wireZones, 4000));
  fabShow();

  later(function() {
    try {
      tv().unset('iig_dbg_dom', 'global');
    } catch (e) {}
  }, 6000);
  (function bootFrame(n) {
    loadCfg().then(function(c) {
      var has = false;
      try {
        for (var k in c) {
          if (k === '__iigDegraded') continue;
          has = true;
          break;
        }
      } catch (e) {}
      if (has) {
        applyFrame(c.frame);
        return;
      }
      applyFrame('soft');
      if (n > 0) later(function() {
        bootFrame(n - 1);
      }, 1500);
    }, function() {
      if (n > 0) later(function() {
        bootFrame(n - 1);
      }, 1500);
    });
  })(4);
})();
} catch (e) {
  try {
    tavo.utils.toast(L('IIG панель не собралась: ') + ((e && e.message) || e));
  } catch (x) {}
}
</script>
