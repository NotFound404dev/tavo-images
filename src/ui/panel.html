        var fh = vaultFieldHost(api);

        if (mis) out.note = L(' · ключ привязан к ') + sv.h + L(', в настройках сейчас ') + (fh || '—') + L(' — проверь адрес; чтобы перепривязать, введи ключ заново');
        continue;
      }
      if (!src) continue;
      if (!out.keys) {
        var wk = reset ? { keys: vaultKeys(vaultSecretMem), err: VAULT_NOFS_ERR } : await vaultWriteKeys(st);
        if (!wk.keys) throw new Error(wk.err);
        out.keys = wk.keys;
      }
      var h = String(src.h || '').toLowerCase();
      out[kind] = vaultSeal(slot, { k: src.k, h: h, s: api ? String(D.getElementById('iig_style').value || '') : 'pw' }, out.keys);
      if (api) out.apiNew = { k: src.k, h: h };
    }
    return out;
  }

  async function vaultSealsPut(fn, need) {
    var res = { ok: false, vari: false, file: false };
    var v = null;
    try {
      var r = await tmoRes(tv().get('iig_vault', 'global'), 4000);
      if (!r.ok) return res;
      v = (r.v && typeof r.v === 'object' && !Array.isArray(r.v)) ? r.v : null;
      if (v && (!v.seals || typeof v.seals !== 'object' || Array.isArray(v.seals))) v.seals = {};
      var fc = await vaultCopy();
      var fs = fc === undefined ? null : (fc || vaultCopyNorm(v && v.seals));
      if (fs) {
        fn(fs);
        var fo = vaultCopyNorm(fs);
        await tv().file.save(VAULT_SEALS_FILE, JSON.stringify({ v: 2, api: fo.api, pw: fo.pw, presets: fo.presets, pwPresets: fo.pwPresets, at: Date.now() }), { scope: 'global' });
        res.file = true;
      }
    } catch (e) {}
    if (need && !res.file) return res;
    try {
      if (v) {
        fn(v.seals);
        await tv().set('iig_vault', v, 'global');
        res.vari = true;
      }
    } catch (e) {}
    res.ok = res.vari || res.file;
    return res;
  }

  function vaultPutOne(seals, group, name, seal) {
    if (group === 'api' || group === 'pw') {
      if (seal) seals[group] = seal;
      else delete seals[group];
      return;
    }
    if (!seals[group] || typeof seals[group] !== 'object' || Array.isArray(seals[group])) seals[group] = {};
    if (seal) seals[group][name] = seal;
    else delete seals[group][name];
  }

  function vaultStripList(list, f) {
    if (!Array.isArray(list)) return list;
    var sf = f + 'Seal';
    return list.map(function(p) {
      if (!p || typeof p !== 'object' || !(f in p) || !vaultIsSeal(p[sf])) return p;
      var q = Object.assign({}, p);
      delete q[f];
      return q;
    });
  }

  async function vaultReset() {
    var before = await vaultReadFile();
    if (before.st === 'nofs') return false;
    var old = before.st === 'ok' ? before.hex : '';
    vaultSecretMem = '';
    try {
      await sendCmd('vaultreset', {}, true);
    } catch (e) {}
    for (var w = 0; w < 5000; w += 500) {
      await vaultSleep(500);
      var r = await vaultReadFile();
      if (r.st !== 'ok' || r.hex === old) continue;
      var m = await vaultMeta();
      var k = vaultKeys(r.hex);
      if (!m.ok || !k) continue;
      if (m.v.fp !== k.fp && vaultMetaHasSeals(m.v)) continue;
      vaultSecretMem = r.hex;
      if (panelCfgRaw && typeof panelCfgRaw === 'object') {
        delete panelCfgRaw.apiKeySeal;
        delete panelCfgRaw.pwKeySeal;
      }
      for (var a = 0; a < presetState.length; a++) if (presetState[a]) delete presetState[a].apiKeySeal;
      for (var b = 0; b < pwPresetState.length; b++) if (pwPresetState[b]) delete pwPresetState[b].pwKeySeal;
      WARM.iig_cfg = null;
      WARM.iig_presets = null;
      WARM.iig_pw_presets = null;
      return true;
    }
    return false;
  }

  async function safeListWrite(kvKey, bakKey, mutate, opts) {
    opts = opts || {};
    var rr = await kvRace(function() {
      return tv().get(kvKey, 'global');
    }, opts.tmo || 8000);
    if (rr.st !== 'ok' || (rr.v != null && !Array.isArray(rr.v))) {
      return { ok: false, why: rr.st === 'slow' ? 'slow' : 'bad' };
    }
    var base = Array.isArray(rr.v) ? rr.v.slice() : [];
    if (opts.strip) base = vaultStripList(base, opts.strip);
    if (base.length) {
      try {
        await tv().set(bakKey, base.slice(), 'global');
      } catch (eB) {}
    }
    var next = mutate(base);
    if (!next) return { ok: false, why: 'cancel' };
    if (opts.strip) next = vaultStripList(next, opts.strip);
    try {
      await tv().set(kvKey, next, 'global');
    } catch (eW) {
      return { ok: false, why: 'write' };
    }
    warmSet(kvKey, next);
    return { ok: true, list: next };
  }

  async function savePreset() {
    var name = (D.getElementById('iig_pname').value || '').trim() || (D.getElementById('iig_presets').value || '').trim();
    if (!name) {
      msg(L('впиши имя профиля'));
      return;
    }
    var p = presetFields({
      apiStyle: D.getElementById('iig_style').value,
      endpoint: (D.getElementById('iig_ep').value || '').trim(),
      model: (D.getElementById('iig_model').value || '').trim(),
      naisteraModel: D.getElementById('iig_nmodel').value,
      naiModel: D.getElementById('iig_naimodel').value,
      preset: D.getElementById('iig_preset').value
    });
    p.name = name;
    var pKey = (D.getElementById('iig_key').value || '').trim();
    var pSrc = await vaultPresetSrc('api', name, pKey);
    if (pSrc) {
      var pKs = await vaultKeysForWrite();
      if (!pKs.keys) {
        msg(L(pKs.err));
        return;
      }
      try {
        p.apiKeySeal = vaultSeal('preset:' + name, { k: pSrc.k, h: pSrc.h, s: p.apiStyle }, pKs.keys);
      } catch (eS) {
        msg(L(eS.message));
        return;
      }
    }
    var res = await safeListWrite('iig_presets', 'iig_presets_bak', function(base) {

      for (var li = 0; li < presetState.length; li++) {
        var lp = presetState[li];
        if (lp && lp.name && lp.name !== name && !findByName(base, lp.name)) base.push(lp);
      }
      var found = false;
      for (var i = 0; i < base.length; i++) {
        if (base[i] && base[i].name === name) {
          base[i] = p;
          found = true;
          break;
        }
      }
      if (!found) base.push(p);
      return base;
    }, { strip: 'apiKey' });
    if (!res.ok) {
      msg(L('хранилище не отдало список профилей — профиль НЕ сохранён, чтобы не затереть остальные; попробуй позже'));
      return;
    }
    await vaultSealsPut(function(sl) {
      vaultPutOne(sl, 'presets', name, p.apiKeySeal || '');
    });
    presetState = res.list;
    renderPresets();
    D.getElementById('iig_presets').value = name;
    msg(L('профиль сохранён: ') + name);
  }
  async function deletePreset() {
    var name = (D.getElementById('iig_presets').value || '').trim();
    if (!name) {
      msg(L('выбери профиль'));
      return;
    }

    if (!(await askSure(L('Удалить профиль «') + name + L('»? Остальные не тронутся.'), L('удалить')))) return;
    var was = '';
    var put = await vaultSealsPut(function(sl) {
      var g = sl.presets;
      if (g && typeof g === 'object' && vaultIsSeal(g[name])) was = g[name];
      vaultPutOne(sl, 'presets', name, '');
    }, true);
    if (!put.file) {
      msg(L('профиль не удалился — попробуй ещё раз'));
      return;
    }
    var res = await safeListWrite('iig_presets', 'iig_presets_bak', function(base) {
      var next = base.filter(function(p) {
        return p && p.name !== name;
      });
      if (next.length === base.length) return null;
      return next;
    }, { strip: 'apiKey' });
    if (!res.ok && res.why !== 'cancel' && was) await vaultSealsPut(function(sl) {
      vaultPutOne(sl, 'presets', name, was);
    });
    if (!res.ok) {
      msg(res.why === 'cancel'
        ? (L('профиля «') + name + L('» в хранилище уже нет — список не тронут, переоткрой панель'))
        : L('хранилище не отдало список — удаление отменено, чтобы ничего не потерять'));
      return;
    }
    presetState = res.list;
    renderPresets();
    D.getElementById('iig_pname').value = '';
    msg(L('профиль удалён: ') + name);
  }

    p.neg = (D.getElementById('iig_prneg').value || '').trim();

      }
      p.name = nn;
    }

    var frP = await kvRace(function() {
      return tv().get('iig_prompts', 'global');
    }, 8000);

    if (frP.st !== 'ok' || (frP.v != null && !Array.isArray(frP.v))) {
      msg(L('хранилище не отдало список — сохранение отменено, чтобы не затереть; попробуй позже'));

      try {
        await tv().set('iig_prompts_bak', frP.v.slice(), 'global');

      for (var mi = 0; mi < frP.v.length; mi++) {
        var ext = frP.v[mi];
        if (ext && ext.name && ext.name !== sel && !findByName(promptState, ext.name)) promptState.push(ext);
      }
    }
    try {
      await tv().set('iig_prompts', promptState, 'global');
      warmSet('iig_prompts', promptState);

      msg(L('не удалось сохранить промпт'));

  function kvRace(makePr, ms) {
    return new Promise(function(res) {
      var t = setTimeout(function() {
        res({ st: 'slow', v: null });
      }, ms || 20000);
      var pr;
      try {
        pr = Promise.resolve(makePr());
      } catch (e) {
        clearTimeout(t);
        res({ st: 'err', v: null, e: e });
        return;
      }
      pr.then(function(v) {
        clearTimeout(t);
        res({ st: 'ok', v: v });
      }, function(e) {
        clearTimeout(t);
        res({ st: 'err', v: null, e: e });
      });
    });
  }

  function apiHint(status, tb, url) {
    var s = String(tb || '').replace(/\s+/g, ' ').slice(0, 160);
    var low = String(tb || '').toLowerCase();
    var head = 'HTTP ' + status;
    if (status === 401 || low.indexOf('invalid api key') >= 0 || low.indexOf('invalid token') >= 0 || low.indexOf('missing bearer') >= 0) return head + L(' — сервер не принял ключ, проверь поле «Ключ»') + (s ? ' · ' + s : '');
    if (status === 402 || low.indexOf('insufficient') >= 0) return head + L(' — у ключа кончился баланс') + (s ? ' · ' + s : '');
    if (low.indexOf('model_not_found') >= 0 || low.indexOf('model not found') >= 0 || low.indexOf('无可用渠道') >= 0 || /model .{0,60}(does not exist|not exist|is not available|unknown)/.test(low)) return head + L(' — модель не найдена у провайдера для этого ключа: у роутеров ключ привязан к группе моделей — возьми модель из списка «обзор» (он показывает только доступные ключу) или сделай на сайте роутера ключ с нужной группой') + (s ? ' · ' + s : '');
    if (status === 429) return head + L(' — лимит запросов, подожди минуту') + (s ? ' · ' + s : '');
    if (status === 503 || status === 502 || status === 504 || low.indexOf('no providers') >= 0) return head + L(' — у провайдера нет свободных серверов, попробуй позже') + (s ? ' · ' + s : '');
    if (low.indexOf('<html') >= 0 || low.indexOf('<' + 'script') >= 0 || status === 403) return head + L(' — сервер вернул страницу вместо API: похоже, адрес не тот (') + url + ')';
    return head + (s ? ' — ' + s : '');
  }

  function memFmt(bytes) {
    if (bytes >= 1048576) return (bytes / 1048576).toFixed(1).replace('.', ',') + L(' МБ');
    if (bytes >= 1024) return Math.round(bytes / 1024) + L(' КБ');
    return (bytes || 0) + L(' Б');
  }

  function memIsPic(n) {
    return /^iig_[0-9a-z]{1,20}\.png$/i.test(String(n || ''));
  }

  function memIsSide(n) {
    return /^iig_[0-9a-z]{1,20}\.json$/i.test(String(n || ''));
  }

  function memIsKept(n) {
    return /^iig_(?:ward|world|asset|st|cast|map|item|av|diag)_[0-9a-z]+\.(?:jpg|json|png)$/i.test(String(n || '')) || /^iig_tr_[0-9a-z]+\.jpg$/i.test(String(n || ''));
  }

  function memRollId(n) {
    var m = String(n || '').match(/^iig_rr(\d{1,12})_\d+(?:_[0-9a-z]{1,16})?\.png$/i);
    return m ? parseInt(m[1], 10) : null;
  }

  function memIsJunk(n) {
    n = String(n || '');
    return n.indexOf('iig_') === 0 && !memIsPic(n) && !memIsSide(n) && !memIsKept(n) && memRollId(n) == null;
  }

  function memTk(n) {
    var m = String(n || '').match(/^iig_([0-9a-z]{1,20})\.(?:png|json)$/i);
    return m ? m[1] : '';
  }

  async function memList(scope) {
    var out = [],
      cur = null;
    for (var i = 0; i < 60; i++) {
      var o = { scope: scope, limit: 200 };
      if (cur) o.cursor = cur;
      var d = null;
      try {
        d = await tmo(tv().file.list(o), 20000);
      } catch (e) {
        break;
      }
      var fs = (d && (d.files || d.items)) || (Array.isArray(d) ? d : []);
      for (var k = 0; k < fs.length; k++) {
        var f = fs[k];
        if (!f) continue;
        if (typeof f === 'string') f = { name: f.split('/').pop(), path: f, size: 0 };
        if (!f.path) f.path = 'files/' + scope + '/' + f.name;
        f._scope = scope;
        out.push(f);
      }
      cur = d && d.nextCursor;
      if (!cur) break;
    }
    return out;
  }

  var memState = null;

  async function memScan(quiet) {
    var el = D.getElementById('iig_mem');
    if (!el) return null;
    if (!quiet) el.textContent = L('считаю…');
    var g = await memList('global');
    var c = await memList('chat');

    var pick = function (arr, f) {
      var size = 0,
        n = 0,
        tks = {};
      for (var i = 0; i < arr.length; i++) {
        if (f && !f(arr[i].name)) continue;
        size += arr[i].size || 0;
        n++;
        if (memIsPic(arr[i].name)) tks[memTk(arr[i].name)] = 1;
      }
      return { size: size, pics: Object.keys(tks).length, n: n };
    };
    var mine = pick(g.concat(c), function (n) { return memIsPic(n) || memIsSide(n); });
    var junk = pick(g.concat(c), memIsJunk);
    memState = { global: g, chat: c };
    var lines = [L('картинки: ') + memFmt(mine.size) + ' · ' + mine.pics + L(' шт')];
    lines.push(L('в этом чате: ') + memFmt(pick(c, function (n) { return memIsPic(n) || memIsSide(n); }).size));
    if (junk.n) lines.push(L('мусор: ') + memFmt(junk.size) + ' · ' + junk.n + L(' файлов'));
    el.textContent = lines.join('\n');
    return memState;
  }

    var pick = [];
    var all = st.global.concat(st.chat);
    for (var i = 0; i < all.length; i++) {

    }

    var live = {};
    var liveIds = {};
    try {

      var all2 = (await tmo(tv().message.find([from]), 20000)) || [];
      for (var j = 0; j < all2.length; j++) {
        if (!all2[j] || all2[j].hidden) continue;
        if (all2[j].id != null) liveIds[all2[j].id] = 1;
        live[memTextKey(all2[j].content)] = 1;

        var mre = new RegExp(memMarkRe.source, 'gi');
        var mk2;
        while ((mk2 = mre.exec(String(all2[j].content || '')))) live[mk2[1].toLowerCase()] = 1;
      }

      if (all2.length && !from) {
        for (var k = 0; k < st.chat.length; k++) {

          var rid = memRollId(f2.name);
          if (rid != null) {

          if (um) {
            if (!liveIds[parseInt(um[1], 10)]) pick.push(f2);
            continue;

          if (!live[memTk(f2.name)]) pick.push(f2);

  var memMarkRe = /<!--\s*iig:([a-z0-9_]{4,40})\s*-->/i;

  async function memStripMark(id) {
    try {
      var m = null;
      try {
        m = await tv().message.get(id);
      } catch (e) {}
      if (!m || m.content == null) return false;
      var c = String(m.content);
      if (!memMarkRe.test(c)) return false;
      var c2 = c.replace(new RegExp(memMarkRe.source, 'gi'), '').replace(/\s+$/, '');
      try {
        await tv().message.update({ id: id, content: c2 });
      } catch (e) {
        await tv().message.update(id, { content: c2 });
      }
      return true;
    } catch (e) {
      return false;
    }
  }

  async function memStripMarksByTk(tks) {
    var set = {};
    var any = false;
    for (var i = 0; i < tks.length; i++) {
      if (tks[i]) {
        set[String(tks[i]).toLowerCase()] = 1;
        any = true;
      }
    }
    if (!any) return;
    try {
      var total = await tmo(tv().message.count(), 6000);
      var from = (total && total > 400) ? (total - 400) : 0;
      var all = (await tmo(tv().message.find([from]), 20000)) || [];
      var gone = null;
      for (var j = 0; j < all.length; j++) {
        var m = all[j];
        if (!m || m.id == null) continue;
        var mkAll = String(m.content || '').match(new RegExp(memMarkRe.source, 'gi'));
        var mk = mkAll ? String(mkAll[mkAll.length - 1]).match(memMarkRe) : null;
        if (!mk || !set[mk[1].toLowerCase()]) continue;
        if (!gone) {
          try {
            gone = (await tmo(tv().get('iig_gone', 'chat'), 5000)) || {};
          } catch (eg) {
            gone = {};
          }
        }
        gone[mk[1].toLowerCase()] = 1;
        gone[memTextKey(m.content)] = 1;
        await memStripMark(m.id);
      }
      if (gone) {
        try {
          await tv().set('iig_gone', gone, 'chat');
        } catch (eg2) {}
      }
    } catch (e) {}
  }

  function memH32(x) {
    x = String(x || '');
    var n = 2166136261;
    for (var i = 0; i < x.length; i++) n = Math.imul(n ^ x.charCodeAt(i), 16777619) >>> 0;
    return n.toString(36);
  }

  function memTextKey(content) {
    return memH32(String(content || '')
      .replace(/<[^>]{0,}>/g, ' ')
      .replace(/[^0-9A-Za-zЀ-ӿ]+/g, ' ')
      .trim().toLowerCase().slice(0, 600));
  }

  function esc(s) {
    s = String(s == null ? '' : s);
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function galStripMarkers(s) {
    s = String(s || '');
    var prev = null;
    while (prev !== s) {
      prev = s;
      s = s.replace(/[ \t]{0,}\[(CAST|AR):[^\]]{0,}\][ \t]{0,}$/i, '');
    }
    return s.replace(/\s{1,}$/, '');
  }

  function galThumb(src) {
    return new Promise(function(res) {
      try {
        var im = new Image();
        im.onload = function() {
          imgSettle(im).then(function() {
            try {
              var w = im.naturalWidth || im.width,
                h = im.naturalHeight || im.height;
              var sc = Math.min(1, 512 / Math.max(w, h));
              if (sc >= 1) return res(src);
              var cw = Math.max(1, Math.round(w * sc)),
                ch = Math.max(1, Math.round(h * sc));
              var cv = D.createElement('canvas');
              cv.width = cw;
              cv.height = ch;
              cv.getContext('2d').drawImage(im, 0, 0, cw, ch);
              if (canvasBlank(cv)) return res(src);
              res(cv.toDataURL('image/jpeg', 0.85) || src);
            } catch (e) {
              res(src);
            }
          });
        };
        im.onerror = function() {
          res(src);
        };
        im.src = src;
      } catch (e) {
        res(src);
      }
    });
  }

  function clAvCachePut(k, du) {
    if (!clAvCache || !k || !du || du.indexOf('data:') !== 0 || du.length > CL_AV_THUMB_MAX_LEN) return;
    if (clAvCache[k] === du) return;

  var clThumbQ = Promise.resolve();

  function clThumbMake(src) {
    return new Promise(function(res) {
      var over = false;
      var done = function(v) {
        if (over) return;
        over = true;
        res(v);
      };
      later(function() {
        done(src);
      }, 10000);
      try {
        var im = new T.Image();
        var shrink = function() {
          var w = im.naturalWidth || im.width || 1;
          var h = im.naturalHeight || im.height || 1;
          var sc = Math.min(1, CL_THUMB_MAX / Math.max(w, h));
          if (sc >= 1) return src;
          var cv = D.createElement('canvas');
          cv.width = Math.max(1, Math.round(w * sc));
          cv.height = Math.max(1, Math.round(h * sc));
          cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
          if (canvasBlank(cv)) return null;
          return cv.toDataURL('image/jpeg', 0.8);
        };
        var finish = function(out) {
          try {
            im.onload = null;
            im.src = '';
          } catch (e2) {}
          done(out);
        };
        im.onload = function() {
          imgSettle(im).then(function() {
            var out = null;
            try {
              out = shrink();
            } catch (e) {
              out = src;
            }
            if (out !== null) return finish(out);
            later(function() {
              var again = null;
              try {
                again = shrink();
              } catch (e) {
                again = src;
              }
              finish(again === null ? src : again);
            }, 150);
          });
        };
        im.onerror = function() {
          done('');
        };
        im.src = src;
      } catch (e) {
        done(src);
      }
    });
  }

  function clAvThumb(src) {

    if (src.indexOf('data:') === 0 && src.length < 200000) {
      clThumbs[src] = Promise.resolve(src);
      return clThumbs[src];
    }
    var p = clThumbQ.then(function() {
      return clThumbMake(src);
    });
    clThumbQ = p.then(function() {}, function() {});
    clThumbs[src] = p;
    return p;
  }

  function clParse(txt) {
    var s = String(txt || '').replace(/```[a-z]*/gi, '').trim();
    var a = s.indexOf('{'),
      b = s.lastIndexOf('}');
    if (a >= 0 && b > a) {
      try {
        var o = JSON.parse(s.slice(a, b + 1));
        return {
          tag: String(o.tag || '').trim(),
          lore: String(o.lore || '').trim(),
          copy: String(o.copy || '').trim()
        };
      } catch (e) {}
    }
    var m = s.match(/FOR IMAGES:\s*([\s\S]*?)\s*FOR LOREBOOK:\s*([\s\S]*?)\s*FOR MESSAGE:\s*([\s\S]*)$/i);
    if (!m) throw new Error(L('модель ответила не в том формате'));
    return { tag: m[1].trim(), lore: m[2].trim(), copy: m[3].trim() };
  }

  async function clVision(du, ask) {
    var c = Object.assign({}, panelCfgRaw || {});
    var ep = '',

      model = '';
    if (c.pwChat === false && c.pwEndpoint && c.pwModel) key = await vaultKeyFor('cfg.pw');

    var isG = false;
    try {
      var hn = new(T.URL || URL)(apiBase(ep)).hostname.toLowerCase();
      isG = (hn === 'googleapis.com' || hn.indexOf('.googleapis.com') === hn.length - 15);
    } catch (e) {}
    var mm = String(du).match(/^data:([^;]+);base64,(.*)$/);
    if (!mm) throw new Error(L('фото не в base64'));
    var url, body, hd = { 'Content-Type': 'application/json' };
    if (isG) {
      url = apiBase(ep).replace(/\/v1beta$/i, '') + '/v1beta/models/' + model + ':generateContent';
      hd['x-goog-api-key'] = key;
      body = {
        contents: [{
          role: 'user',
          parts: [{ text: ask }, { inlineData: { mimeType: mm[1], data: mm[2] } }]
        }],
        generationConfig: { temperature: 0.4, maxOutputTokens: 4096 }
      };
    } else {
      var base = apiBase(ep);
      var lb = base.toLowerCase();
      url = lb.indexOf('/chat/completions') >= 0 ? base : (/\/v1(beta)?$/.test(lb) ? base + '/chat/completions' : base + '/v1/chat/completions');
      hd.Authorization = 'Bearer ' + key;
      body = {
        model: model,
        messages: [{
          role: 'user',
          content: [{ type: 'text', text: ask }, { type: 'image_url', image_url: { url: du } }]
        }],
        stream: false,
        max_tokens: 4096,
        temperature: 0.4
      };
    }
    if (!(await vaultHostOk(url, 'cfg.pw'))) throw new Error(L(VAULT_HOST_MSG));
    var resp = await fetch(url, { method: 'POST', headers: hd, body: JSON.stringify(body) });
    if (!resp.ok) {
      var tb = '';
      try {
        tb = await resp.text();
      } catch (e0) {}
      throw new Error(apiHint(resp.status, tb, url));
    }
    var d = await resp.json();
    var out = '';
    if (isG) {
      var parts = (d.candidates && d.candidates[0] && d.candidates[0].content && d.candidates[0].content.parts) || [];
      for (var i = 0; i < parts.length; i++) if (parts[i] && typeof parts[i].text === 'string') out += parts[i].text;

    return out;
  }

  function copyBox(text) {
    var r0 = D.getElementById(ROOT);
    if (!r0) return;
    var old = r0.querySelector('.iig-ask');
    if (old) old.remove();
    var ov = D.createElement('div');
    ov.className = 'iig-ask';
    var box = D.createElement('div');
    box.className = 'iig-askbox';
    var ta = D.createElement('textarea');
    ta.className = 'iig-in iig-copybox';
    ta.readOnly = true;
    ta.value = text;
    var note = D.createElement('div');
    note.className = 'iig-note';
    note.textContent = L('текст ниже можно выделить и скопировать вручную');
    var row = D.createElement('div');
    row.className = 'iig-prow';
    var no = D.createElement('button');
    no.type = 'button';
    no.className = 'iig-btn2 iig-askbtn';
    no.setAttribute('data-ask', 'no');
    no.textContent = L('закрыть');
    var yes = D.createElement('button');
    yes.type = 'button';
    yes.className = 'iig-btn2 iig-askbtn';
    yes.setAttribute('data-ask', 'yes');
    yes.textContent = L('копировать');
    no.addEventListener('click', function() {
      ov.remove();
    });
    yes.addEventListener('click', function() {
      var ok = false;
      try {
        ta.focus();
        ta.select();
        ta.setSelectionRange(0, ta.value.length);
        ok = D.execCommand('copy');
      } catch (e) {}
      try {
        if (T.navigator.clipboard && T.navigator.clipboard.writeText) T.navigator.clipboard.writeText(text).then(function() {
          note.textContent = L('скопировано');
        }, function() {});
      } catch (e2) {}
      note.textContent = ok ? L('скопировано') : L('не удалось скопировать автоматически — выдели текст и скопируй вручную');
    });
    row.appendChild(no);
    row.appendChild(yes);
    box.appendChild(ta);
    box.appendChild(note);
    box.appendChild(row);
    ov.appendChild(box);
    r0.appendChild(ov);
  }

  async function clCopy(text, ta) {
    var done = false;
    try {
      if (T.navigator.clipboard && T.navigator.clipboard.writeText) {
        done = await tmo(T.navigator.clipboard.writeText(text).then(function() {
          return true;
        }, function() {
          return false;
        }), 1500);
      }
    } catch (e) {}
    if (done) return true;
    try {
      var tmp = ta;
      if (!tmp) {
        tmp = D.createElement('textarea');
        tmp.value = text;
        tmp.setAttribute('readonly', '');
        tmp.style.cssText = 'position:absolute;left:-9999px;top:0;opacity:0;';
        D.body.appendChild(tmp);
      }
      tmp.focus();
      tmp.select();
      var ok = D.execCommand('copy');
      if (!ta) tmp.remove();
      return !!ok;
    } catch (e) {}
    return false;
  }

  function makeCloset(C) {
    var wdItems = [];
    var wdOk = false;
    var wdWorn = {};
    var wdWornOk = false;
    var wdSaved = [];
    var wdSavedOk = false;
    var wdBoard = '';
    var wdBoardObj = null;
    var wdPickSel = null;
    var wdCat = '';
    var wdOpen = null;
    var wdSets = [];
    var wdSetsOk = false;
    var wdFind = '';

    function el(id) {
      return D.getElementById(C.pfx + id);
    }

    function wdCatLabel(c) {
      for (var i = 0; i < C.cats.length; i++) if (C.cats[i][0] === c) return C.cats[i][1];
      return C.cats[0][1];
    }

    function wdKey(it) {
      return (it.owner || 'char') + ':' + clNameKey(it.ownerName);
    }

    function wdBoardOf(it) {
      return String(it.board || '') || wdKey(it);
    }

    function wdWho(it) {
      return String(it.ownerName || '').trim() || (it.owner === 'user' ? L('юзер') : (it.owner === 'char' ? L('персонаж') : 'NPC'));
    }

    function wdOwnerOk(it) {
      if (!it || it.owner === 'npc') return true;
      var mine = clNameKey(it.ownerName);
      if (!mine) return true;
      var cur = clNameKey(it.owner === 'user' ? panelUserName : panelCharName);
      return !cur || cur === mine;
    }

    function wdCatOk(c) {
      for (var i = 0; i < C.cats.length; i++) if (C.cats[i][0] === c) return true;
      return false;
    }

    function wdNorm(v) {
      var out = [];
      if (!Array.isArray(v)) return out;
      for (var i = 0; i < v.length; i++) {
        var x = v[i];
        if (!x || x.id == null) continue;
        out.push({
          id: String(x.id),
          board: String(x.board || ''),
          owner: (x.owner === 'user' || x.owner === 'npc') ? x.owner : 'char',
          ownerName: String(x.ownerName || ''),
          cat: wdCatOk(x.cat) ? x.cat : C.defCat,
          name: String(x.name || ''),
          tag: String(x.tag || ''),
          lore: String(x.lore || ''),
          copy: String(x.copy || ''),
          img: String(x.img || ''),
          ref: (x.ref === 'text' || x.ref === 'off') ? x.ref : 'full',
          at: x.at || 0
        });
      }
      return out;
    }

    function wdNormBoards(v) {
      var out = [];
      if (!Array.isArray(v)) return out;
      for (var i = 0; i < v.length; i++) {
        var b = v[i];
        if (!b || !b.key) continue;
        out.push({
          key: String(b.key),
          owner: (b.owner === 'user' || b.owner === 'char') ? b.owner : 'free',
          ownerName: String(b.ownerName || ''),
          refId: b.refId != null ? b.refId : null,
          at: b.at || 0
        });
      }
      return out;
    }

    function wdById(id) {
      for (var i = 0; i < wdItems.length; i++) if (wdItems[i].id === String(id)) return wdItems[i];
      return null;
    }

    async function wdLoad() {
      wdOk = false;
      wdWornOk = false;
      wdSavedOk = false;
      clLb.ok = false;
      try {
        var r = await tmoRes(warmGet(C.kItems), 8000);
        if (r.ok) {
          wdItems = wdNorm(r.v);
          wdOk = true;
        }
      } catch (e) {}
      try {
        var b = await tmoRes(warmGet(C.kBoards), 6000);
        if (b.ok) {
          wdSaved = wdNormBoards(b.v);
          wdSavedOk = true;
        }
      } catch (e) {}
      try {
        var w = await tmoRes(warmGet(C.kWorn), 6000);
        if (w.ok) {
          wdWorn = (w.v && typeof w.v === 'object') ? w.v : {};
          wdWornOk = true;
        }
      } catch (e) {}
      wdSetsOk = false;
      if (C.kSets) {
        try {
          var ss = await tmoRes(warmGet(C.kSets), 6000);
          if (ss.ok) {
            wdSets = (Array.isArray(ss.v) ? ss.v : []).filter(function(x) {
              return x && x.id && x.board && x.name && Array.isArray(x.items);
            }).map(function(x) {
              return { id: String(x.id), board: String(x.board), name: String(x.name), items: x.items.map(String) };
            });
            wdSetsOk = true;
          }
        } catch (e) {}
      }
      try {
        var l = await tmoRes(warmGet('iig_ward_lb'), 6000);
        if (l.ok) {
          clLb.v = (l.v && l.v.id != null) ? l.v : null;
          clLb.ok = true;
        }
      } catch (e) {}
      try {
        var o = await tmoRes(warmGet(CL_OPTS_KEY), 6000);
        if (o.ok && o.v && typeof o.v === 'object') {
          clOpts.lang = o.v.lang === 'en' ? 'en' : 'ru';
          clOpts.gender = (o.v.gender && typeof o.v.gender === 'object') ? o.v.gender : {};
          clOpts.voice = (o.v.voice === '1' || o.v.voice === '3') ? o.v.voice : 'auto';
        }
      } catch (e) {}
      if (activeTab === 'ward') wdRender();
    }

    async function wdLoadLib(kind) {
      if (clLib[kind]) return;
      if (clLibBusy[kind]) return clLibBusy[kind];
      var ns = kind === 'user' ? 'persona' : 'character';
      clLibBusy[kind] = (async function() {
        var out = [];
        try {
          var l = await clListLib(ns);
          for (var i = 0; i < l.length; i++) {
            if (!l[i] || !l[i].name || l[i].id == null) continue;
            out.push({ id: l[i].id, name: String(l[i].name).trim(), avatar: clAvatarOf(l[i]) });
          }
          out.sort(function(a, b) {
            return a.name.localeCompare(b.name);
          });
        } catch (e) {}
        clLib[kind] = out;
        clLibBusy[kind] = null;
        closetRepaintNew();
      })();
      return clLibBusy[kind];
    }

    function wdNewPaint() {
      var kindEl = el('newkind');
      var pick = el('pick');
      var name = el('newname');
      if (!kindEl || !pick || !name) return;
      var kind = kindEl.value || C.defKind;
      if (kind === 'free') {
        pick.classList.add('iig-hidden');
        pick.innerHTML = '';
        name.classList.remove('iig-hidden');
        name.placeholder = L('название доски');
        return;
      }
      var list = clLib[kind];
      if (!list) {
        pick.classList.remove('iig-hidden');
        pick.innerHTML = L('<div class=iig-note>список ') + (kind === 'user' ? L('персон') : L('персонажей')) + L(' грузится…</div>');
        name.classList.add('iig-hidden');
        wdLoadLib(kind);
        return;
      }
      if (!list.length) {
        pick.classList.add('iig-hidden');
        pick.innerHTML = '';
        name.classList.remove('iig-hidden');
        name.placeholder = L('список не прочитался — впиши имя ') + (kind === 'user' ? L('персоны') : L('персонажа'));
        return;
      }
      name.classList.add('iig-hidden');
      pick.classList.remove('iig-hidden');
      pick.innerHTML = '';
      for (var i = 0; i < list.length; i++) {
        (function(e) {
          var k = clTileKey(kind, e.id);
          var t = D.createElement('div');
          t.className = 'iig-wtile' + (wdPickSel && wdPickSel.kind === kind && wdPickSel.id === e.id ? ' on' : '');
          t.setAttribute('data-wd-tile', k);
          var box = D.createElement('div');
          box.className = 'iig-wtpic';
          var im = D.createElement('img');
          im.alt = '';
          var av = e.avatar || clAvs[k] || '';
          if (av) clSetAvCached(im, av, k);
          else if (clAvCache && clAvCache[k]) im.src = clAvCache[k];
          box.appendChild(im);
          t.title = e.name + (list.filter(function(x) {
            return clNameKey(x.name) === clNameKey(e.name);
          }).length > 1 ? (' · #' + e.id) : '');
          t.appendChild(box);
          t.addEventListener('click', function() {
            wdPickSel = { kind: kind, id: e.id, name: e.name };
            var all = pick.querySelectorAll('.iig-wtile');
            for (var j = 0; j < all.length; j++) all[j].classList.toggle('on', all[j] === t);
          });
          pick.appendChild(t);
        })(list[i]);
      }
      if (clAvCache) wdLazyTileAvatars(kind, list);
      else clAvCacheLoad().then(function() {
        wdNewPaint();
      }, function() {
        wdLazyTileAvatars(kind, list);
      });
    }

    function wdLazyTileAvatars(kind, list) {
      var api = tv()[kind === 'user' ? 'persona' : 'character'];
      if (!api || typeof api.get !== 'function') return;
      var cached = 0;
      var todo = list.filter(function(e) {
        var k = clTileKey(kind, e.id);
        if (!e.avatar && clAvCache && clAvCache[k]) cached++;
        return !e.avatar && !(clAvCache && clAvCache[k]) && clAvs[k] === undefined;
      }).slice(0, CL_AV_LAZY_MAX);
      var i = 0;
      var done = 0;
      var again = false;
      var okN = 0;
      var fails = [];
      var report = function() {
        try {
          tv().set('iig_av_diag', { at: Date.now(), pver: PVER, kind: kind, total: list.length, asked: todo.length, ok: okN, cached: cached, fail: fails.slice(0, 20), ua: String((T.navigator || {}).userAgent || '').slice(0, 160) }, 'global').catch(function() {});
        } catch (e) {}
      };
      var finish = function() {
        done++;
        if (done < todo.length) return;
        report();
        if (!again) return;
        later(function() {
          wdLazyTileAvatars(kind, list);
        }, 1500);
      };
      var miss = function(k, e, why) {
        fails.push({ id: e.id, name: String(e.name || '').slice(0, 24), err: String(why || '').slice(0, 60) });
        clAvTries[k] = (clAvTries[k] || 0) + 1;
        if (clAvTries[k] < CL_AV_TRIES) {
          delete clAvs[k];
          again = true;
        }
      };
      var next = function() {
        if (i >= todo.length) return;
        var e = todo[i++];
        var k = clTileKey(kind, e.id);
        clAvs[k] = '';
        Promise.resolve(tmo(api.get(e.id), CL_AV_GET_MS)).then(function(o) {
          var av = clAvatarOf(o);
          if (av) {
            clAvs[k] = av;
            e.avatar = av;
            okN++;
            var im = D.querySelector('#' + C.pfx + 'pick .iig-wtile[data-wd-tile="' + k + '"] img');
            if (im) clSetAvCached(im, av, k, function(why) {
              fails.push({ id: e.id, name: String(e.name || '').slice(0, 24), err: why });
              report();
            });
          } else miss(k, e, o ? L('без аватарки') : L('пустой ответ'));
          finish();
          next();
        }, function(err) {
          miss(k, e, (err && err.message) || err);
          finish();
          next();
        });
      };
      if (!todo.length) {
        report();
        return;
      }
      next();
      next();
    }

    function wdBoards() {
      var seen = {};
      var list = [];
      var add = function(b) {
        if (!b || !b.key) return null;
        if (seen[b.key]) return seen[b.key];
        var x = { key: b.key, owner: b.owner, ownerName: b.ownerName, refId: b.refId != null ? b.refId : null, items: [], worn: 0, cur: false, avatar: '', saved: !!b.saved };
        seen[b.key] = x;
        list.push(x);
        return x;
      };
      for (var i = 0; i < wdSaved.length; i++) add({ key: wdSaved[i].key, owner: wdSaved[i].owner, ownerName: wdSaved[i].ownerName, refId: wdSaved[i].refId, saved: true });
      for (var j = 0; j < wdItems.length; j++) {
        var it = wdItems[j];
        var k = wdBoardOf(it);
        var b = seen[k] || add({ key: k, owner: it.owner === 'npc' ? 'free' : it.owner, ownerName: it.ownerName || (it.owner === 'npc' ? L('без привязки') : ''), refId: null });
        if (!b) continue;
        b.items.push(it);
        if (wdWorn[it.id]) b.worn++;
      }
      for (var m = 0; m < list.length; m++) {
        var x = list[m];
        if (x.refId != null && ((x.owner === 'user' && panelUserId != null) || (x.owner === 'char' && panelCharId != null))) x.cur = (x.owner === 'user') ? x.refId === panelUserId : x.refId === panelCharId;
        else x.cur = (x.owner === 'user' && !!panelUserName && clNameKey(x.ownerName) === clNameKey(panelUserName)) || (x.owner === 'char' && !!panelCharName && clNameKey(x.ownerName) === clNameKey(panelCharName));
        x.avatar = clAvs[x.key] || (x.refId != null && x.owner !== 'free' ? clAvs[clTileKey(x.owner, x.refId)] : '') || (x.cur ? (x.owner === 'user' ? panelAvU : panelAvC) : '') || '';
      }
      var rank = { user: 0, char: 1, free: 2 };
      list.sort(function(a, b2) {
        if (a.cur !== b2.cur) return a.cur ? -1 : 1;
        if (rank[a.owner] !== rank[b2.owner]) return rank[a.owner] - rank[b2.owner];
        return a.ownerName.localeCompare(b2.ownerName);
      });
      return list;
    }

    async function wdSaveBoards() {
      if (!wdSavedOk) throw new Error(L('список досок не прочитался — переоткрой панель'));
      var plain = wdSaved.map(function(b) {
        return { key: b.key, owner: b.owner, ownerName: b.ownerName, refId: b.refId, at: b.at };
      });
      await tv().set(C.kBoards, plain, 'global');
      warmSet(C.kBoards, plain);
    }

    async function wdCreateBoard() {
      if (clBusy) return;
      var kind = el('newkind').value || C.defKind;
      var nameEl = el('newname');
      var name = '';
      var refId = null;
      var list = clLib[kind];
      if (kind !== 'free' && list && list.length) {
        if (!wdPickSel || wdPickSel.kind !== kind) {
          msg(L('тапни по плитке ') + (kind === 'user' ? L('персоны') : L('персонажа')) + L(', чью доску создать'));
          return;
        }
        name = wdPickSel.name;
        refId = wdPickSel.id;
      } else {
        name = (nameEl.value || '').trim();
        if (!name) {
          msg(kind === 'free' ? L('впиши название доски') : L('впиши имя'));
          return;
        }
      }
      var key = kind === 'free' ? ('free:' + clNameKey(name)) : (refId != null ? clTileKey(kind, refId) : (kind + ':' + clNameKey(name)));
      for (var i = 0; i < wdSaved.length; i++) {
        var b0 = wdSaved[i];
        var same = b0.key === key || (refId != null && b0.owner === kind && b0.refId === refId);
        if (!same) continue;
        msg(L('доска «') + b0.ownerName + L('» для этой ') + (kind === 'user' ? L('персоны') : (kind === 'char' ? L('персонажа') : L('доски'))) + L(' уже есть — открываю'));
        wdBoard = b0.key;
        wdBoardObj = null;
        wdRender();
        return;
      }
      clBusy = true;
      try {
        wdSaved.push({ key: key, owner: kind, ownerName: name, refId: refId, at: Date.now() });
        await wdSaveBoards();
        var adopted = 0;
        var legacyKey = kind + ':' + clNameKey(name);
        var legacyTaken = wdSaved.some(function(b) {
          return b.key === legacyKey;
        });
        if (kind !== 'free' && !legacyTaken) {
          for (var j = 0; j < wdItems.length; j++) {
            var it = wdItems[j];
            if (!it.board && wdKey(it) === legacyKey) {
              it.board = key;
              adopted++;
            }
          }
        }
        if (adopted) await wdPersist();
        nameEl.value = '';
        wdPickSel = null;
        msg(L('доска «') + name + L('» создана') + (adopted ? (L(' · подхвачено: ') + adopted) : ''));
        wdBoard = key;
        wdBoardObj = null;
        wdRender();
      } catch (e) {
        msg(L('доска не создалась: ') + ((e && e.message) || e));
      }
      clBusy = false;
    }

    async function wdDeleteBoard() {
      if (clBusy || !wdBoardObj) return;
      var b = wdBoardObj;
      var q = L('Удалить доску «') + b.ownerName + '»' + (b.items.length ? (L(' и всё, что на ней (') + wdPins(b.items.length) + ')') : '') + '?';
      if (!(await askSure(q, L('удалить доску')))) return;
      clBusy = true;
      try {
        var gone = b.items.slice();
        wdItems = wdItems.filter(function(x) {
          return wdBoardOf(x) !== b.key;
        });
        for (var i = 0; i < gone.length; i++) delete wdWorn[gone[i].id];
        wdSaved = wdSaved.filter(function(x) {
          return x.key !== b.key;
        });
        await wdPersist();
        await wdSaveBoards();
        if (wdWornOk) await wdPersistWorn();
        if (C.kSets && wdSetsOk && wdSets.some(function(x) {
          return x.board === b.key;
        })) {
          wdSets = wdSets.filter(function(x) {
            return x.board !== b.key;
          });
          try {
            await wdSaveSets();
          } catch (e4) {}
        }
        try {
          await wdDropEntries(gone.map(function(x) {
            return x.id;
          }));
        } catch (e2) {}
        for (var k = 0; k < gone.length; k++) {
          if (!gone[k].img) continue;
          try {
            await tv().file.delete(gone[k].img);
          } catch (e3) {}
          delete clImgs[gone[k].img];
        }
        msg(L('доска удалена'));
        wdBoard = '';
        wdBoardObj = null;
        wdRender();
      } catch (e) {
        msg(L('доска не удалилась: ') + ((e && e.message) || e));
      }
      clBusy = false;
    }

    function wdChip(text, on, fn) {
      var b = D.createElement('button');
      b.type = 'button';
      b.className = 'iig-chip iig-wchip' + (on ? ' iig-on' : '');
      b.textContent = text;
      b.addEventListener('click', fn);
      return b;
    }

    function wdRender() {
      closetPaint();
    }

    function wdState() {
      return wdOpen ? 'item' : (wdBoard ? 'board' : 'home');
    }

    function wdPaintSelf() {
      var is = el('itemsec');
      var v = el('view');
      if (!is || !v) return;
      var st = wdState();
      is.classList.toggle('iig-hidden', st !== 'board');
      v.classList.toggle('iig-hidden', st !== 'item');
      if (st === 'board') wdRenderItems();
    }

    function wdStarred() {
      var n = 0;
      for (var k in wdWorn) if (wdWorn[k] && wdById(k)) n++;
      return n;
    }

    function wdCover(b) {
      var cov = D.createElement('div');
      cov.className = 'iig-wcover';
      var main = D.createElement('div');
      main.className = 'iig-wcmain';
      var side = D.createElement('div');
      side.className = 'iig-wcside';
      var photos = b.items.filter(function(x) {
        return x.img;
      });
      var mainImg = D.createElement('img');
      mainImg.alt = '';
      if (b.avatar) clSetAv(mainImg, b.avatar);
      else if (photos.length) {
        if (clImgs[photos[0].img]) mainImg.src = clImgs[photos[0].img];
        else mainImg.setAttribute('data-wd-path', photos[0].img);
        photos = photos.slice(1);
      } else {
        main.classList.add('iig-wcempty');
        main.textContent = C.place ? L('локации') : clKindLabel(b.owner);
        mainImg = null;
      }
      if (mainImg) main.appendChild(mainImg);
      for (var i = 0; i < 2; i++) {
        var cell = D.createElement('div');
        cell.className = 'iig-wccell';
        if (photos[i]) {
          var im = D.createElement('img');
          im.alt = '';
          if (clImgs[photos[i].img]) im.src = clImgs[photos[i].img];
          else im.setAttribute('data-wd-path', photos[i].img);
          cell.appendChild(im);
        }
        side.appendChild(cell);
      }
      cov.appendChild(main);
      cov.appendChild(side);
      return cov;
    }

    function wdBoardList() {
      return { ok: wdOk && wdSavedOk, list: wdBoards() };
    }

    function wdLazy(grid, boards) {
      wdLazyImgs(grid);
      wdLazyAvatars(boards);
    }

    function wdBoardCard(b) {
      var card = D.createElement('div');
      card.className = 'iig-wboard' + (b.cur ? ' cur' : '');
      card.appendChild(wdCover(b));
      var t = D.createElement('div');
      t.className = 'iig-wbtitle';
      t.textContent = b.ownerName;
      var sub = D.createElement('div');
      sub.className = 'iig-wbsub';
      sub.textContent = wdPins(b.items.length) + (b.worn ? (' · ★ ' + b.worn) : '') + ' · ' + clKindLabel(b.owner) + (b.cur ? L(' · в этом чате') : '');
      card.appendChild(t);
      card.appendChild(sub);
      card.addEventListener('click', function() {
        wdBoard = b.key;
        wdBoardObj = b;
        wdCat = '';
        wdFind = '';
        el('find').value = '';
        wdRender();
      });
      return card;
    }

    function wdPins(n) {
      var m = n % 10, h = n % 100;
      var w = (m === 1 && h !== 11) ? C.plural[0] : ((m >= 2 && m <= 4 && (h < 12 || h > 14)) ? C.plural[1] : C.plural[2]);
      return n + ' ' + w;
    }

    async function wdRefIdByName(b) {
      var kind = b.owner === 'user' ? 'user' : 'char';
      if (!clLib[kind]) await wdLoadLib(kind);
      var list = clLib[kind] || [];
      for (var i = 0; i < list.length; i++) {
        if (clNameKey(list[i].name) !== clNameKey(b.ownerName)) continue;
        for (var j = 0; j < wdSaved.length; j++) if (wdSaved[j].key === b.key) wdSaved[j].refId = list[i].id;
        try {
          await wdSaveBoards();
        } catch (e) {}
        return list[i];
      }
      return null;
    }

    function wdLazyAvatars(boards) {
      var todo = boards.filter(function(b) {
        return !b.avatar && b.owner !== 'free' && clAvs[b.key] === undefined;
      }).slice(0, 40);
      var i = 0;
      var next = function() {
        if (i >= todo.length) return;
        var b = todo[i++];
        var api = tv()[b.owner === 'user' ? 'persona' : 'character'];
        if (!api || typeof api.get !== 'function') {
          next();
          return;
        }
        clAvs[b.key] = '';
        var got = function(av) {
          if (av) {
            clAvs[b.key] = av;
            closetRepaintBoards();
          }
          next();
        };
        var pr = (b.refId != null) ? Promise.resolve({ id: b.refId }) : wdRefIdByName(b);
        Promise.resolve(pr).then(function(hit) {
          if (!hit) {
            delete clAvs[b.key];
            got('');
            return;
          }
          if (hit.avatar) {
            got(String(hit.avatar));
            return;
          }
          return Promise.resolve(tmo(api.get(hit.id), 6000)).then(function(o) {
            got(clAvatarOf(o));
          }, function() {
            got('');
          });
        }, function() {
          got('');
        });
      };
      next();
    }

    function wdRenderItems() {
      var cats = el('cats');
      var grid = el('grid');
      var note = el('note');
      var title = el('btitle');
      if (!cats || !grid) return;
      var b = wdBoardObj;
      if (!b || b.key !== wdBoard) {
        var all = wdBoards();
        b = null;
        for (var q = 0; q < all.length; q++) if (all[q].key === wdBoard) b = all[q];
        if (!b) {
          wdBoard = '';
          wdRender();
          return;
        }
        wdBoardObj = b;
      }
      if (title) title.textContent = b.ownerName + ' · ' + clKindLabel(b.owner) + (b.cur ? L(' · в этом чате') : '');
      cats.innerHTML = '';
      cats.appendChild(wdChip(L('всё'), wdCat === '', function() {
        wdCat = '';
        wdRender();
      }));
      for (var c = 0; c < C.cats.length; c++) {
        (function(cc) {
          cats.appendChild(wdChip(cc[1], wdCat === cc[0], function() {
            wdCat = (wdCat === cc[0]) ? '' : cc[0];
            wdRender();
          }));
        })(C.cats[c]);
      }
      grid.innerHTML = '';
      var shown = 0;
      var wornN = 0;
      for (var j = 0; j < wdItems.length; j++) {
        var it = wdItems[j];
        if (wdBoardOf(it) !== wdBoard) continue;
        if (wdWorn[it.id]) wornN++;
        if (wdCat && it.cat !== wdCat) continue;
        if (!wdMatch(it, wdFind)) continue;
        grid.appendChild(wdCard(it));
        shown++;
      }
      if (note) {
        if (!wdOk) note.textContent = L('доски ещё грузятся из хранилища — подожди, прежде чем добавлять');
        else if (!shown) note.textContent = wdFind ? L('по этому запросу на доске ничего нет') : C.t.empty;
        else note.textContent = C.t.plGen + ': ' + shown + L(' · со звёздочкой: ') + wornN + (b.cur || b.owner === 'free' ? '' : L(' · рефы отсюда едут в чат с ') + b.ownerName) + ' · ' + C.t.tapHint;
      }
      wdLazyImgs(grid);
      wdSetsPaint();
    }

    function wdLazyImgs(grid) {
      var imgs = grid.querySelectorAll('img[data-wd-path]');
      var i = 0;
      var next = function() {
        if (i >= imgs.length) return;
        var im = imgs[i++];
        var p = im.getAttribute('data-wd-path');
        clImg(p).then(function(du) {
          im.src = du;
          next();
        }, function() {
          im.parentElement.classList.add('iig-wbroken');
          next();
        });
      };
      next();
      next();
    }

    function wdStar(it) {
      var st = D.createElement('button');
      st.type = 'button';
      st.className = 'iig-wstar' + (wdWorn[it.id] ? ' on' : '');
      st.textContent = wdWorn[it.id] ? '★' : '☆';
      st.title = wdWorn[it.id] ? C.t.starOn : C.t.starOff;
      st.addEventListener('click', function(e) {
        e.stopPropagation();
        wdWear(it, !wdWorn[it.id]);
      });
      return st;
    }

    function wdCard(it) {
      var card = D.createElement('div');
      card.className = 'iig-wcard' + (wdWorn[it.id] ? ' on' : '');
      var pic = D.createElement('div');
      pic.className = 'iig-wpic';
      if (it.img) {
        var im = D.createElement('img');
        im.alt = it.name || '';
        if (clImgs[it.img]) im.src = clImgs[it.img];
        else im.setAttribute('data-wd-path', it.img);
        pic.appendChild(im);
      } else {
        pic.classList.add('iig-wnoimg');
        pic.textContent = it.name || it.tag || wdCatLabel(it.cat);
      }
      card.appendChild(pic);
      var row = D.createElement('div');
      row.className = 'iig-wrow';
      var cap = D.createElement('div');
      cap.className = 'iig-wcap';
      cap.textContent = (it.name || it.tag || wdCatLabel(it.cat)) + (it.ref === 'text' ? L(' · текст') : (it.ref === 'off' ? L(' · не реф') : ''));
      row.appendChild(cap);
      row.appendChild(wdStar(it));
      card.appendChild(row);
      card.addEventListener('click', function() {
        if (wdBoard !== wdBoardOf(it)) {
          wdBoard = wdBoardOf(it);
          wdBoardObj = null;
          wdFind = '';
        }
        wdShow(it);
      });
      return card;
    }

    function wdFormRead() {
      var it = wdOpen;
      if (!it) return null;
      it.name = (el('name').value || '').trim();
      if (!C.place) {
        it.owner = el('owner').value || 'char';
        it.ownerName = (el('oname').value || '').trim();
      }
      it.cat = el('cat').value || C.defCat;
      it.tag = (el('tag').value || '').trim();
      it.lore = (el('lore').value || '').trim();
      it.copy = (el('copy').value || '').trim();
      var rm = el('refmode') ? el('refmode').value : '';
      it.ref = (rm === 'text' || rm === 'off') ? rm : 'full';
      return it;
    }

    function wdOwnerNameFor(owner) {
      if (owner === 'user') return panelUserName || '';
      if (owner === 'char') return panelCharName || '';
      return '';
    }

    function wdShow(it) {
      wdOpen = it;
      var v = el('view');
      if (!v) return;
      closetPaint();
      el('name').value = it.name || '';
      if (!C.place) {
        el('owner').value = it.owner || 'char';
        el('oname').value = it.ownerName || '';
        el('gender').value = clOpts.gender[wdBoardOf(it)] || 'auto';
        el('voice').value = clOpts.voice || 'auto';
      }
      el('lang').value = clOpts.lang;
      el('hint').value = '';
      el('ghint').textContent = '';
      el('cat').value = it.cat || C.defCat;
      el('tag').value = it.tag || '';
      el('lore').value = it.lore || '';
      el('copy').value = it.copy || '';
      el('refmode').value = (it.ref === 'text' || it.ref === 'off') ? it.ref : 'full';
      el('err').textContent = '';
      wdMovePaint(it);
      wdCopyPaint(it);
      wdWornPaint();
      var im = el('img');
      im.src = '';
      im.style.display = it.img ? '' : 'none';
      el('imghint').textContent = it.img ? '' : L('тап — добавить фото');
      wdImgDelPaint();
      if (it.img) clImg(it.img).then(function(du) {
        if (wdOpen === it) im.src = du;
      }, function() {
        if (wdOpen === it) el('err').textContent = C.t.photoOf + L(' не прочиталось из файлов — добавь заново');
      });
      try {
        v.scrollIntoView({ block: 'start' });
      } catch (e) {}
    }

    function wdImgDelPaint() {
      var b = el('imgdel');
      if (!b) return;
      b.classList.toggle('iig-hidden', !(wdOpen && wdOpen.img));
    }

    async function wdImgDel() {
      var it = wdOpen;
      if (!it || !it.img) return wdImgDelPaint();
      var old = it.img;
      it.img = '';
      try {
        await wdPersist();
      } catch (e) {
        it.img = old;
        wdImgDelPaint();
        msg(L('фото не убралось: ') + ((e && e.message) || e));
        return;
      }
      try {
        await tv().file.delete(old);
      } catch (e1) {}
      if (wdOpen === it) {
        var im = el('img');
        if (im) {
          im.src = '';
          im.style.display = 'none';
        }
        var hint = el('imghint');
        if (hint) hint.textContent = L('тап — добавить фото');
      }
      wdImgDelPaint();
      msg(C.t.photoOf + L(' убрано'));
    }

    function wdWornPaint() {
      var b = el('worn');
      if (!b || !wdOpen) return;
      var on = !!wdWorn[wdOpen.id];
      b.classList.toggle('iig-on', on);
      b.textContent = on ? C.t.wornOn : C.t.wornOff;
      var hint = el('wornhint');
      if (hint) hint.textContent = (on && !wdOwnerOk(wdOpen)) ? (L('в этом чате не ') + wdOpen.ownerName + L(' — реф на картинки поедет в чате с ') + wdOpen.ownerName) : '';
    }

    function wdHide() {
      wdOpen = null;
      wdRender();
    }

    async function wdPersist() {
      if (!wdOk) throw new Error(L('доски не прочитались из хранилища — переоткрой панель, чтобы ничего не затереть'));
      var plain = wdItems.map(function(x) {
        return { id: x.id, board: x.board, owner: x.owner, ownerName: x.ownerName, cat: x.cat, name: x.name, tag: x.tag, lore: x.lore, copy: x.copy, img: x.img, at: x.at };
      });
      for (var pi = 0; pi < plain.length; pi++) {
        var rf = wdItems[pi].ref;
        plain[pi].ref = (rf === 'text' || rf === 'off') ? rf : 'full';
      }
      await tv().set(C.kItems, plain, 'global');
      warmSet(C.kItems, plain);
      try {
        await tv().set('iig_refs_rev', Date.now(), 'global');
      } catch (e) {}
    }

    async function wdPersistWorn(uid, uoff, offIds) {
      if (!wdWornOk) throw new Error(L('список звёздочек не прочитался — переоткрой панель'));
      var w = {};
      for (var k in wdWorn) if (wdWorn[k] && wdById(k)) w[k] = 1;
      wdWorn = w;
      await tv().set(C.kWorn, w, 'global');
      warmSet(C.kWorn, w);
      await wdUnwornSync(uid, uoff, offIds);
      try {
        await tv().set('iig_refs_rev', Date.now(), 'global');
      } catch (e) {}
    }

    async function wdUnwornSync(uid, uoff, offIds) {
      if (C.kWorn !== 'iig_ward_worn' || !wdOk) return;
      var u = null;
      try {
        u = await tv().get('iig_ward_unworn', 'global');
      } catch (e) {
        msg(L('память снятой звёздочки не записалась: ') + ((e && e.message) || e));
        return;
      }
      if (!u || typeof u !== 'object' || Array.isArray(u)) u = {};
      var out = {};
      for (var k in u) if (u[k] && wdById(k) && !wdWorn[k]) out[k] = u[k];
      if (uid != null) {
        if (uoff && !wdWorn[String(uid)]) out[String(uid)] = Date.now();
        else delete out[String(uid)];
      }
      for (var oi = 0; oi < (offIds || []).length; oi++) {
        var oid = String(offIds[oi]);
        if (!wdWorn[oid] && wdById(oid)) out[oid] = Date.now();
      }
      try {
        await tv().set('iig_ward_unworn', out, 'global');
      } catch (e) {
        msg(L('память снятой звёздочки не записалась: ') + ((e && e.message) || e));
      }
    }

    function wdEntry(it) {
      var who = C.place ? '' : wdWho(it);
      var label = it.name || wdCatLabel(it.cat);
      var body = String(it.lore || '').trim() || (C.place ? (L('Место действия: ') + (it.name || it.tag || label)) : (who + L(' сейчас: ') + (it.name || it.tag || label)));
      return {
        identifier: C.entPfx + it.id,
        name: C.entName + ' · ' + (C.place ? '' : (who + ' · ')) + label,
        content: body,
        enabled: !!wdWorn[it.id],
        strategy: 'constant',
        keywords: [],
        secondaryKeywords: [],
        secondaryKeywordStrategy: 'none',
        scanDepth: 4,
        caseSensitive: false,
        matchWholeWord: false,
        injectionPosition: 'atDepth',
        injectionDepth: 2,
        injectionRole: 'system',
        probability: 100,
        sticky: 0,
        cooldown: 0,
        delay: 0
      };
    }

    async function wdBindChat(lb) {
      var ch = await tmo(tv().chat.current(), 4000);
      if (!ch || ch.id == null) return;
      var have = [];
      var src = Array.isArray(ch.lorebookIds) ? ch.lorebookIds : (ch.lorebooks || []).map(function(x) {
        return x && x.id;
      });
      for (var i = 0; i < src.length; i++) if (src[i] != null && have.indexOf(src[i]) < 0) have.push(src[i]);
      if (have.indexOf(lb.id) >= 0) return;
      var want = have.concat([lb.id]);
      var pid = (ch.persona && ch.persona.id != null) ? ch.persona.id : (ch.personaId != null ? ch.personaId : null);
      var patch = function(p) {
        if (pid != null) p.personaId = pid;
        return p;
      };
      var liveHas = async function() {
        var now = await tmo(tv().chat.current(), 4000);
        if (!now || now.id !== ch.id) return true;
        var cur = Array.isArray(now.lorebookIds) ? now.lorebookIds : (now.lorebooks || []).map(function(x) {
          return x && x.id != null ? x.id : x;
        });
        return cur.indexOf(lb.id) >= 0;
      };
      await tv().chat.update(patch({ lorebookIds: want }));
      if (await liveHas()) return;
      await tv().chat.update(patch({ lorebooks: want }));
      if (!(await liveHas())) throw new Error(L('чат не принял привязку лорбука (ни lorebookIds, ни lorebooks)'));
    }

    async function wdBook(create) {
      var lb = null;
      if (clLb.v && clLb.v.id != null) {
        try {
          lb = await tv().lorebook.get(clLb.v.id);
        } catch (e) {
          lb = null;
        }
      }
      if (!lb) {
        if (!create) return null;
        try {
          var f = await tv().lorebook.find(WD_LB_NAME, { match: 'exact' });
          if (!f || !f[0]) f = await tv().lorebook.find(WD_LB_OLD, { match: 'exact' });
          if (f && f[0] && f[0].id != null) lb = await tv().lorebook.get(f[0].id);
        } catch (e) {}
        if (!lb) {
          var id = await tv().lorebook.create({ name: WD_LB_NAME, entries: [] });
          lb = await tv().lorebook.get(id);
        }
        if (!lb) throw new Error(L('лорбук картинок не создался'));
        clLb.v = { id: lb.id, name: lb.name };
        await tv().set('iig_ward_lb', clLb.v, 'global');
        warmSet('iig_ward_lb', clLb.v);
        clLb.ok = true;
      }
      try {
        await wdBindChat(lb);
      } catch (e) {}
      return lb;
    }

    async function wdSyncStarred(lb) {
      var items = wdItems.filter(function(x) {
        return wdWorn[x.id];
      });
      if (!items.length) return 0;
      await wdSyncEntries(items, lb);
      return items.length;
    }

    async function wdSyncEntries(items, lb) {
      lb = lb || (await wdBook(false));
      if (!lb) return false;
      var ids = {};
      for (var i = 0; i < items.length; i++) ids[C.entPfx + items[i].id] = 1;
      var keep = (lb.entries || []).filter(function(x) {
        return !(x && ids[String(x.identifier || '')]);
      });
      var mine = items.map(wdEntry);
      lb.entries = keep.concat(mine);
      var renamed = clBookRename(lb);
      await tv().lorebook.update(lb);
      if (renamed) await clBookRemember(lb);
      return true;
    }

    async function wdDropEntries(itemIds) {
      var lb = await wdBook(false);
      if (!lb) return;
      var ids = {};
      for (var i = 0; i < itemIds.length; i++) ids[C.entPfx + itemIds[i]] = 1;
      lb.entries = (lb.entries || []).filter(function(x) {
        return !(x && ids[String(x.identifier || '')]);
      });
      await tv().lorebook.update(lb);
    }

    async function wdExportBoard() {
      if (clBusy || !wdBoardObj) return;
      clBusy = true;
      try {
        var items = wdItems.filter(function(x) {
          return wdBoardOf(x) === wdBoard;
        });
        if (!items.length) throw new Error(L('доска пуста'));
        msg(L('выгружаю доску в лорбук — подтверди «Allow», если приложение спросит…'));
        var lb = await wdBook(true);
        await wdSyncEntries(items, lb);
        var on = items.filter(function(x) {
          return wdWorn[x.id];
        }).length;
        msg(L('в лорбук «') + lb.name + L('» выгружено записей: ') + items.length + L(' · включены только со звёздочкой: ') + on);
        closetRepaintLb();
      } catch (e) {
        msg(L('не выгрузилось: ') + ((e && e.message) || e));
      }
      clBusy = false;
    }

    async function wdWear(it, on) {
      if (clBusy) return;
      clBusy = true;
      try {
        var rivals = [];
        if (on) wdWorn[it.id] = 1;
        else delete wdWorn[it.id];
        for (var rj = 0; rj < rivals.length; rj++) delete wdWorn[rivals[rj].id];
        if (wdOpen === it) wdWornPaint();
        await wdPersistWorn(it.id, !on, rivals.map(function(x) {
          return x.id;
        }));
        var lb = await wdBook(false);
        var label = it.name || wdCatLabel(it.cat);
        if (lb) {
          msg(on ? L('включаю запись в лорбуке — подтверди «Allow», если приложение спросит…') : L('выключаю запись в лорбуке…'));
          await wdSyncEntries([it].concat(rivals), lb);
          msg(on ? (C.t.wornOn + L(': реф на картинки и запись «') + label + L('» в лорбуке включена')) : (C.t.offMsg + L(': реф убран, запись в лорбуке выключена')));
        } else {
          msg(on ? (C.t.wornOn + L(': реф на картинки идёт; лорбук картинок не создан, поэтому записи в историю нет — кнопка «создать лорбук картинок» на досках')) : C.t.offMsg);
        }
        if (on && !wdOwnerOk(it)) msg(C.t.wornOn + L(', но в этом чате не ') + it.ownerName + L(': реф на картинки поедет в чате с ') + it.ownerName);
      } catch (e) {
        msg(L('не вышло: ') + ((e && e.message) || e));
      }
      clBusy = false;
      if (wdOpen === it) wdWornPaint();
      else wdRender();
    }

    async function wdSaveImg(id, du) {
      var path = await tv().file.save(C.filePfx + id + '.jpg', du, { scope: 'global' });
      if (!path) throw new Error(L('файл не записался'));
      clImgs[String(path)] = du;
      return String(path);
    }

    function wdMatch(it, q) {
      if (!q) return true;
      return [it.name, it.tag, it.lore, it.copy, it.ownerName].join('\n').toLowerCase().indexOf(q) >= 0;
    }

    function wdFindCards(q) {
      var out = [];
      for (var i = 0; i < wdItems.length; i++) if (wdMatch(wdItems[i], q)) out.push(wdCard(wdItems[i]));
      return out;
    }

    function wdBoardByKey(key) {
      var all = wdBoards();
      for (var i = 0; i < all.length; i++) if (all[i].key === key) return all[i];
      return null;
    }

    async function wdMake(b, du, seed) {
      var it = {
        id: String(Date.now().toString(36)) + Math.random().toString(36).slice(2, 6),
        board: b.key,
        owner: b.owner === 'free' ? 'npc' : b.owner,
        ownerName: b.owner === 'free' ? '' : b.ownerName,
        cat: (seed && wdCatOk(seed.cat)) ? seed.cat : C.defCat,
        name: String((seed && seed.name) || ''),
        tag: String((seed && seed.tag) || ''),
        lore: String((seed && seed.lore) || ''),
        copy: '',
        img: '',
        at: Date.now()
      };
      if (du) it.img = await wdSaveImg(it.id, du);
      wdItems.unshift(it);
      await wdPersist();

    }

    async function wdSetImg(id, du) {
      if (!wdOk) throw new Error(L('доски ещё не прочитались — подожди и попробуй снова'));
      var it = null;
      for (var i = 0; i < wdItems.length; i++) if (wdItems[i].id === id) it = wdItems[i];
      if (!it) throw new Error(L('такой карточки на доске уже нет'));
      it.img = await wdSaveImg(it.id, du);
      it.at = Date.now();
      await wdPersist();
      if (wdOpen && wdOpen.id === it.id) {
        wdOpen.img = it.img;
        var im = el('img');
        if (im) {
          im.src = du;
          im.style.display = '';
        }
        var hint = el('imghint');
        if (hint) hint.textContent = '';
        wdImgDelPaint();
      } else if (wdBoard) wdRenderItems();
      return it;
    }

    var plScanT = null;

    function plScanStop() {
      if (plScanT) clearInterval(plScanT);
      plScanT = null;
    }

    async function wdPlaceScan() {
      if (!wdOk || !wdBoard || !wdBoardObj) {
        msg(L('сначала открой доску локаций'));
        return;
      }
      if (plScanT) {
        msg(L('поиск локаций уже идёт'));
        return;
      }
      var board = wdBoardObj;
      var have = [];
      for (var i = 0; i < wdItems.length; i++) if (wdItems[i].board === board.key && wdItems[i].name) have.push(wdItems[i].name);
      var sid = 'pl' + Date.now().toString(36);
      await sendCmd('placescan', { sid: sid, have: have });
      msg(L('ищу локации в карточке персонажа и лорбуках чата…'));
      var started = Date.now();
      plScanT = regT(setInterval(async function() {
        var st = null;
        try {
          st = await tmo(tv().get('iig_place_scan', 'chat'), 3000);
        } catch (e) {}
        if (!st || st.sid !== sid) {
          if (Date.now() - started > 240000) {
            plScanStop();
            msg(L('движок не ответил за 4 минуты — посмотри «ошибки плагина» на главной'));
          }
          return;
        }
        if (st.state === 'error') {
          plScanStop();
          msg(L('поиск локаций не вышел: ') + (st.error || L('сбой')));
          return;
        }
        if (st.state !== 'ok') return;
        plScanStop();
        var places = Array.isArray(st.places) ? st.places : [];
        var names = [];
        if (clBusy) {
          msg(L('доски заняты прошлой операцией — нажми «найти локации» ещё раз'));
          return;
        }
        clBusy = true;
        try {
          var seen = {};
          for (var k = 0; k < wdItems.length; k++) if (wdItems[k].board === board.key) seen[clNameKey(wdItems[k].name)] = 1;
          for (var j = 0; j < places.length; j++) {
            var nm = String((places[j] && places[j].name) || '').trim().slice(0, 40);
            var key = clNameKey(nm);
            if (!key || seen[key]) continue;
            seen[key] = 1;
            await wdMake(board, '', { cat: 'place', name: nm, lore: String(places[j].desc || '').trim().slice(0, 1200) });
            names.push(nm);
          }
        } catch (e) {
          msg(L('локации не легли на доску: ') + ((e && e.message) || e));
          clBusy = false;
          return;
        }
        clBusy = false;
        if (wdBoard === board.key) wdRenderItems();
        msg(names.length ? (L('найдено локаций: ') + names.join(', ') + L(' — открой каждую: добавь своё фото тапом по плитке или нажми «нарисовать по описанию»')) : (L('новых локаций в лорбуке не нашлось') + (Array.isArray(st.src) && st.src.length ? (L(' · смотрел: ') + st.src.join(', ')) : '') + (st.raw ? (L(' · ответ модели: ') + String(st.raw).slice(0, 160)) : '')));
      }, 1500));
    }

    async function wdRenameBoard() {
      if (clBusy || !wdBoardObj) return;
      var b = wdBoardObj;
      if (b.owner !== 'free') {
        msg(L('доска ') + (b.owner === 'user' ? L('персоны') : L('персонажа')) + L(' зовётся по имени «') + b.ownerName + L('» — по нему она находит свой чат; переименовать можно только свою доску'));
        return;
      }
      var name = await askText(L('Новое название доски'), b.ownerName, L('переименовать'));
      if (name == null) return;
      name = name.slice(0, 60);
      if (!name || name === b.ownerName) return;
      clBusy = true;
      try {
        var saved = null;
        for (var i = 0; i < wdSaved.length; i++) if (wdSaved[i].key === b.key) saved = wdSaved[i];
        if (!saved) {
          saved = { key: b.key, owner: b.owner, ownerName: name, refId: null, at: Date.now() };
          wdSaved.push(saved);
        }
        saved.ownerName = name;
        var touched = 0;
        for (var j = 0; j < wdItems.length; j++) {
          var it = wdItems[j];
          if (wdBoardOf(it) !== b.key) continue;
          if (!it.board) {
            it.board = b.key;
            touched++;
          }
        }
        await wdSaveBoards();
        if (touched) await wdPersist();
        wdBoardObj = null;
        wdRender();
        msg(L('доска переименована: «') + name + '»');
      } catch (e) {
        msg(L('не переименовалась: ') + ((e && e.message) || e));
      }
      clBusy = false;
    }

    function wdBoardWorn() {
      var out = [];
      for (var i = 0; i < wdItems.length; i++) if (wdWorn[wdItems[i].id] && wdBoardOf(wdItems[i]) === wdBoard) out.push(wdItems[i].id);
      return out;
    }

    function wdSetLive(s) {
      return s.items.filter(function(id) {
        var it = wdById(id);
        return !!it && wdBoardOf(it) === s.board;
      });

    async function wdSaveSets() {
      if (!wdSetsOk) throw new Error(L('образы не прочитались из хранилища — переоткрой панель'));
      var plain = wdSets.map(function(s) {
        return { id: s.id, board: s.board, name: s.name, items: s.items.slice() };
      });
      await tv().set(C.kSets, plain, 'global');
      warmSet(C.kSets, plain);
    }

    function wdSetsPaint() {
      var host = el('sets');
      var note = el('setnote');
      if (!host) return;
      host.innerHTML = '';
      var worn = wdBoardWorn();
      var n = 0;
      for (var i = 0; i < wdSets.length; i++) {
        (function(s) {
          if (s.board !== wdBoard) return;
          n++;
          var live = wdSetLive(s);
          var on = live.length > 0 && live.length === worn.length && live.every(function(id) {
            return worn.indexOf(id) >= 0;
          });
          var wrap = D.createElement('span');
          wrap.className = 'iig-setw';
          wrap.setAttribute('data-set', s.id);
          wrap.appendChild(wdChip(s.name + ' · ' + live.length, on, function() {
            wdWearSet(s);
          }));
          var x = wdChip('×', false, function() {
            wdSetDelete(s);
          });
          x.title = L('удалить образ');
          x.classList.add('iig-setx');
          wrap.appendChild(x);
          host.appendChild(wrap);
        })(wdSets[i]);
      }
      if (note) {
        if (!wdSetsOk) note.textContent = L('образы ещё грузятся из хранилища');
        else if (n) note.textContent = L('тап по образу — надеть его целиком: его вещи получают звёздочку, остальные на этой доске её теряют');
        else note.textContent = L('образов пока нет: поставь звёздочки нужным вещам, впиши название и нажми «сохранить образ»');
      }
    }

    async function wdSetAdd() {
      if (clBusy) return;
      var inp = el('setname');
      var name = (inp.value || '').trim();
      var ids = wdBoardWorn();
      if (!name) {
        msg(L('впиши название образа'));
        return;
      }
      if (!ids.length) {
        msg(L('на этой доске нет вещей со звёздочкой — отметь, что входит в образ'));
        return;
      }
      clBusy = true;
      try {
        var hit = null;
        for (var i = 0; i < wdSets.length; i++) if (wdSets[i].board === wdBoard && clNameKey(wdSets[i].name) === clNameKey(name)) hit = wdSets[i];
        if (hit) hit.items = ids;
        else wdSets.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 5), board: wdBoard, name: name, items: ids });
        await wdSaveSets();
        inp.value = '';
        msg(L('образ «') + name + '» ' + (hit ? L('обновлён') : L('сохранён')) + L(' · вещей: ') + ids.length);
      } catch (e) {
        msg(L('образ не сохранился: ') + ((e && e.message) || e));
      }
      clBusy = false;
      wdSetsPaint();
    }

    async function wdSetDelete(s) {
      if (clBusy) return;
      if (!(await askSure(L('Удалить образ «') + s.name + L('»? Вещи останутся на доске.'), L('удалить')))) return;
      clBusy = true;
      try {
        wdSets = wdSets.filter(function(x) {
          return x.id !== s.id;
        });
        await wdSaveSets();
        msg(L('образ удалён'));
      } catch (e) {
        msg(L('образ не удалился: ') + ((e && e.message) || e));
      }
      clBusy = false;
      wdSetsPaint();
    }

    async function wdWearSet(s) {
      if (clBusy) return;
      clBusy = true;
      try {
        var live = wdSetLive(s);
        var changed = [];
        for (var i = 0; i < wdItems.length; i++) {
          var it = wdItems[i];
          if (wdBoardOf(it) !== s.board) continue;
          var want = live.indexOf(it.id) >= 0;
          if (!!wdWorn[it.id] === want) continue;
          if (want) wdWorn[it.id] = 1;
          else delete wdWorn[it.id];
          changed.push(it);
        }
        if (!changed.length) msg(L('образ «') + s.name + L('» уже надет'));
        else {
          await wdPersistWorn();
          var lb = await wdBook(false);
          if (lb) {
            msg(L('переключаю записи в лорбуке — подтверди «Allow», если приложение спросит…'));
            await wdSyncEntries(changed, lb);
          }
          msg(L('образ «') + s.name + L('» надет · звёздочек изменено: ') + changed.length);
        }
      } catch (e) {
        msg(L('образ не наделся: ') + ((e && e.message) || e));
      }
      clBusy = false;
      wdBoardObj = null;
      wdRender();
    }

    async function wdNewItem(du) {
      if (clBusy) return;
      clBusy = true;
      try {

        wdShow(it);
      } catch (e) {
        msg(L('не удалось добавить: ') + ((e && e.message) || e));
      }
      clBusy = false;
    }

      if (!wdOpen) return;
      var it = wdFormRead();

      try {

        cat: it.cat,
        lang: el('lang').value === 'en' ? 'en' : 'ru',

        msg(L('описать не вышло: ') + ((e && e.message) || e));
      }

    async function wdAskCopy() {
      if (!wdOpen) return;
      var it = wdFormRead();
      var text = clAsk(await wdAskOpts(it, false));

      try {
        var cur = '';
        try {
          cur = String((await tmo(tv().input.get(), 3000)) || '');

  function worldMapAsk(b) {
    var seen = {};
    var places = [];
    var items = (b && b.items) || [];
    for (var i = 0; i < items.length; i++) {
      var n = String(items[i].name || '').trim();
      if (!n || seen[n.toLowerCase()]) continue;
      seen[n.toLowerCase()] = 1;
      places.push(n);
    }
    if (places.length < 2) {
      msg(L('для карты мира нужны хотя бы две локации с названиями на этой доске'));
      return;
    }
    try {
      T.dispatchEvent(new CustomEvent('iig-make', { detail: { kind: 'map', places: places, board: b.key, title: b.ownerName } }));
      msg(L('карта мира доски «') + b.ownerName + L('» заказана по локациям: ') + places.length + L(' — готовая появится в студии и в «Памяти»'));
    } catch (e) {
      msg(L('карту заказать не вышло: ') + ((e && e.message) || e));
    }
  }

  function closetFilterPaint() {
    var host = D.getElementById('iig_cl_filter');

  function closetBoardsPaint() {
    var grid = D.getElementById('iig_wd_boards');
    var note = D.getElementById('iig_wd_bnote');
    if (!grid) return;
    closetFilterPaint();
    grid.innerHTML = '';
    var ready = true;
    var total = 0;
    var first = [];
    var rest = [];
    var lists = [];
    for (var i = 0; i < CLOSETS.length; i++) {
      var c = CLOSETS[i];
      var r = c.boards();
      if (!r.ok) ready = false;
      total += r.list.length;
      lists.push(r.list);
      if (clFilter && clFilter !== c.conf.kind) continue;
      for (var j = 0; j < r.list.length; j++) {
        if (clSearch && !clBoardHit(r.list[j], clSearch)) continue;
        (r.list[j].cur ? first : rest).push([c, r.list[j]]);
      }
    }
    var all = first.concat(rest);
    for (var k = 0; k < all.length; k++) grid.appendChild(all[k][0].card(all[k][1]));
    if (note) {
      if (!ready) note.textContent = L('доски ещё грузятся из хранилища — подожди');
      else if (!total) note.textContent = L('досок пока нет: выбери тип доски и владельца (или назови свою доску) и нажми «создать доску»');
      else if (!all.length) note.textContent = clSearch ? L('досок по этому запросу нет') : L('досок такого типа пока нет');
      else note.textContent = L('досок: ') + all.length + L(' · доски этого чата стоят первыми · тап по доске — открыть');
    }
    for (var m = 0; m < CLOSETS.length; m++) CLOSETS[m].lazy(grid, lists[m]);
    closetFoundPaint();
  }

  function clBoardHit(b, q) {
    if (String(b.ownerName || '').toLowerCase().indexOf(q) >= 0) return true;
    for (var i = 0; i < b.items.length; i++) {
      var it = b.items[i];
      if ([it.name, it.tag, it.lore, it.copy].join('\n').toLowerCase().indexOf(q) >= 0) return true;
    }
    return false;
  }

  function closetFoundPaint() {
    var host = D.getElementById('iig_cl_found');

    host.innerHTML = '';
    note.textContent = '';
    if (!clSearch) return;
    var n = 0;
    for (var i = 0; i < CLOSETS.length; i++) {
      if (clFilter && clFilter !== CLOSETS[i].conf.kind) continue;
      var cards = CLOSETS[i].find(clSearch);
      for (var j = 0; j < cards.length && n < 40; j++, n++) host.appendChild(cards[j]);
